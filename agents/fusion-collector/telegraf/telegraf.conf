[global_tags]

[agent]
  interval = "5s"
  round_interval = true
  metric_buffer_limit = 100000
  flush_buffer_when_full = true
  collection_jitter = "0s"
  flush_interval = "2s"
  flush_jitter = "0s"
  debug = false
  quiet = false

[[inputs.http_listener_v2]]
  service_address = ":8080"
  read_timeout = "10s"
  write_timeout = "10s"
  max_body_size = "32MiB"

[[inputs.nats_consumer]]
  servers = ["${METRIC_NATS_SERVERS:-nats://nats:4222}"]
  jetstream_subjects = ["metrics.*"]
  queue_group = "metrics_consumers"
  data_format = "influx"
  username = "${METRIC_NATS_USERNAME:-admin}"
  password = "${METRIC_NATS_PASSWORD:-password}"

# MySQL 复制 IO/SQL 可能是字符串 Yes/No，也可能已是整数 1/0。
# enum 会把整数格式化成 "1"/"0" 再查表。只认 Yes 且 default=0 时，
# 正在运行会被写成 0。两种都映射，不设 default。Replica 字段与节点模板一致。
[[processors.enum]]
  namepass = ["mysql"]

  [[processors.enum.mapping]]
    field = "slave_slave_io_running"
    dest = "slave_slave_io_running_int"
    [processors.enum.mapping.value_mappings]
      Yes = 1
      "1" = 1
      No = 0
      "0" = 0
      Connecting = 0
      Preparing = 0

  [[processors.enum.mapping]]
    field = "slave_slave_sql_running"
    dest = "slave_slave_sql_running_int"
    [processors.enum.mapping.value_mappings]
      Yes = 1
      "1" = 1
      No = 0
      "0" = 0
      Preparing = 0

  [[processors.enum.mapping]]
    field = "slave_replica_io_running"
    dest = "slave_replica_io_running_int"
    [processors.enum.mapping.value_mappings]
      Yes = 1
      "1" = 1
      No = 0
      "0" = 0
      Connecting = 0
      Preparing = 0

  [[processors.enum.mapping]]
    field = "slave_replica_sql_running"
    dest = "slave_replica_sql_running_int"
    [processors.enum.mapping.value_mappings]
      Yes = 1
      "1" = 1
      No = 0
      "0" = 0
      Preparing = 0

[[outputs.influxdb]]
  urls = ["${METRIC_OUTPUT_URL:-http://victoria-metrics:8428}"]
  database = "victoriametrics"
  skip_database_creation = true
  exclude_retention_policy_tag = true
  content_encoding = "gzip"
