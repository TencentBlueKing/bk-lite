name: weblogic
version: 2.0.0
category: webserver
metadata:
  display_name: WebLogic 应用服务器
  description: WebLogic 应用服务器采集插件，支持脚本方式采集
  author: WeOps
  tags:
  - webserver
  - weblogic
  - java
  - oracle
  cloud_protocol: false
  model_id: weblogic
executors:
  job:
    type: job
    timeout: 60
    scripts:
      linux: plugins/inputs/weblogic/weblogic_default_discover.sh
    collector:
      module: plugins.script_executor
      class: SSHPlugin
    default_script: linux
    target_policy:
      mode: remote_channel
default_executor: job
