name: qcloud
version: 2.0.0
category: cloud
metadata:
  display_name: 腾讯云平台
  description: 腾讯云平台资源采集插件
  author: WeOps
  tags:
  - cloud
  - qcloud
  - tencent
  cloud_protocol: true
  model_id: qcloud
executors:
  protocol:
    type: protocol
    execution_mode: sync
    capacity_group: sync_sdk
    collector:
      module: plugins.inputs.qcloud.qcloud_info
      class: TencentCloudManager
    target_policy:
      mode: cloud_endpoint
      tls: true
      trusted_domains:
      - tencentcloudapi.com
default_executor: protocol
