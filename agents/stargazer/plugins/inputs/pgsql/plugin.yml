name: pgsql
version: 2.0.0
category: database
metadata:
  display_name: PostgreSQL 数据库
  description: PostgreSQL 数据库采集插件，支持脚本方式采集
  author: WeOps
  tags:
  - database
  - postgresql
  - pgsql
  cloud_protocol: false
  model_id: pgsql
executors:
  job:
    type: job
    timeout: 60
    scripts:
      linux: plugins/inputs/pgsql/pgsql_default_discover.sh
    collector:
      module: plugins.script_executor
      class: SSHPlugin
    default_script: linux
    target_policy:
      mode: remote_channel
default_executor: job
