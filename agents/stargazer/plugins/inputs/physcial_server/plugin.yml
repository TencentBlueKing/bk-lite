name: physcial_server
version: 2.0.0
category: infrastructure
metadata:
  display_name: 物理服务器
  description: 物理服务器硬件信息采集插件，支持脚本方式采集
  author: WeOps
  tags:
  - infrastructure
  - server
  - hardware
  cloud_protocol: false
  model_id: physcial_server
executors:
  job:
    type: job
    execution_mode: remote
    capacity_group: remote_job
    scripts:
      linux: plugins/inputs/physcial_server/physcial_server_default_discover.sh
      windows: plugins/inputs/physcial_server/physcial_server_discover.ps1
    collector:
      module: plugins.inputs.physcial_server.physcial_server_info
      class: PhyscialServerInfo
    default_script: linux
    target_policy:
      mode: remote_channel
  protocol:
    type: protocol
    execution_mode: sync
    capacity_group: sync_sdk
    collector:
      module: plugins.inputs.physcial_server.physcial_server_info
      class: PhyscialServerIPMIInfo
    target_policy:
      mode: udp
      port: 623
default_executor: job
