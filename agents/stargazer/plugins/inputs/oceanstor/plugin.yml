name: oceanstor
version: 1.0.0
category: storage
metadata:
  display_name: 华为 OceanStor 存储【BETA】
  description: 华为 OceanStor 存储采集插件（Beta），DeviceManager REST 采集设备及存储池/磁盘/卷
  author: WeOps
  tags:
  - storage
  - oceanstor
  - huawei
  - beta
  cloud_protocol: true
  model_id: storage
executors:
  protocol:
    type: protocol
    timeout: 120
    collector:
      module: plugins.inputs.oceanstor.oceanstor_info
      class: OceanStorManager
    target_policy:
      mode: tls
      port: 8088
      tls: true
default_executor: protocol
