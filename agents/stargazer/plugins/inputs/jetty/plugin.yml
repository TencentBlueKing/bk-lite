name: jetty
version: 2.0.0
category: webserver
metadata:
  display_name: Jetty 应用服务器
  description: Jetty 应用服务器采集插件，支持脚本方式采集
  author: WeOps
  tags:
  - webserver
  - jetty
  - java
  cloud_protocol: false
  model_id: jetty
executors:
  job:
    type: job
    timeout: 60
    scripts:
      linux: plugins/inputs/jetty/jetty_default_discover.sh
    collector:
      module: plugins.script_executor
      class: SSHPlugin
    default_script: linux
    target_policy:
      mode: remote_channel
default_executor: job
