name: network
version: 2.0.0
category: network
metadata:
  display_name: SNMP 网络设备
  description: SNMP 网络设备采集插件，支持协议方式采集
  author: WeOps
  tags:
  - network
  cloud_protocol: false
  model_id: network
executors:
  protocol:
    type: protocol
    execution_mode: async
    capacity_group: snmp
    probe_timeout: 25
    collector:
      module: plugins.inputs.network.snmp_facts
      class: SnmpFacts
    target_policy:
      mode: snmp
      port: 161
default_executor: protocol
