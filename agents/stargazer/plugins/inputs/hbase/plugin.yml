name: hbase
version: 2.0.0
category: middleware
metadata:
  display_name: HBase 分布式数据库
  description: HBase 分布式数据库采集插件，支持脚本方式采集
  author: WeOps
  tags:
  - middleware
  - hbase
  - hadoop
  cloud_protocol: false
  model_id: hbase
executors:
  job:
    type: job
    timeout: 60
    scripts:
      linux: plugins/inputs/hbase/hbase_default_discover.sh
    collector:
      module: plugins.script_executor
      class: SSHPlugin
    default_script: linux
    target_policy:
      mode: remote_channel
default_executor: job
