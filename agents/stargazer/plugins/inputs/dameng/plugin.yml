name: dameng
version: 2.0.0
category: database
metadata:
  display_name: 达梦数据库
  description: 达梦数据库采集插件，支持脚本方式采集
  author: WeOps
  tags:
  - database
  - dameng
  cloud_protocol: false
  model_id: dameng
executors:
  job:
    type: job
    timeout: 60
    scripts:
      linux: plugins/inputs/dameng/dameng_default_discover.sh
    collector:
      module: plugins.script_executor
      class: SSHPlugin
    default_script: linux
    target_policy:
      mode: remote_channel
default_executor: job
