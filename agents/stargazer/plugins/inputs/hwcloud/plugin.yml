name: hwcloud
version: 1.0.0
category: cloud
metadata:
  display_name: 华为云平台
  description: 华为云平台资源采集插件（平台 + ECS）
  author: WeOps
  tags:
  - cloud
  - huaweicloud
  - huawei
  cloud_protocol: true
  model_id: hwcloud
executors:
  protocol:
    type: protocol
    execution_mode: sync
    capacity_group: sync_sdk
    timeout: 300
    collector:
      module: plugins.inputs.hwcloud.huaweicloud_info
      class: HuaweiCloudManager
    target_policy:
      mode: cloud_endpoint
      tls: true
      trusted_domains:
      - myhuaweicloud.com
      - huaweicloud.com
default_executor: protocol
