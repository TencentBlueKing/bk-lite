name: tomcat
version: 2.0.0
category: webserver
metadata:
  display_name: Tomcat 应用服务器
  description: Tomcat 应用服务器采集插件，支持脚本方式采集
  author: WeOps
  tags:
  - webserver
  - tomcat
  - java
  cloud_protocol: false
  model_id: tomcat
executors:
  job:
    type: job
    timeout: 60
    scripts:
      linux: plugins/inputs/tomcat/tomcat_default_discover.sh
    collector:
      module: plugins.script_executor
      class: SSHPlugin
    default_script: linux
    target_policy:
      mode: remote_channel
default_executor: job
