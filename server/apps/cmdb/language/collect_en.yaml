COLLECT_MESSAGE:
  未发现任何有效数据，请检查采集目标连通性、凭据与采集范围配置: No valid data found. Check target connectivity, credentials, and collection scope.
  未发现 PC 最新上报结果，请检查目标采集是否已完成及数据上报时间: No latest PC report found. Check whether collection finished and data was reported.
  本轮采集结果全部失败，请检查原始数据中的采集错误: All results in this round failed. Check collection errors in the raw data.
  实例数据写入全部失败，请检查 add/update/delete 错误数: All instance writes failed. Check add/update/delete error counts.
  部分采集或数据写入失败，请检查原始数据及错误数: Some collection or writes failed. Check raw data and error counts.
  采集任务下发失败，请稍后重试: Failed to dispatch the collection task. Please try again later.
