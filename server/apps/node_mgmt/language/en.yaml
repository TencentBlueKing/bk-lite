controller_status:
  abnormal: Abnormal
  not_installed: Not Installed
  normal: Normal
controller:
  linux:
    name: Linux Controller
    description: Linux Controller is the Sidecar used to manage Linux nodes and hosted
      components, enabling automated deployment, resource coordination, and task execution.
      NATS-Executor and Ansible-Executor are managed separately as hosted components.
  windows:
    description: Windows Controller is the Sidecar used to manage Windows nodes and
      hosted components, enabling automated deployment, resource coordination, and
      task execution. NATS-Executor is managed separately as a hosted component.
    name: Windows Controller
controller_install_method:
  manual: Manual Installation
  auto: Remote installation
