_legacy: true
monitor_object_plugin:
  ActiveMQ-JMX:
    name: ActiveMQ-JMX
    desc: The ActiveMQ plugin, based on JMX collection, acquires key performance metrics
      such as message queues, connection pools, and message throughput. It enables
      real-time monitoring of message processing efficiency and resource utilization,
      helping optimize system performance and ensure service stability.
  Bastion Host SNMP General:
    desc: The SNMP universal plugin is designed to monitor and manage bastion hosts
      via SNMP. It enables administrators to retrieve critical device information
      such as interface traffic, error statistics, and status data, thereby optimizing
      network performance and improving operational efficiency.
    name: Bastion Host General (SNMP)
  ClickHouse:
    desc: Collect runtime metrics from ClickHouse instances, such as memory, disk,
      and query events, for performance monitoring, resource tracking, and fault diagnosis
      to ensure stable database operation.
    name: ClickHouse
  DM-Exporter:
    name: Dameng Database Monitoring Exporter
    desc: Deploy the Dameng database monitoring exporter through DM-Exporter to collect
      core metrics such as sessions, locks, tablespaces, memory usage, and slow queries.
  Detection Device SNMP General:
    name: Detection Device General (SNMP)
    desc: The SNMP universal plugin is used to monitor and manage detected devices
      via SNMP. Administrators can retrieve critical device information such as interface
      traffic, error statistics, and status information, thereby optimizing network
      performance and enhancing management efficiency.
  Jetty-JMX:
    desc: Through the Jetty JMX collector, regularly collect key performance metrics
      from Jetty, including task processing, thread pools, network connections, HTTP
      configuration, and JMX self-monitoring data.
    name: Jetty(JMX)
  Kafka:
    name: Kafka(Exporter)
    desc: Through the Kafka Exporter collector, regularly gather metrics from Kafka
      clusters, including topic statistics, partition counts, consumer group status,
      and more, to help monitor the health and performance of Kafka clusters.
  OceanStor:
    name: OceanStor Storage (Telegraf)
    desc: Through the Telegraf collector, utilize the DeviceManager REST API to regularly
      collect performance metrics from Huawei OceanStor storage pools, drives, and
      LUN volumes, including IOPS, throughput, and response time.
  Oracle:
    desc: The Oracle Exporter collector regularly gathers metrics from Oracle, including
      uptime, operation counts, transaction commits and rollbacks, as well as various
      wait times.
    name: Oracle(Exporter)
  SNMP Trap:
    desc: The SNMP Trap monitoring plugin is designed to receive and process alerts
      or status notifications (Trap messages) actively pushed by network devices,
      enabling real-time monitoring and fault alerting.
    name: SNMP Trap
  Scanning Device SNMP General:
    name: Scanning Device General (SNMP)
    desc: The SNMP universal plugin is used to monitor and manage scanned devices
      via SNMP. Administrators can retrieve critical device information such as interface
      traffic, error statistics, and status information, thereby optimizing network
      performance and enhancing management efficiency.
  Storage CeresData SNMP:
    name: CeresData (Telegraf)
    desc: CeresData all-flash storage SNMP collection (enterprise PEN 25359). Beyond
      standard MIB-II / IF-MIB device uptime and 64-bit HC interface traffic, it collects
      vendor private health — system-disk status, physical-disk status and storage-pool
      health. Raw value 1 is conservatively normalized to healthy while every other
      value is treated as fault, with the worst disk or storage pool taken per instance.
      Controller CPU, memory, temperature, fan and power-supply health gauges are
      not exposed by the current profile, so they are N/A and not faked.
  Storage Dell PowerVault SNMP:
    name: Dell PowerVault (Telegraf)
    desc: Dell PowerVault / EqualLogic storage SNMP collection (EqualLogic enterprise
      PEN 12740). Beyond standard MIB-II / IF-MIB device uptime and 64-bit HC interface
      traffic, it collects vendor private health — controller CPU utilization (cpmCPUTotal5min,
      direct percent), controller processor and chipset temperatures, physical disk
      status (eqlDiskStatus), and iSCSI volume administrative status (eqliscsiVolumeAdminStatus),
      normalized to 1=healthy / 2=fault with the worst component taken per instance.
      Capacity, disk RPM, CPU frequency and physical RAM are specification/capacity
      values, so they are not collected as health metrics. Supported brands/models
      — Dell PowerVault / EqualLogic PS and MD-family storage arrays.
  Storage Dell SC8000 SNMP:
    name: Dell SC8000 (Telegraf)
    desc: Dell SC8000 / Compellent storage SNMP collection (Dell EMC enterprise PEN
      674). Beyond standard MIB-II / IF-MIB device uptime and 64-bit HC interface
      traffic, it collects vendor private health — physical disk status and healthy
      flag (scDiskStatus / scDiskHealthy), controller fan status (scCtlrFanStatus),
      and controller power-supply status (scCtlrPowerStatus), normalized to 1=healthy
      / 2=fault with the worst component taken per instance. This profile exposes
      no pollable controller CPU, memory, or temperature gauge, so CPU, memory, and
      temperature are N/A and not faked. Supported brands/models — Dell SC8000 / Compellent
      SC Series storage arrays.
  Storage Fujitsu SNMP:
    name: Fujitsu (Telegraf)
    desc: Fujitsu ETERNUS storage-array SNMP collection (enterprise PEN 211, fjdary-MIB).
      Beyond standard MIB-II / IF-MIB device uptime and 64-bit HC interface traffic,
      it collects vendor private health — chassis temperature sensors (fjdaryMachineTempInfo,
      read directly in degrees Celsius with no scaling), RAID group state (fjdaryMgtRaidGrpStatus),
      and logical volume state (fjdaryMgtOpVolumeStatus). The raw RAID and volume
      enum ok(2) is normalized to 1=healthy while unknown/degraded/error/dormant are
      normalized to 2=fault, with the worst array or volume taken per instance. This
      MIB does not publish pollable controller CPU or memory utilization, the power
      object is a wattage reading rather than a state enum, and no fan-state object
      is available, so CPU, memory, fan, and power are N/A and not faked. Supported
      brands/models — Fujitsu ETERNUS DX storage arrays.
  Storage Hikvision SNMP:
    name: Hikvision (Telegraf)
    desc: Hikvision Brainware storage SNMP collection (local private MIB tree PEN
      99999). Beyond standard MIB-II / IF-MIB device uptime and 64-bit HC interface
      traffic, it collects vendor private health — CPU, memory, CPU temperature, disk,
      RAID, power-supply and CPU fan status. Raw status value 1 is normalized to healthy
      and every other value is treated as fault, with the worst component taken per
      instance. Capacity and IO-rate metrics are not collected as shared health metrics.
  Storage IPMI:
    desc: Through the Telegraf collector, utilize the IPMI protocol to regularly collect
      key metrics from storage devices, including power status, fan speed, and temperature.
    name: Storage IPMI General (Telegraf)
  Storage Inspur SNMP:
    name: Inspur (Telegraf)
    desc: Inspur AS5500 storage SNMP collection (enterprise PEN 48512). Beyond standard
      MIB-II / IF-MIB device uptime and 64-bit HC interface traffic, it collects vendor
      private hardware health — managed-disk status, physical-drive availability and
      power-supply state. Raw value 1 is conservatively normalized to healthy while
      every other value is treated as fault, with the worst component taken per instance.
      Controller CPU, memory, temperature and fan health gauges are not exposed by
      the current profile, so they are N/A and not faked.
  Storage MacroSAN SNMP:
    name: MacroSAN (Telegraf)
    desc: MacroSAN storage-array SNMP collection (enterprise PEN 35904). Beyond standard
      MIB-II / IF-MIB device uptime and 64-bit HC interface traffic, it collects full
      vendor private health — controller CPU utilization (cpuRate, direct percent),
      controller memory utilization (vmRate, direct percent usage with no used/free
      split), and fan, power-supply and disk health state (fanState / powerState /
      diskHealthState, normalized to 1=normal / 2=fault, worst row per instance).
      Temperature is N/A. Supported brands/models — MacroSAN MS series SAN/NAS storage
      arrays (enterprise PEN 35904).
  Storage NetApp SNMP:
    name: NetApp (Telegraf)
    desc: NetApp storage SNMP collection (enterprise PEN 789). Beyond standard MIB-II
      / IF-MIB device uptime and 64-bit HC interface traffic, it collects vendor private
      health — controller CPU busy time (cpuBusyTimePerCent, direct percent) and RAID
      disk-drive state (raidStatus, active=normal normalized to 1=healthy / 2=fault,
      worst disk per instance). The environment scalars (failed fan / power-supply
      counts, over-temperature) are count/boolean types not mapped into the shared-disk
      enum semantics, so temperature, fan and power are N/A and not faked pending
      field verification. Supported brands/models — NetApp FAS / AFF storage systems
      running Data ONTAP (enterprise PEN 789).
  Storage SNMP General:
    desc: Through the Telegraf collector, utilize the SNMP protocol to regularly collect
      key IF-MIB metrics from storage device interfaces, including traffic volume,
      packet loss, and error counts.
    name: Storage SNMP General (Telegraf)
  Storage Sugon SNMP:
    name: Sugon (Telegraf)
    desc: Sugon ParaStor storage SNMP collection (enterprise PEN 35904; ParaStor reuses
      the MacroSAN private tree). Beyond standard MIB-II / IF-MIB device uptime and
      64-bit HC interface traffic, it collects vendor private hardware health — fan,
      power-supply and disk operational state (fanState / powerState / diskState,
      normalized to 1=normal / 2=fault, worst row per instance). This profile exposes
      no controller-level CPU or memory gauge, so CPU, memory and temperature are
      N/A and not faked. Supported brands/models — Sugon ParaStor distributed storage
      arrays (enterprise PEN 35904).
  Storage Synology SNMP:
    name: Synology (Telegraf)
    desc: Synology NAS storage SNMP collection (enterprise PEN 6574). Beyond standard
      MIB-II / IF-MIB device uptime and 64-bit HC interface traffic, it collects vendor
      private health — chassis temperature (synologyTemperature, read directly in
      degrees Celsius with no scaling), system fan and power-supply operational state
      (synologySystemFanStatus / synologyPowerStatus, natively 1=normal / 2=fault),
      and RAID/volume array state (synologyRaidStatus, normalized by the worst array
      to 1=healthy / 2=fault). The private tree exposes only a coarse normal/failed
      system-status code with no pollable system-level CPU or memory gauge, so CPU
      and memory are N/A and not faked. Supported brands/models — Synology DiskStation
      / RackStation NAS running DSM (DS / RS / FS / SA series).
  Tomcat-JMX:
    desc: Collect key performance metrics from Tomcat, such as thread pools, HTTP
      connections, JVM memory, and request latency via JMX to monitor operational
      status and resource efficiency, facilitating performance optimization and troubleshooting.
    name: Tomcat-JMX
  WebLogic-JMX:
    name: WebLogic(JMX)
    desc: Through the WebLogic-JMX collector, regularly collect key WebLogic metrics,
      including thread pool, connection pool, memory, EJB, Servlet, JMS performance,
      and web service response times.
