_legacy: true
monitor_object_plugin:
  ActiveMQ-JMX:
    name: ActiveMQ-JMX
    desc: 该 ActiveMQ 插件基于 JMX 采集，可获取消息队列、连接池、消息吞吐量等关键性能指标，实时监控消息处理效率与资源使用情况，助力优化系统性能，保障服务稳定。
  Bastion Host SNMP General:
    desc: SNMP 通用插件用于通过 SNMP 监控和管理堡垒机的监控情况。管理员可以获取有关设备的关键信息，例如 接口流量、错误统计和状态信息等，从而优化网络性能和提高管理效率。
    name: 堡垒机通用（SNMP）
  ClickHouse:
    desc: 采集ClickHouse实例运行时指标，如内存、磁盘、查询事件等，用于性能监控、资源跟踪及故障诊断，保障数据库稳定运行。
    name: ClickHouse
  DM-Exporter:
    name: 达梦数据库监控探针
    desc: 通过 DM-Exporter 下发达梦数据库监控探针，采集会话、锁、表空间、内存、慢查询等核心监控指标，帮助快速掌握数据库运行状态与性能变化。
  Detection Device SNMP General:
    name: 检测设备通用（SNMP）
    desc: SNMP 通用插件用于通过 SNMP 监控和管理检测设备的监控情况。管理员可以获取有关设备的关键信息，例如 接口流量、错误统计和状态信息等，从而优化网络性能和提高管理效率。
  Jetty-JMX:
    desc: 通过Jetty JMX采集器定期收集Jetty的任务处理、线程池、网络连接、HTTP 配置以及JMX自监控等关键性能指标。
    name: Jetty（JMX）
  Kafka:
    name: Kafka（Exporter）
    desc: 通过Kafka Exporter采集器定期收集Kafka集群的主题统计、分区数量、消费者组状态等指标，帮助监控Kafka集群的健康和性能。
  OceanStor:
    name: OceanStor存储（Telegraf）
    desc: 通过Telegraf采集器利用DeviceManager REST API定期收集华为OceanStor存储池、硬盘、LUN卷的IOPS、吞吐量和响应时间等性能指标。
  Oracle:
    desc: 通过Oracle Exporter采集器定期采集Oracle运行时长、操作次数、事务提交回滚及各类等待时间等指标。
    name: Oracle（Exporter）
  SNMP Trap:
    desc: SNMP Trap监控插件用于接收和处理网络设备主动推送的报警或状态通知（Trap消息），以实现实时监控和故障告警。
    name: SNMP Trap
  Scanning Device SNMP General:
    name: 扫描设备通用（SNMP）
    desc: SNMP 通用插件用于通过 SNMP 监控和管理扫描设备的监控情况。管理员可以获取有关设备的关键信息，例如 接口流量、错误统计和状态信息等，从而优化网络性能和提高管理效率。
  Storage CeresData SNMP:
    name: 希磁 CeresData（Telegraf）
    desc: CeresData 全闪存储 SNMP 采集（企业号 PEN 25359）。在标准 MIB-II / IF-MIB 设备运行时长与 64 位 HC
      接口流量之外，采集厂商私有健康量——系统磁盘状态、物理磁盘状态与存储池健康度。状态值 1 保守归一为正常，其余均归一为异常，并按实例取最差磁盘或存储池。当前
      profile 未暴露控制器 CPU、内存、温度、风扇和电源健康 gauge，故这些指标为 N/A，不伪造。
  Storage Dell PowerVault SNMP:
    name: Dell PowerVault（Telegraf）
    desc: Dell PowerVault / EqualLogic 存储 SNMP 采集（EqualLogic 企业号 PEN 12740）。在标准 MIB-II
      / IF-MIB 设备运行时长与 64 位 HC 接口流量之外，采集厂商私有健康量——控制器 CPU 使用率（cpmCPUTotal5min，直接百分比）、控制器处理器/芯片温度、物理磁盘状态（eqlDiskStatus）和
      iSCSI 卷管理状态（eqliscsiVolumeAdminStatus），统一归一为 1=正常 / 2=异常，并按实例取最差组件。容量、磁盘转速、CPU
      频率和物理内存大小属于规格/容量信息，不作为健康指标采集。适用品牌型号——Dell PowerVault / EqualLogic PS 与 MD 系列存储。
  Storage Dell SC8000 SNMP:
    name: Dell SC8000（Telegraf）
    desc: Dell SC8000 / Compellent 存储 SNMP 采集（Dell EMC 企业号 PEN 674）。在标准 MIB-II / IF-MIB
      设备运行时长与 64 位 HC 接口流量之外，采集厂商私有健康量——物理磁盘状态与健康标志（scDiskStatus / scDiskHealthy）、控制器风扇状态（scCtlrFanStatus）和控制器电源状态（scCtlrPowerStatus），统一归一为
      1=正常 / 2=异常，并按实例取最差组件。该 profile 未暴露可轮询的控制器 CPU、内存或温度 gauge，故 CPU、内存、温度为 N/A，不伪造。适用品牌型号——Dell
      SC8000 / Compellent SC Series 存储阵列。
  Storage Fujitsu SNMP:
    name: 富士通 Fujitsu（Telegraf）
    desc: Fujitsu ETERNUS 存储阵列 SNMP 采集（企业号 PEN 211，fjdary-MIB）。在标准 MIB-II / IF-MIB
      设备运行时长与 64 位 HC 接口流量之外，采集厂商私有健康量——机箱温度传感器（fjdaryMachineTempInfo，摄氏度直采无缩放）、RAID
      组状态（fjdaryMgtRaidGrpStatus）与逻辑卷状态（fjdaryMgtOpVolumeStatus）。RAID/卷原始枚举 ok(2)
      归一为 1=正常，其余 unknown/degraded/error/dormant 归一为 2=异常，并按实例取最差阵列或卷。该 MIB 未发布可轮询的控制器
      CPU/内存利用率，电源对象为瓦数读数而非状态枚举，且无风扇状态对象，故 CPU、内存、风扇、电源为 N/A，不伪造。适用品牌型号——Fujitsu ETERNUS
      DX 存储阵列。
  Storage Hikvision SNMP:
    name: 海康 Hikvision（Telegraf）
    desc: 海康 Hikvision Brainware 存储 SNMP 采集（本地私有 MIB 树 PEN 99999）。在标准 MIB-II / IF-MIB
      设备运行时长与 64 位 HC 接口流量之外，采集厂商私有健康量——CPU、内存、CPU 温度、磁盘、RAID、电源和 CPU 风扇状态；状态值 1 归一为正常，其余归一为异常，并按实例取最差组件。容量与
      IO 速率为规格/性能项，不作为共享健康指标采集。
  Storage IPMI:
    desc: 通过Telegraf采集器利用IPMI协议定期收集存储设备的电源状态、风扇转速、温度等关键指标。
    name: 存储设备IPMI通用（Telegraf）
  Storage Inspur SNMP:
    name: 浪潮 Inspur（Telegraf）
    desc: Inspur AS5500 存储 SNMP 采集（企业号 PEN 48512）。在标准 MIB-II / IF-MIB 设备运行时长与 64 位
      HC 接口流量之外，采集厂商私有硬件健康量——受管磁盘状态、物理盘可用性与电源状态。状态值 1 保守归一为正常，其余均归一为异常，并按实例取最差组件。当前
      profile 未暴露控制器 CPU、内存、温度和风扇健康 gauge，故这些指标为 N/A，不伪造。
  Storage MacroSAN SNMP:
    name: 宏杉 MacroSAN（Telegraf）
    desc: 宏杉 MacroSAN 存储阵列 SNMP 采集（企业号 PEN 35904）。在标准 MIB-II / IF-MIB 设备运行时长与 64 位
      HC 接口流量之外，采集完整厂商私有健康量——控制器 CPU 利用率（cpuRate，直接百分比）、控制器内存利用率（vmRate，直接百分比，无 used/free
      拆分）、风扇/电源/磁盘健康状态（fanState / powerState / diskHealthState，归一为 1=正常 / 2=异常，按实例取最差行）。温度为
      N/A。适用品牌型号——宏杉 MS 系列 SAN/NAS 存储阵列（企业号 PEN 35904）。
  Storage NetApp SNMP:
    name: NetApp（Telegraf）
    desc: NetApp 存储 SNMP 采集（企业号 PEN 789）。在标准 MIB-II / IF-MIB 设备运行时长与 64 位 HC 接口流量之外，采集厂商私有健康量——控制器
      CPU 繁忙时间（cpuBusyTimePerCent，直接百分比）与 RAID 磁盘驱动器状态（raidStatus，active 正常归一为 1=正常
      / 2=异常，按实例取最差磁盘行）。环境标量（风扇/电源失效计数、超温）为计数/布尔型，未纳入共享盘 enum 语义，故温度、风扇、电源为 N/A，不伪造，待现网核验后扩展。适用品牌型号——NetApp
      FAS / AFF 存储系统（Data ONTAP，企业号 PEN 789）。
  Storage SNMP General:
    desc: 通过Telegraf采集器利用SNMP协议定期收集存储设备各接口的流量、丢包数、错包数等IF-MIB关键指标。
    name: 存储设备SNMP通用（Telegraf）
  Storage Sugon SNMP:
    name: 曙光 Sugon（Telegraf）
    desc: 曙光 Sugon ParaStor 存储 SNMP 采集（企业号 PEN 35904；ParaStor 复用宏杉私有树）。在标准 MIB-II
      / IF-MIB 设备运行时长与 64 位 HC 接口流量之外，采集厂商私有硬件健康量——风扇/电源/磁盘运行状态（fanState / powerState
      / diskState，归一为 1=正常 / 2=异常，按实例取最差行）。本 profile 未暴露控制器级 CPU / 内存 gauge，故 CPU、内存、温度为
      N/A，不伪造。适用品牌型号——曙光 ParaStor 分布式存储阵列（企业号 PEN 35904）。
  Storage Synology SNMP:
    name: 群晖 Synology（Telegraf）
    desc: 群晖 Synology NAS 存储 SNMP 采集（企业号 PEN 6574）。在标准 MIB-II / IF-MIB 设备运行时长与 64
      位 HC 接口流量之外，采集厂商私有健康量——机箱温度（synologyTemperature，直采摄氏度无缩放）、系统风扇与电源运行状态（synologySystemFanStatus
      / synologyPowerStatus，原生 1=正常 / 2=异常）、RAID/卷阵列状态（synologyRaidStatus，按最差阵列归一为
      1=正常 / 2=异常）。私有树仅暴露粗粒度 normal/failed 系统状态码，无可轮询的系统级 CPU / 内存 gauge，故 CPU、内存为
      N/A，不伪造。适用品牌型号——群晖 DiskStation / RackStation NAS（DSM 系统，DS / RS / FS / SA 系列）。
  Tomcat-JMX:
    desc: 通过 JMX 采集 Tomcat 线程池、HTTP 连接、JVM 内存、请求耗时等关键性能指标，监控运行状态与资源效率，辅助优化性能及排查故障。
    name: Tomcat-JMX
  WebLogic-JMX:
    name: WebLogic（JMX）
    desc: 通过WebLogic-JMX采集器定期收集WebLogic关键指标，包括线程池、连接池、内存、EJB、Servlet、JMS 性能及 Web 服务响应时间等。
