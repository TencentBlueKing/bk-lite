Transmission FiberRoad SNMP:
  name: FiberRoad（Telegraf）
  desc: 面向 FiberRoad 光电转换机箱的 SNMP 监控模板，可采集机框温度、风扇状态、双路电源及电压状态、运行时长和接口流量（企业号 PEN 6688）。
monitor_object:
  Transmission: 传输设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Transmission:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示 FiberRoad 机箱自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_temperature_celsius:
      name: 机框温度
      desc: FiberRoad 各机框机箱温度，单位为摄氏度。超出 -40 到 125 摄氏度的读数会被丢弃。温度偏高可能表示散热异常、环境温度过高或硬件过载。
    device_fan_state:
      name: 风扇状态
      desc: FiberRoad 各机框风扇运行状态，on 归一为正常、off 归一为异常，nc 不上报。非正常状态表示风扇停转或散热模块异常。
    device_psu_state:
      name: 电源状态
      desc: FiberRoad 各机框 A/B 路电源开关状态，on 归一为正常、off 归一为异常，nc 不上报。非正常状态表示对应电源关闭或供电中断。
    device_psu_voltage_state:
      name: 电源电压状态
      desc: FiberRoad 各机框 A/B 路电源电压状态，normal 归一为正常、abnormal 归一为异常，nc 不上报。非正常状态表示对应电源电压异常。
monitor_object_metric_group:
  Transmission:
    Base: 基础
    Traffic: 流量
    Temperature: 温度
    Hardware Status: 硬件状态
