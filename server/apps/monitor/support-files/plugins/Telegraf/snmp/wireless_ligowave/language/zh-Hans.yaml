Wireless LigoWave SNMP:
  name: LigoWave（Telegraf）
  desc: 面向 LigoWave 无线设备的 SNMP 监控模板，可采集运行时长、接口流量（企业号 PEN 32750）。
monitor_object:
  Wireless: 无线设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_cpu_usage:
      name: CPU 使用率
      desc: 无线设备的整体 CPU 使用率，以 0-100 百分比直接上报。持续偏高可能表示客户端关联负载过高、控制平面压力或射频管理开销过大，会影响漫游与管理响应。
    device_memory_usage:
      name: 内存使用率
      desc: 无线设备的整体内存使用率，以 0-100 百分比直接上报。内存压力过高会导致接入点丢弃客户端关联或重启服务，需及时排查客户端数量或异常负载。
    device_temperature_celsius:
      name: 温度
      desc: 无线设备机箱温度（摄氏度，直采无缩放）。仅带温度传感器的机型返回真实值，无风扇接入点返回 0。温度过高可能表示散热失效或气流不畅，存在过热停机风险。
    rx_signal_level_0:
      name: 天线 0 RSSI
      desc: Radio3 天线 0 最近接收信号电平（ligoRdo3RxLastSigLevel0）。按 ifIndex 与 endpoint 索引，Integer32
        不换算。RSSI 持续下降可能表示路径衰落、天线失准或射频劣化。
    rx_noise:
      name: 接收底噪
      desc: Radio3 接收底噪（ligoRdo3RxNoise）。按 ifIndex 与 endpoint 索引，Integer32 不换算。底噪升高会降低
        SNR 与链路裕量。
    rx_snr_0:
      name: 天线 0 SNR
      desc: Radio3 天线 0 最近信噪比（ligoRdo3RxLastSnr0）。按 ifIndex 与 endpoint 索引，Integer32 不换算。SNR
        持续下降可能表示路径衰落或干扰。
    tx_power:
      name: 发射功率
      desc: 可选 Radio3 发射功率（ligoRdo3TxPower）。按 ifIndex 与 endpoint 索引，Gauge32 不换算。部分固件或缺省行会跳过。发射功率异常偏低可能表示射频静默、硬件故障或配置变更。
    rx_signal_level_1:
      name: 天线 1 RSSI
      desc: 可选 Radio3 天线 1 最近接收信号电平（ligoRdo3RxLastSigLevel1）。按 ifIndex 与 endpoint 索引，Integer32
        不换算。缺天线的列由采集端跳过。
    rx_signal_level_2:
      name: 天线 2 RSSI
      desc: 可选 Radio3 天线 2 最近接收信号电平（ligoRdo3RxLastSigLevel2）。按 ifIndex 与 endpoint 索引，Integer32
        不换算。缺天线的列由采集端跳过。
monitor_object_metric_group:
  Wireless:
    Base: 基础
    Traffic: 流量
    Wireless: 无线
    Temperature: 温度
    Radio: 射频
