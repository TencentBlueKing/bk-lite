Router NetElastic SNMP:
  name: NetElastic（Telegraf）
  desc: 面向 NetElastic FlexBNG 宽带接入网关的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、接口流量（企业号 PEN 54268）。温度/风扇/电源本模板不采集。
monitor_object:
  Router: 路由器
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Router:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标报告 NetElastic FlexBNG 宽带接入网关的 CPU 使用率（cpuUsage，1.3.6.1.4.1.54268.1.8.1.1.0，Unsigned32
        0..100%，顶层 field+.0）。持续偏高说明控制平面或会话处理负载吃紧。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标报告 NetElastic FlexBNG 宽带接入网关的内存使用率（memUsage，1.3.6.1.4.1.54268.1.8.1.2.0，Unsigned32
        0..100%，顶层 field+.0）。持续偏高可能由会话表资源紧张或内存压力导致。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  Router:
    Base: 基础
    CPU: CPU
    Memory: 内存
    Traffic: 流量
