Router RACOM RipEX SNMP:
  name: RACOM RipEX (Telegraf)
  desc: SNMP monitoring template for RACOM RipEX2 radio modems and M!DGE3 cellular routers (RACOM-RA2-MIB,
    enterprise PEN 33555). It reports uptime, CPU, modem and radio board temperatures, supply input voltage,
    and interface traffic.
monitor_object:
  Router: Router
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Router:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart. By monitoring the uptime,
        network administrators can understand the stability and reliability of the device and identify
        potential reboot or failure issues.
    device_temperature_celsius:
      name: CPU Temperature
      desc: CPU temperature of the router in degrees Celsius. Persistently high values may indicate poor
        cooling or high ambient temperature.
    modem_temperature_celsius:
      name: Modem Temperature
      desc: Modem board temperature in degrees Celsius.
    radio_temperature_celsius:
      name: Radio Temperature
      desc: Radio board temperature in degrees Celsius. Absent on units without a primary radio.
    device_voltage_volts:
      name: Input Voltage
      desc: Supply input voltage in volts. Values drifting away from the nominal supply may indicate a
        power problem.
monitor_object_metric_group:
  Router:
    Base: Base
    Temperature: Temperature
    Hardware Status: Hardware Status
