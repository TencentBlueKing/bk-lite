ConsoleServer Lantronix SLC SNMP:
  name: Lantronix SLC 控制台服务器（Telegraf）
  desc: 面向 Lantronix SLC 控制台服务器的 SNMP 监控模板，可采集运行时长、温度、电源状态、会话/连接数、接口流量、湿度（企业号 PEN 244）。
monitor_object:
  ConsoleServer: 控制台服务器
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  ConsoleServer:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_temperature_celsius:
      name: 温度
      desc: Lantronix SLC 机箱内部温度，单位为摄氏度。温度偏高可能表示散热或环境温度风险。读数错误哨兵 9999 会被丢弃。
    device_psu_state:
      name: 电源状态
      desc: 控制台服务器电源状态汇总，统一归一为 1=正常、2=异常。电源 B 未安装不视为故障。
    psu_a_status:
      name: 电源 A 状态
      desc: Lantronix SLC 电源 A 状态，统一归一为正常或异常。
    psu_b_status:
      name: 电源 B 状态
      desc: Lantronix SLC 电源 B 状态，统一归一为正常或异常。未安装按正常处理。
    active_sessions:
      name: 活动会话数
      desc: 可选的控制台活动连接数，来自连接表行数。
    lantronix_port_temperature_celsius:
      name: 端口传感器温度
      desc: 可选的每端口传感器温度，单位为摄氏度。无数值读数的端口会被跳过。
    lantronix_port_humidity_percent:
      name: 端口传感器湿度
      desc: 可选的每端口传感器相对湿度百分比。无数值读数的端口会被跳过。
monitor_object_metric_group:
  ConsoleServer:
    Base: 基础
    Traffic: 流量
    Temperature: 温度
    Hardware Status: 硬件状态
    Power: 电源
    Sessions: 会话
    Humidity: 湿度
