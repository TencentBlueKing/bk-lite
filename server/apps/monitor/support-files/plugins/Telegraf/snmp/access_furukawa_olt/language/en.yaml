Access Furukawa OLT SNMP:
  name: Access Furukawa OLT SNMP
  desc: SNMP monitoring template for Furukawa OLT access device. It reports uptime, CPU utilization, memory
    utilization, temperature, and interface traffic, for Furukawa Electric LatAm OLT 3516 (FELOLT3500,
    enterprise PEN 10428).
monitor_object:
  Access: Access
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Access:
    interface_ifHCInOctets:
      name: Interface Incoming Traffic Rate
      desc: This metric indicates the average rate of bytes received over the past 5 minutes, measured
        in bytes per second, from the 64-bit IF-MIB ifHCInOctets counter (ifXTable). The 64-bit counter
        avoids the rapid wrap of the 32-bit ifInOctets on high-speed ports, keeping the rate accurate.
    interface_ifHCOutOctets:
      name: Interface Outgoing Traffic Rate
      desc: This metric calculates the average rate of bytes sent over the past 5 minutes, measured in
        bytes per second, from the 64-bit IF-MIB ifHCOutOctets counter (ifXTable). The 64-bit counter
        avoids the rapid wrap of the 32-bit ifOutOctets on high-speed ports, keeping the rate accurate.
    device_total_incoming_traffic:
      name: Device Total Incoming Traffic Rate
      desc: This metric indicates the average rate of total bytes received by the entire device over the
        past 5 minutes, measured in bytes per second, summed across all interfaces from the 64-bit ifHCInOctets
        counter. It helps administrators obtain an overview of incoming traffic for overall monitoring
        and capacity planning.
    device_total_outgoing_traffic:
      name: Device Total Outgoing Traffic Rate
      desc: This metric represents the average rate of total bytes sent by the entire device over the
        past 5 minutes, measured in bytes per second, summed across all interfaces from the 64-bit ifHCOutOctets
        counter. It helps administrators assess sending performance for traffic management and optimization.
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart, derived from sysUpTime.
        Monitoring uptime helps administrators understand device stability and identify unexpected reboots
        or failures.
    device_cpu_usage:
      name: CPU Usage
      desc: CPU load of the Furukawa OLT 3516 as a percentage (oltGenHwCpu). Sustained high load indicates
        control-plane pressure.
    device_memory_usage:
      name: Memory Usage
      desc: RAM utilization of the Furukawa OLT 3516, computed as (total - free) / total from oltGenHwMemTot
        and oltGenHwMemFree. Sustained high memory can indicate leaks or oversized service tables.
    device_temperature_celsius:
      name: Device Temperature
      desc: Chassis temperature of the Furukawa OLT 3516 in degrees Celsius (oltGenHwTemperature). Persistently
        high values may indicate cooling problems.
monitor_object_metric_group:
  Access:
    Base: Base
    Traffic: Traffic
    Access: Access
    Temperature: Temperature
