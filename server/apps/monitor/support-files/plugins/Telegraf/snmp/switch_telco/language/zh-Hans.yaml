Switch Telco SNMP:
  name: Telco Systems（Telegraf）
  desc: 面向 Telco Systems / BATM BiNOS 以太网交换机的 SNMP 监控模板，可采集运行时长、CPU 使用率、接口流量（企业号 PEN 738）。
monitor_object:
  Switch: 交换机
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Switch:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标表示 Telco Systems / BATM BiNOS 以太网交换机的 CPU 使用率（monCpuUtilization），按 0-100 百分比记录。持续偏高可能意味着控制平面过载、转发表震荡或异常流量。
monitor_object_metric_group:
  Switch:
    CPU: CPU
    Base: 基础
