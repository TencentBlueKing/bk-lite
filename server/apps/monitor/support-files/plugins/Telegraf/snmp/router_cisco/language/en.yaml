Router Cisco SNMP:
  name: Cisco (Telegraf)
  desc: "SNMP monitoring template for Cisco ISR/ASR/IOS-XE routers. It reports uptime, CPU utilization, memory utilization, temperature, fan, power supply status, and interface traffic (enterprise PEN 9)."
monitor_object:
  Router: Router
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Router:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart.
        By monitoring the uptime, network administrators can understand the stability
        and reliability of the device and identify potential reboot or failure issues.
    device_cpu_usage:
      name: CPU Utilization
      desc: This metric reports the CPU utilization of the Cisco router control plane
        (5-minute average, CISCO-PROCESS-MIB cpmCPUTotal5minRev). Sustained high CPU
        usage can indicate control-plane overload, routing instability, or attack
        traffic, and may lead to slow management response or packet processing delays.
    device_memory_used:
      name: Memory Used
      desc: This metric reports the number of bytes currently in use for each Cisco
        memory pool (CISCO-MEMORY-POOL-MIB). It helps administrators understand the absolute
        memory consumption per pool (for example Processor or I/O pools) and identify
        which pool is under pressure.
    device_memory_free:
      name: Memory Free
      desc: This metric reports the number of free bytes available in each Cisco
        memory pool. Together with the used bytes it determines overall memory utilization;
        a persistently low free value indicates memory pressure on that pool.
    device_memory_usage:
      name: Memory Utilization
      desc: This metric reports overall memory utilization of the Cisco router,
        computed as used / (used + free) * 100 across valid memory pools. Bogus pools
        such as lsmpi_io and Reserved are dropped at collection time. High memory
        usage may indicate memory leaks, oversized routing tables, or insufficient
        capacity.
    device_temperature_celsius:
      name: Temperature
      desc: This metric reports the temperature reading of each Cisco hardware sensor
        (CISCO-ENVMON-MIB), in degrees Celsius. Abnormally high temperatures may indicate
        fan failure, blocked airflow, or excessive ambient heat, and can trigger
        thermal protection or hardware damage if left unaddressed.
    device_fan_state:
      name: Fan Status
      desc: This metric reports the operational state of each Cisco cooling fan
        (CISCO-ENVMON-MIB ciscoEnvMonFanState). A non-normal state (warning, critical,
        shutdown, or notFunctioning) indicates a cooling fault that can quickly lead
        to overheating and should be investigated immediately.
    device_psu_state:
      name: Power Supply Status
      desc: This metric reports the operational state of each Cisco power supply
        unit (CISCO-ENVMON-MIB ciscoEnvMonSupplyState). A non-normal state signals a
        power redundancy or hardware fault; on devices with redundant PSUs a single
        failure may not cause an outage but removes redundancy and must be remediated
        promptly.
monitor_object_metric_group:
  Router:
    CPU: CPU
    Memory: Memory
    Temperature: Temperature
    Hardware Status: Hardware Status
    Base: Base
