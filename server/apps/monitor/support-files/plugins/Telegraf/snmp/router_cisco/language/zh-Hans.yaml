Router Cisco SNMP:
  name: 思科（Telegraf）
  desc: 面向思科路由器的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、温度、风扇、电源状态、接口流量（企业号 PEN 9）。
monitor_object:
  Router: 路由器
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Router:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标表示 Cisco 路由器控制平面的 CPU 使用率（5 分钟平均值，CISCO-PROCESS-MIB cpmCPUTotal5minRev），单位为百分比。CPU
        持续偏高可能意味着控制平面过载、路由震荡或异常流量，会导致管理响应变慢或转发延迟。
    device_memory_used:
      name: 内存已用量
      desc: 该指标表示 Cisco 各内存池当前已使用的字节数（CISCO-MEMORY-POOL-MIB）。它帮助管理员了解每个内存池（如 Processor、I/O
        池）的绝对内存消耗，并定位承压的内存池。
    device_memory_free:
      name: 内存空闲量
      desc: 该指标表示 Cisco 各内存池当前空闲可用的字节数。它与已用量一起决定整体内存使用率；空闲量持续偏低说明该内存池存在内存压力。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标表示 Cisco 路由器有效内存池整体使用率，按 已用/(已用+空闲)*100 计算。采集时会丢弃 lsmpi_io、Reserved 等无效内存池。内存偏高可能由内存泄漏、路由表过大或容量不足导致。
    device_temperature_celsius:
      name: 温度
      desc: 该指标表示 Cisco 各硬件温度传感器的读数（CISCO-ENVMON-MIB），单位为摄氏度。温度异常升高可能意味着风扇故障、散热受阻或环境过热，若不处理可能触发热保护或损坏硬件。
    device_fan_state:
      name: 风扇状态
      desc: 该指标表示 Cisco 各散热风扇的运行状态（CISCO-ENVMON-MIB ciscoEnvMonFanState）。非正常状态（告警、严重、关闭或故障）表示散热故障，可能迅速导致过热，应立即排查。
    device_psu_state:
      name: 电源状态
      desc: 该指标表示 Cisco 各电源模块的运行状态（CISCO-ENVMON-MIB ciscoEnvMonSupplyState）。非正常状态表示电源冗余缺失或硬件故障；在具备冗余电源的设备上，单个故障可能不会立即中断业务，但会失去冗余，需尽快修复。
monitor_object_metric_group:
  Router:
    CPU: CPU
    Memory: 内存
    Temperature: 温度
    Hardware Status: 硬件状态
    Base: 基础
