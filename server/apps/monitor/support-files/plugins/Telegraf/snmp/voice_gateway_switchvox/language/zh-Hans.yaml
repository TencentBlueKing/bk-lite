VoiceGateway Switchvox SNMP:
  name: Switchvox（Telegraf）
  desc: 面向 Sangoma Switchvox IP-PBX（企业号 PEN 22736）的 SNMP 监控模板，可采集运行时长、CPU 使用率与负载、内存与 swap 使用情况、当前呼叫数、接口流量。
monitor_object:
  VoiceGateway: 语音网关
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  VoiceGateway:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: PBX 整机 CPU 使用率（100 − CPU 空闲率）。持续偏高说明呼叫处理负载过重，可能影响通话质量。
    device_cpu_load1:
      name: 系统负载
      desc: PBX 上报的系统负载均值。持续高于 CPU 核数说明系统过载。
    device_memory_usage:
      name: 内存使用率
      desc: PBX 内存使用量占总量的百分比。持续偏高说明存在内存压力。
    device_memory_used:
      name: 内存已用
      desc: PBX 当前已用内存，单位字节。
    device_memory_total:
      name: 内存总量
      desc: PBX 内存总量，单位字节。
    device_swap_used:
      name: Swap 已用
      desc: 当前已用的 swap 空间，单位字节。swap 用量持续增长说明物理内存不足。
    device_swap_total:
      name: Swap 总量
      desc: PBX 的 swap 空间总量，单位字节。
    concurrent_calls:
      name: 当前呼叫数
      desc: PBX 当前正在进行的呼叫数，用于跟踪呼叫负载与容量。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  VoiceGateway:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Memory: 内存
    Voice: 语音
