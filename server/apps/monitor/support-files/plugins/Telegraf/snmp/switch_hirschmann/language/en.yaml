Switch Hirschmann SNMP:
  name: Hirschmann (Telegraf)
  desc: SNMP monitoring template for Hirschmann Classic (Belden Hirschmann)
    industrial switches. It reports CPU utilization (current headline, optional
    average over up to 30 minutes), memory used/free in bytes and derived
    utilization, chassis temperature, and fan state. Some firmware requires
    hmEnableMeasurement to be enabled before resource gauges populate.
monitor_object:
  Switch: Switch
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Switch:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart.
        By monitoring the uptime, network administrators can understand the stability
        and reliability of the device and identify potential reboot or failure issues.
    device_cpu_usage:
      name: CPU Utilization
      desc: This metric reports the current CPU utilization of the Hirschmann
        Classic industrial switch (hmCpuUtilization) as a 0-100 percentage.
        Sustained high CPU usage can indicate control-plane overload, ring-protocol
        instability, or attack traffic.
    device_cpu_usage_avg:
      name: CPU Utilization (avg)
      desc: This metric reports the average CPU utilization of the Hirschmann
        Classic industrial switch (hmCpuAverageUtilization) as a 0-100 percentage,
        measured over at most the last 30 minutes.
    device_memory_used:
      name: Memory Used
      desc: This metric reports the allocated memory of the Hirschmann Classic
        industrial switch in bytes (hmMemoryAllocated, converted from kilobytes).
    device_memory_free:
      name: Memory Free
      desc: This metric reports the free memory of the Hirschmann Classic
        industrial switch in bytes (hmMemoryFree, converted from kilobytes).
    device_memory_usage:
      name: Memory Utilization
      desc: This metric reports overall memory utilization of the Hirschmann
        Classic industrial switch, computed as allocated / (allocated + free) * 100.
        High memory usage may indicate leaks, oversized MAC/ARP tables, or
        insufficient capacity.
    device_temperature_celsius:
      name: Temperature
      desc: This metric reports the chassis temperature of the Hirschmann Classic
        industrial switch (hmTemperature) in degrees Celsius. Sustained high
        temperature can indicate cooling failure or an overheated environment.
    device_fan_state:
      name: Fan Status
      desc: This metric reports the operational state of each Hirschmann Classic
        cooling fan (hmFanState), normalized to 1=ok / 2=failed. A non-normal
        state indicates a cooling fault that can quickly lead to overheating.
monitor_object_metric_group:
  Switch:
    CPU: CPU
    Memory: Memory
    Temperature: Temperature
    Hardware Status: Hardware Status
    Base: Base
