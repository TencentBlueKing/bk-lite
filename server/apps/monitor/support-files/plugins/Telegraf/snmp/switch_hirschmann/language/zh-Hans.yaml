Switch Hirschmann SNMP:
  name: Hirschmann（Telegraf）
  desc: 面向 Hirschmann Classic（Belden Hirschmann）工业交换机的 SNMP 监控模板，可采集 CPU 使用率（当前主指标，可选 ≤30 分钟均值）、内存已用/空闲（字节）及推导出的利用率、机箱温度和风扇状态。部分固件需先启用 hmEnableMeasurement 后资源 Gauge 才填充。
monitor_object:
  Switch: 交换机
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Switch:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标表示 Hirschmann Classic 工业交换机的当前 CPU 使用率（hmCpuUtilization），按 0-100 百分比记录。持续偏高可能意味着控制平面过载、环网协议震荡或异常流量。
    device_cpu_usage_avg:
      name: CPU 使用率（均值）
      desc: 该指标表示 Hirschmann Classic 工业交换机最多近 30 分钟的平均 CPU 使用率（hmCpuAverageUtilization），按 0-100 百分比记录。
    device_memory_used:
      name: 内存已用量
      desc: 该指标表示 Hirschmann Classic 工业交换机当前已分配内存（hmMemoryAllocated，已从 KB 换算为字节）。
    device_memory_free:
      name: 内存空闲量
      desc: 该指标表示 Hirschmann Classic 工业交换机当前空闲内存（hmMemoryFree，已从 KB 换算为字节）。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标表示 Hirschmann Classic 工业交换机整体内存使用率，按 已用/(已用+空闲)*100 计算。持续偏高可能由内存泄漏、MAC/ARP 表过大或容量不足导致。
    device_temperature_celsius:
      name: 温度
      desc: 该指标表示 Hirschmann Classic 工业交换机的机箱温度（hmTemperature），单位为摄氏度。持续偏高可能意味着散热不良或环境过热。
    device_fan_state:
      name: 风扇状态
      desc: 该指标表示 Hirschmann Classic 工业交换机各风扇运行状态（hmFanState），归一为 1=正常 / 2=异常。非正常状态提示散热故障，可能迅速导致过热。
monitor_object_metric_group:
  Switch:
    CPU: CPU
    Memory: 内存
    Temperature: 温度
    Hardware Status: 硬件状态
    Base: 基础
