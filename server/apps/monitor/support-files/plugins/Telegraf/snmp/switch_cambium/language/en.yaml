Switch Cambium SNMP:
  name: Cambium (Telegraf)
  desc: "SNMP monitoring template for Cambium switch. It reports uptime, CPU utilization, memory utilization, temperature, and interface traffic (enterprise PEN 2076)."
monitor_object:
  Switch: Switch
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Switch:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart.
        By monitoring the uptime, network administrators can understand the stability
        and reliability of the device and identify potential reboot or failure issues.
    device_cpu_usage:
      name: CPU Utilization
      desc: This metric reports chassis CPU utilization of the Cambium cnMatrix
        switch (issSwitchCurrentCPUThreshold) as a 0-100 percentage. Sustained
        high CPU usage can indicate control-plane overload, forwarding
        instability, or attack traffic.
    device_memory_usage:
      name: Memory Utilization
      desc: This metric reports chassis memory used percent of the Cambium
        cnMatrix switch (issSwitchCurrentRAMUsage) as a 0-100 percentage. High
        memory usage may indicate leaks, oversized MAC/ARP tables, or
        insufficient capacity.
    device_temperature_celsius:
      name: Chassis Temperature
      desc: This metric reports chassis temperature of the Cambium cnMatrix
        switch (issSwitchCurrentTemperature) in degrees Celsius. Sustained high
        temperature can indicate cooling failure or an overheated environment.
monitor_object_metric_group:
  Switch:
    CPU: CPU
    Memory: Memory
    Temperature: Temperature
    Base: Base
