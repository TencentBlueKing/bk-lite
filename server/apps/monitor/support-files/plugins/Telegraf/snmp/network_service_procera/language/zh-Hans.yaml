NetworkService Procera PacketLogic SNMP:
  name: Procera（Telegraf）
  desc: 面向 Procera PacketLogic 网络服务设备的 SNMP 监控模板，可采集运行时长、CPU Load、BMC 温度、风扇转速/状态和接口流量（企业号 PEN 15397）。
monitor_object:
  NetworkService: 网络服务
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_cpu_usage:
      name: CPU 使用率
      desc: Procera PacketLogic 报文处理 CPU Load，以 0-100 百分比上报。越界或哨兵值在采集侧丢弃。持续偏高表示 DPI 处理平面接近能力上限。
    device_temperature_celsius:
      name: 温度
      desc: Procera PacketLogic BMC 温度，单位为摄氏度。摄氏度读数原样保留，华氏与开尔文在采集侧换算并保留一位小数。未知单位与越界值丢弃。
    device_fan_speed:
      name: 风扇转速
      desc: Procera PacketLogic BMC 风扇转速，单位为 RPM。仅保留单位为 rpm 的行，空单位、越界与哨兵值丢弃。
    device_fan_state:
      name: 风扇状态
      desc: Procera PacketLogic BMC 风扇状态。ok 为正常，cr/nr/critical/non-recoverable/nc 为异常，其余未知状态丢弃。
monitor_object_metric_group:
  NetworkService:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Temperature: 温度
    Hardware Status: 硬件状态
