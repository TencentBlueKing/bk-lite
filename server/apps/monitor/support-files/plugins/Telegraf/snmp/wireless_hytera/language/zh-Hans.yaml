Wireless Hytera SNMP:
  name: Hytera（Telegraf）
  desc: 面向 Hytera 数字中继台（HYTERA-REPEATER-MIB，企业号 PEN 40297）的 SNMP 监控模板，可采集运行时长、功放温度、供电电压、发射前向功率、电压与温度告警状态、接口流量。
monitor_object:
  Wireless: 无线设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    pa_temperature_celsius:
      name: 功放温度
      desc: 功放（PA）温度，单位为摄氏度。温度持续偏高可能表示散热不良或发射负载过重。
    device_voltage_volts:
      name: 供电电压
      desc: 供电电压，单位为伏。偏离标称供电电压可能表示电源或电池异常。
    voltage_alarm_state:
      name: 电压告警
      desc: 中继台上报的电压告警状态，异常包括欠压、过压与异常。
    temperature_alarm_state:
      name: 温度告警
      desc: 中继台上报的温度告警状态，异常包括低温与高温告警。
    tx_forward_power_watts:
      name: 发射前向功率
      desc: 发射机前向功率，单位为瓦。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  Wireless:
    Base: 基础
    Traffic: 流量
    Wireless: 无线
    Temperature: 温度
    Hardware Status: 硬件状态
