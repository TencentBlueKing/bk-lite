Wireless Hytera SNMP:
  name: Hytera (Telegraf)
  desc: SNMP monitoring template for Hytera digital repeaters (HYTERA-REPEATER-MIB, enterprise PEN 40297).
    It reports uptime, PA temperature, supply voltage, transmitter forward power, voltage and temperature
    alarm states, and interface traffic.
monitor_object:
  Wireless: Wireless
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart, derived from sysUpTime.
        Monitoring uptime helps administrators understand device stability and identify unexpected reboots
        or failures.
    pa_temperature_celsius:
      name: PA Temperature
      desc: Power amplifier temperature in degrees Celsius. Persistently high values may indicate poor
        cooling or heavy transmit load.
    device_voltage_volts:
      name: Supply Voltage
      desc: Supply voltage in volts. Values drifting away from the nominal supply may indicate a power
        or battery problem.
    voltage_alarm_state:
      name: Voltage Alarm
      desc: Voltage alarm state reported by the repeater. Abnormal covers low voltage, high voltage and
        the generic abnormal state.
    temperature_alarm_state:
      name: Temperature Alarm
      desc: Temperature alarm state reported by the repeater. Abnormal covers low and high temperature
        alarms.
    tx_forward_power_watts:
      name: TX Forward Power
      desc: Transmitter forward power in watts.
    interface_ifHCInOctets:
      name: Interface Incoming Traffic Rate
      desc: This metric indicates the average rate of bytes received over the past 5 minutes, measured
        in bytes per second, from the 64-bit IF-MIB ifHCInOctets counter (ifXTable). The 64-bit counter
        avoids the rapid wrap of the 32-bit ifInOctets on high-speed ports, keeping the rate accurate.
    interface_ifHCOutOctets:
      name: Interface Outgoing Traffic Rate
      desc: This metric calculates the average rate of bytes sent over the past 5 minutes, measured in
        bytes per second, from the 64-bit IF-MIB ifHCOutOctets counter (ifXTable). The 64-bit counter
        avoids the rapid wrap of the 32-bit ifOutOctets on high-speed ports, keeping the rate accurate.
monitor_object_metric_group:
  Wireless:
    Base: Base
    Traffic: Traffic
    Wireless: Wireless
    Temperature: Temperature
    Hardware Status: Hardware Status
