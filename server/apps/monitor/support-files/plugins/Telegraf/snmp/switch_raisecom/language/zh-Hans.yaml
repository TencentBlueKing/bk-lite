Switch Raisecom SNMP:
  name: 瑞斯康达 Raisecom（Telegraf）
  desc: 面向 Raisecom ISCOM/Gazelle 交换机的 SNMP 监控模板，可采集 CPU 使用率、内存总量/空闲量/使用率与机箱温度。风扇与电源健康不支持。与接入设备 Raisecom 插件相互独立。
monitor_object:
  Switch: 交换机
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Switch:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标表示 Raisecom ISCOM/Gazelle 交换机一分钟总 CPU 忙百分比（raisecomTotalCPUUtilization，索引 oneMin），按百分比直采。持续偏高可能意味着控制平面过载、转发表震荡或异常流量。
    device_memory_total:
      name: 内存总量
      desc: 该指标表示 Raisecom ISCOM/Gazelle 交换机系统内存总量（raisecomMemoryTotal），单位为字节。它与空闲量一起决定整体内存使用率。
    device_memory_free:
      name: 内存空闲量
      desc: 该指标表示 Raisecom ISCOM/Gazelle 交换机系统可用内存（raisecomMemoryAvailable），单位为字节。空闲量持续偏低说明存在内存压力。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标表示 Raisecom ISCOM/Gazelle 交换机整体内存使用率，按 (总量-空闲)/总量*100 计算。持续偏高可能由内存泄漏、MAC/ARP 表过大或容量不足导致。
    device_temperature_celsius:
      name: 机箱温度
      desc: 该指标表示 Raisecom ISCOM/Gazelle 交换机的机箱温度（raisecomTemperatureValue），单位为摄氏度。持续偏高可能意味着散热不良或环境过热。
monitor_object_metric_group:
  Switch:
    CPU: CPU
    Memory: 内存
    Temperature: 温度
    Base: 基础
