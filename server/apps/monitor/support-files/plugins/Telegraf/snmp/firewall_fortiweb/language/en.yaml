Firewall Fortinet FortiWeb SNMP:
  name: Fortinet FortiWeb (Telegraf)
  desc: "SNMP monitoring template for Fortinet FortiWeb (enterprise PEN 12356, tree 1.3.6.1.4.1.12356.107). It reports CPU utilization, memory utilization, total memory, and interface traffic."
monitor_object:
  Firewall: Firewall
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Firewall:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart.
        By monitoring the uptime, network administrators can understand the stability
        and reliability of the device and identify potential reboot or failure issues.
    interface_ifHCInOctets:
      name: Interface Incoming Traffic Rate (HC)
      desc: This metric indicates the average rate of bytes received over the past
        5 minutes, based on the 64-bit ifHCInOctets counter which does not wrap on
        high-speed interfaces.
    interface_ifHCOutOctets:
      name: Interface Outgoing Traffic Rate (HC)
      desc: This metric calculates the average rate of bytes sent over the past 5
        minutes, based on the 64-bit ifHCOutOctets counter which does not wrap on
        high-speed interfaces.
    device_cpu_usage:
      name: CPU Utilization
      desc: CPU utilization of the FortiWeb appliance (fwSysCpuUsage, OID 1.3.6.1.4.1.12356.107.2.1.5.0),
        as a 0-100 percentage. Values outside 0-100 are dropped.
    device_memory_usage:
      name: Memory Utilization
      desc: Memory utilization of the FortiWeb appliance (fwSysMemUsage, OID 1.3.6.1.4.1.12356.107.2.1.7.0),
        as a 0-100 percentage. Values outside 0-100 are dropped.
    device_memory_total:
      name: Memory Total
      desc: Total physical RAM of the FortiWeb appliance (fwSysMemCapacity, OID 1.3.6.1.4.1.12356.107.2.1.8.0).
        The collector converts MB to bytes (MB * 1024 * 1024). Values 0 and 4294967295
        are dropped.
monitor_object_metric_group:
  Firewall:
    Base: Base
    Traffic: Traffic
    Firewall: Firewall
