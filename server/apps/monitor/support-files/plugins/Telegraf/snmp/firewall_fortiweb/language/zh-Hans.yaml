Firewall Fortinet FortiWeb SNMP:
  name: Fortinet FortiWeb（Telegraf）
  desc: 面向 Fortinet FortiWeb 的 SNMP 监控模板（企业号 PEN 12356，树 1.3.6.1.4.1.12356.107），可采集 CPU 使用率、内存使用率、内存总量和接口流量。
monitor_object:
  Firewall: 防火墙
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Firewall:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率(HC)
      desc: 该指标表示过去 5 分钟内接收字节数的平均速率，单位为字节每秒，基于 64 位 ifHCInOctets 计数器，在高速接口上不会回绕。
    interface_ifHCOutOctets:
      name: 接口发送流量速率(HC)
      desc: 该指标表示过去 5 分钟内发送字节数的平均速率，单位为字节每秒，基于 64 位 ifHCOutOctets 计数器，在高速接口上不会回绕。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标报告 FortiWeb 的 CPU 使用率（fwSysCpuUsage，OID 1.3.6.1.4.1.12356.107.2.1.5.0），单位为百分比。取值范围 0–100，超出范围的值会被丢弃。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标报告 FortiWeb 的内存使用率（fwSysMemUsage，OID 1.3.6.1.4.1.12356.107.2.1.7.0），单位为百分比。取值范围 0–100，超出范围的值会被丢弃。
    device_memory_total:
      name: 内存总量
      desc: 该指标报告 FortiWeb 的物理内存总量（fwSysMemCapacity，OID 1.3.6.1.4.1.12356.107.2.1.8.0），采集时将 MB 换算为字节（MB × 1024 × 1024）。0 与 4294967295 会被丢弃。
monitor_object_metric_group:
  Firewall:
    Base: 基础
    Traffic: 流量
    Firewall: 防火墙
