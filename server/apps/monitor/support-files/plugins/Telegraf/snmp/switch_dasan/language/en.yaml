Switch DASAN SNMP:
  name: DASAN (Telegraf)
  desc: "SNMP monitoring template for DASAN switch. It reports uptime, CPU utilization, memory utilization, and interface traffic (enterprise PEN 6296)."
monitor_object:
  Switch: Switch
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Switch:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart.
        By monitoring the uptime, network administrators can understand the stability
        and reliability of the device and identify potential reboot or failure issues.
    device_cpu_usage:
      name: CPU Utilization
      desc: This metric reports the one-minute CPU utilization of the DASAN ethernet
        switch (dsCpuLoad1m) as a 0-100 percentage. Sustained high CPU usage can
        indicate control-plane overload, forwarding instability, or attack traffic.
    device_cpu_usage_5s:
      name: CPU Utilization (5s)
      desc: This metric reports the five-second CPU utilization of the DASAN ethernet
        switch (dsCpuLoad5s) as a 0-100 percentage.
    device_cpu_usage_10m:
      name: CPU Utilization (10m)
      desc: This metric reports the ten-minute CPU utilization of the DASAN ethernet
        switch (dsCpuLoad10m) as a 0-100 percentage.
    device_memory_total:
      name: Memory Total
      desc: This metric reports the total memory of the DASAN ethernet switch
        (dsTotalMem) as the vendor INTEGER value.
    device_memory_used:
      name: Memory Used
      desc: This metric reports the used memory of the DASAN ethernet switch
        (dsUsedMem) as the vendor INTEGER value.
    device_memory_free:
      name: Memory Free
      desc: This metric reports the free memory of the DASAN ethernet switch
        (dsFreeMem) as the vendor INTEGER value.
    device_memory_usage:
      name: Memory Utilization
      desc: This metric reports overall memory utilization of the DASAN ethernet
        switch, computed as used / total * 100. High memory usage may indicate
        leaks, oversized MAC/ARP tables, or insufficient capacity.
monitor_object_metric_group:
  Switch:
    CPU: CPU
    Memory: Memory
    Base: Base
