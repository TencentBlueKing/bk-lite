NetworkService Alpha Cordex SNMP:
  name: Alpha Cordex（Telegraf）
  desc: 面向 Alpha Technologies Cordex HP 直流电源控制器的 SNMP 监控模板，可采集系统电压、负载电流、电池电压、电池电流、电池温度、整流器环境温度、每端口入向流量速率、每端口出向流量速率和运行时长。
monitor_object:
  NetworkService: 网络服务
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内出向发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    system_voltage_volts:
      name: 系统电压
      desc: 来自 rectifierSystem rectSysSystemVoltage 的直流系统电压，单位为伏特。ScaledNumber 原始值除以 1000。缺测或哨兵值不产生数据点。
    system_load_current_amps:
      name: 系统负载电流
      desc: 来自 rectifierSystem rectSysTotalLoadCurrent 的总负载电流，单位为安培。ScaledNumber 原始值除以 1000。缺测或哨兵值不产生数据点。
    battery_voltage_volts:
      name: 电池电压
      desc: 来自 rectifierSystem rectSysBatteryVoltage 的电池电压，单位为伏特。ScaledNumber 原始值除以 1000。缺测或哨兵值不产生数据点。
    battery_current_amps:
      name: 电池电流
      desc: 来自 rectifierSystem rectSysBatteryCurrent 的电池电流，单位为安培。ScaledNumber 原始值除以 1000，负值表示放电。缺测或哨兵值不产生数据点。
    battery_temperature_celsius:
      name: 电池温度
      desc: 来自 rectifierSystem rectSysBatteryTemperature 的电池温度，单位为摄氏度。ScaledNumber 原始值除以 1000。缺测或哨兵值不产生数据点。
    rectifier_ambient_temperature_celsius:
      name: 整流器环境温度
      desc: 来自 rectifierSystem rectMaxRectifierAmbientTemperature 的整流器最高环境温度，单位为摄氏度。ScaledNumber
        原始值除以 1000。缺测或哨兵值不产生数据点。
monitor_object_metric_group:
  NetworkService:
    Base: 基础
    Traffic: 流量
    NetworkService: 网络服务
    Power: 电力
    Environment: 环境
