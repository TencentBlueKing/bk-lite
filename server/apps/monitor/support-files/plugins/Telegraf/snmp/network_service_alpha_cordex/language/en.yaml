NetworkService Alpha Cordex SNMP:
  name: Alpha Cordex (Telegraf)
  desc: SNMP monitoring template for Alpha Technologies Cordex HP DC plant controller.
    It reports system voltage, load current, battery voltage, battery current, battery
    temperature, rectifier ambient temperature, per-port inbound traffic rate, per-port
    outbound traffic rate, and system uptime
monitor_object:
  NetworkService: NetworkService
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart,
        derived from sysUpTime. Monitoring uptime helps administrators understand
        device stability and identify unexpected reboots or failures.
    interface_ifHCInOctets:
      name: Interface Incoming Traffic Rate
      desc: This metric indicates the average rate of bytes received over the past
        5 minutes, measured in bytes per second, from the 64-bit IF-MIB ifHCInOctets
        counter (ifXTable). The 64-bit counter avoids the rapid wrap of the 32-bit
        ifInOctets on high-speed ports, keeping the rate accurate.
    interface_ifHCOutOctets:
      name: Interface Outgoing Traffic Rate
      desc: This metric calculates the average rate of outbound bytes sent over the
        past 5 minutes, measured in bytes per second, from the 64-bit IF-MIB ifHCOutOctets
        counter (ifXTable). The 64-bit counter avoids the rapid wrap of the 32-bit
        ifOutOctets on high-speed ports, keeping the rate accurate.
    device_total_incoming_traffic:
      name: Device Total Incoming Traffic Rate
      desc: This metric indicates the average rate of total bytes received by the
        entire device over the past 5 minutes, measured in bytes per second, summed
        across all interfaces from the 64-bit ifHCInOctets counter. It helps administrators
        obtain an overview of incoming traffic for overall monitoring and capacity
        planning.
    device_total_outgoing_traffic:
      name: Device Total Outgoing Traffic Rate
      desc: This metric represents the average rate of total bytes sent by the entire
        device over the past 5 minutes, measured in bytes per second, summed across
        all interfaces from the 64-bit ifHCOutOctets counter. It helps administrators
        assess sending performance for traffic management and optimization.
    system_voltage_volts:
      name: System Voltage
      desc: DC plant system voltage in volts from rectifierSystem rectSysSystemVoltage.
        The ScaledNumber integer is divided by 1000. Absent or sentinel values yield
        no points.
    system_load_current_amps:
      name: System Load Current
      desc: DC plant total load current in amperes from rectifierSystem rectSysTotalLoadCurrent.
        The ScaledNumber integer is divided by 1000. Absent or sentinel values yield
        no points.
    battery_voltage_volts:
      name: Battery Voltage
      desc: Battery voltage in volts from rectifierSystem rectSysBatteryVoltage. The
        ScaledNumber integer is divided by 1000. Absent or sentinel values yield no
        points.
    battery_current_amps:
      name: Battery Current
      desc: Battery current in amperes from rectifierSystem rectSysBatteryCurrent.
        The ScaledNumber integer is divided by 1000. Negative values are discharge
        current. Absent or sentinel values yield no points.
    battery_temperature_celsius:
      name: Battery Temperature
      desc: Battery temperature in degrees Celsius from rectifierSystem rectSysBatteryTemperature.
        The ScaledNumber integer is divided by 1000. Absent or sentinel values yield
        no points.
    rectifier_ambient_temperature_celsius:
      name: Rectifier Ambient Temperature
      desc: Maximum rectifier ambient temperature in degrees Celsius from rectifierSystem
        rectMaxRectifierAmbientTemperature. The ScaledNumber integer is divided by
        1000. Absent or sentinel values yield no points.
monitor_object_metric_group:
  NetworkService:
    Base: Base
    Traffic: Traffic
    NetworkService: NetworkService
    Power: Power
    Environment: Environment
