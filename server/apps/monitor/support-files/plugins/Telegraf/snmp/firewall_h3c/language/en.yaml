Firewall H3C SNMP:
  name: H3C SecPath (Telegraf)
  desc: "SNMP monitoring template for H3C SecPath firewalls. It reports uptime, CPU utilization, memory utilization, temperature, fan, power supply status, sessions/connections, session establishment rate, and interface traffic (enterprise PEN 25506)."
monitor_object:
  Firewall: Firewall
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Firewall:
    snmp_uptime:
      name: System Uptime
      desc: Uptime of the device since the last restart.
    device_cpu_usage:
      name: CPU Usage
      desc: Per-entity CPU utilization of the H3C SecPath firewall
        (HH3C-ENTITY-EXT-MIB hh3cEntityExtCpuUsage, 0-100). Dimension index is
        the SNMP table row. Sustained high CPU may indicate inspection load or
        attack traffic.
    device_memory_usage:
      name: Memory Usage
      desc: Per-entity memory utilization of the H3C SecPath firewall
        (hh3cEntityExtMemUsage, a direct percent value). High memory pressure
        can degrade session handling.
    device_temperature_celsius:
      name: Temperature
      desc: Per-entity temperature in Celsius (hh3cEntityExtTemperature). The
        65535 unsupported sentinel is filtered out. Abnormally high values may
        indicate cooling issues.
    device_fan_state:
      name: Fan Status
      desc: Operational state of each cooling fan (hh3cEntityExtOperStatus joined
        with ENTITY-MIB entPhysicalClass=7), normalized to 1=ok / 2=bad.
    device_psu_state:
      name: Power Supply Status
      desc: Operational state of each power supply (hh3cEntityExtOperStatus joined
        with ENTITY-MIB entPhysicalClass=6), normalized to 1=ok / 2=bad.
    firewall_active_sessions:
      name: Active Sessions
      desc: Number of connections that currently exist on the H3C SecPath
        firewall (HH3C-FIREWALL-MIB hh3cFWConnNumCurr). A rapid rise can
        indicate a connection flood or session-table pressure.
    firewall_max_sessions:
      name: Max Sessions
      desc: Maximum connection number of the H3C SecPath firewall
        (hh3cFWMaxConnNum). Combined with active sessions it gauges remaining
        session-table headroom.
    firewall_session_rate:
      name: Session Rate
      desc: Connection establishment rate of the H3C SecPath firewall
        (hh3cFWConnRate), in connections per second. A sudden spike can indicate
        a flood or a burst of new sessions.
monitor_object_metric_group:
  Firewall:
    Base: Base
    Firewall: Firewall
    Hardware Status: Hardware Status
