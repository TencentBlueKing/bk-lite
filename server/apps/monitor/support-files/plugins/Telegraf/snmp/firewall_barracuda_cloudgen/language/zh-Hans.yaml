Firewall Barracuda CloudGen SNMP:
  name: Barracuda CloudGen（Telegraf）
  desc: 面向 Barracuda CloudGen Firewall F 系列硬件（PHION-MIB，企业号 PEN 10704）的 SNMP 监控模板，可采集运行时长、硬件传感器温度、风扇转速、电源状态、接口流量。
monitor_object:
  Firewall: 防火墙
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Firewall:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_temperature_celsius:
      name: 温度
      desc: 各硬件温度传感器的读数，单位为摄氏度。温度持续偏高可能表示散热不良或环境温度过高。
    device_fan_speed:
      name: 风扇转速
      desc: 各风扇的转速，单位为 RPM。转速骤降或为 0 可能表示风扇故障或堵转。
    device_psu_state:
      name: 电源状态
      desc: 各电源模块的状态，统一归一为 1（正常）/ 2（异常）。异常表示电源故障或失去输入。
monitor_object_metric_group:
  Firewall:
    Base: 基础
    Temperature: 温度
    Hardware Status: 硬件状态
