VoiceGateway Patton SNMP:
  name: Patton（Telegraf）
  desc: 面向 Patton SmartNode 语音网关的 SNMP 监控模板，可采集运行时长、接口流量、各 CPU 负载、内存池使用率和温度探头读数（企业号 PEN 1768）。
monitor_object:
  VoiceGateway: 语音网关
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  VoiceGateway:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_cpu_usage:
      name: CPU 使用率
      desc: Patton SmartNode 各 CPU 当前负载百分比（SMARTNODE-MIB cpuWorkloadCurrent）。持续偏高说明呼叫处理或控制面负载过高。
    device_memory_total:
      name: 内存池总量
      desc: Patton SmartNode 各内存池总大小（memTotalBytes），单位字节；设备未上报时按 已分配+空闲 计算。
    device_memory_used:
      name: 内存池已分配
      desc: Patton SmartNode 各内存池已分配字节数（memAllocatedBytes）。
    device_memory_free:
      name: 内存池空闲
      desc: Patton SmartNode 各内存池空闲字节数（memFreeBytes）。
    device_memory_usage:
      name: 内存池使用率
      desc: Patton SmartNode 各内存池使用率，采集时按 已分配/(已分配+空闲)*100 计算；空内存池丢弃。
    device_temperature_celsius:
      name: 设备温度
      desc: Patton SmartNode 各温度探头当前读数（SMARTNODE-MIB currentDegreesCelsius），单位摄氏度。用于识别散热异常、风道堵塞或过热风险。
    device_psu_state:
      name: 电源状态
      desc: 语音网关电源状态，归一后 1 表示正常，2 表示异常。
monitor_object_metric_group:
  VoiceGateway:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Memory: 内存
    Temperature: 温度
    Hardware Status: 硬件状态
