VoiceGateway Mitel SNMP:
  name: Mitel（Telegraf）
  desc: 面向 Mitel 语音网关的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、接口流量，适用于 MiVoice 5000（企业号 PEN 2021）。
monitor_object:
  VoiceGateway: 语音网关
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  VoiceGateway:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_temperature_celsius:
      name: 设备温度
      desc: 语音网关设备温度，单位为摄氏度。用于识别散热异常、风道堵塞或过热风险。
    device_psu_state:
      name: 电源状态
      desc: 语音网关电源状态，归一后 1 表示正常，2 表示异常。
    cpu_usage_percent:
      name: CPU 使用率
      desc: 该指标报告 Mitel MiVoice 5000 的整体 CPU 使用率，由 UCD-SNMP ssCpuIdle 按 100−idle 计算；缺 idle
        时回退为 ssCpuUser+ssCpuSystem。持续偏高说明呼叫处理或控制面负载吃紧。
    memory_total:
      name: 内存总量
      desc: 该指标报告 Mitel MiVoice 5000 的物理内存总量（UCD-SNMP memTotalReal，原始单位 kB，已换算为字节）。
    memory_free:
      name: 空闲内存
      desc: 该指标报告 Mitel MiVoice 5000 当前可用的物理内存字节数（UCD-SNMP memAvailReal，原始单位 kB，已换算为字节）。空闲内存持续偏低可能意味着内存压力上升。
    memory_used:
      name: 已用内存
      desc: 该指标报告 Mitel MiVoice 5000 当前已使用的内存字节数，按 memTotalReal − memAvailReal 计算并由 kB 换算为字节。
    memory_usage_percent:
      name: 内存使用率
      desc: 该指标报告 Mitel MiVoice 5000 整体内存使用率，按 (memTotalReal − memAvailReal) / memTotalReal
        × 100 计算。持续偏高可能表示资源紧张。
    memory_total_free:
      name: 空闲内存总量
      desc: Mitel MiVoice 5000 可选的空闲内存总量（UCD-SNMP memTotalFree，原始单位 kB，已换算为字节）。标量存在时采集。
monitor_object_metric_group:
  VoiceGateway:
    Base: 基础
    Traffic: 流量
    Temperature: 温度
    Hardware Status: 硬件状态
    CPU: CPU
    Memory: 内存
