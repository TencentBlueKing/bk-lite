Wireless IgniteNet SNMP:
  name: IgniteNet（Telegraf）
  desc: 面向 IgniteNet MetroLinq 60 GHz 射频站的 SNMP 监控模板（企业号 PEN 47307）。除标准 IF-MIB 接口流量和运行时长外，采集每射频发射功率、本地/远端 RSSI，以及 60 GHz 链路是否已切换到 5 GHz 备份无线电。
monitor_object:
  Wireless: 无线设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_cpu_usage:
      name: CPU 使用率
      desc: 无线设备的整体 CPU 使用率，以 0-100 百分比直接上报。持续偏高可能表示客户端关联负载过高、控制平面压力或射频管理开销过大，会影响漫游与管理响应。
    device_memory_usage:
      name: 内存使用率
      desc: 无线设备的整体内存使用率，以 0-100 百分比直接上报。内存压力过高会导致接入点丢弃客户端关联或重启服务，需及时排查客户端数量或异常负载。
    device_temperature_celsius:
      name: 温度
      desc: 无线设备机箱温度（摄氏度，直采无缩放）。仅带温度传感器的机型返回真实值，无风扇接入点返回 0。温度过高可能表示散热失效或气流不畅，存在过热停机风险。
    ignitenet_radio_tx_power_dbm:
      name: 射频发射功率（dBm）
      desc: 每射频发射功率，单位 dBm，来自 IGNITENET-MIB mlRadioInfoTxPower（1.3.6.1.4.1.47307.1.4.2.1.7）。Integer32
        原值直存、无缩放；超出 -40..60 dBm 的值丢弃。
    ignitenet_radio_rssi_local:
      name: 本地 RSSI
      desc: 射频上报的本地站点 RSSI，来自 IGNITENET-MIB mlRadioInfoRSSILocal（1.3.6.1.4.1.47307.1.4.2.1.10）。MIB
        未给出该列单位，Integer32 原值直存、无缩放。
    ignitenet_radio_rssi_remote:
      name: 远端 RSSI
      desc: 射频上报的远端站点 RSSI，来自 IGNITENET-MIB mlRadioInfoRSSIRemote（1.3.6.1.4.1.47307.1.4.2.1.11）。MIB
        未给出该列单位，Integer32 原值直存、无缩放。
    ignitenet_radio_failover_state:
      name: 60 GHz 链路切换状态
      desc: 60 GHz 射频是否已故障切换到 5 GHz 备份无线电，来自 IGNITENET-MIB mlRadioStatusFailoverStatus（1.3.6.1.4.1.47307.1.4.3.1.2）。off(0)
        映射为 1（正常），on(1) 映射为 2（异常）；其它值丢弃。
monitor_object_metric_group:
  Wireless:
    Base: 基础
    Traffic: 流量
    Wireless: 无线
    Temperature: 温度
    Radio: 射频
