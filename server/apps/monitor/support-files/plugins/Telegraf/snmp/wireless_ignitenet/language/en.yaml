Wireless IgniteNet SNMP:
  name: IgniteNet (Telegraf)
  desc: SNMP monitoring template for IgniteNet MetroLinq 60 GHz radios (enterprise
    PEN 47307). Besides standard IF-MIB interface traffic and uptime, it reports per-radio
    transmit power, local and remote RSSI, and whether the 60 GHz link has failed
    over to the 5 GHz radio.
monitor_object:
  Wireless: Wireless
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart,
        derived from sysUpTime. Monitoring uptime helps administrators understand
        device stability and identify unexpected reboots or failures.
    interface_ifHCInOctets:
      name: Interface Incoming Traffic Rate
      desc: This metric indicates the average rate of bytes received over the past
        5 minutes, measured in bytes per second, from the 64-bit IF-MIB ifHCInOctets
        counter (ifXTable). The 64-bit counter avoids the rapid wrap of the 32-bit
        ifInOctets on high-speed ports, keeping the rate accurate.
    interface_ifHCOutOctets:
      name: Interface Outgoing Traffic Rate
      desc: This metric calculates the average rate of bytes sent over the past 5
        minutes, measured in bytes per second, from the 64-bit IF-MIB ifHCOutOctets
        counter (ifXTable). The 64-bit counter avoids the rapid wrap of the 32-bit
        ifOutOctets on high-speed ports, keeping the rate accurate.
    device_total_incoming_traffic:
      name: Device Total Incoming Traffic Rate
      desc: This metric indicates the average rate of total bytes received by the
        entire device over the past 5 minutes, measured in bytes per second, summed
        across all interfaces from the 64-bit ifHCInOctets counter. It helps administrators
        obtain an overview of incoming traffic for overall monitoring and capacity
        planning.
    device_total_outgoing_traffic:
      name: Device Total Outgoing Traffic Rate
      desc: This metric represents the average rate of total bytes sent by the entire
        device over the past 5 minutes, measured in bytes per second, summed across
        all interfaces from the 64-bit ifHCOutOctets counter. It helps administrators
        assess sending performance for traffic management and optimization.
    device_cpu_usage:
      name: CPU Usage
      desc: CPU utilization of the wireless device reported directly as a 0-100 percentage.
        Sustained high CPU usage can indicate heavy client-association load, control-plane
        pressure, or RF management overhead affecting roaming and management responsiveness.
    device_memory_usage:
      name: Memory Usage
      desc: Memory utilization of the wireless device reported directly as a 0-100
        percentage. High memory pressure can cause the access point to drop client
        associations or restart services, so investigate client counts or abnormal
        load promptly.
    device_temperature_celsius:
      name: Temperature
      desc: Chassis temperature in degrees Celsius of the wireless device, read directly
        with no scaling. Only models equipped with a temperature sensor report a real
        value; fanless access points return 0. High temperatures can indicate cooling
        failure or poor airflow and risk thermal shutdown.
    ignitenet_radio_tx_power_dbm:
      name: RF Transmit Power (dBm)
      desc: Per-radio transmit power in dBm from IGNITENET-MIB mlRadioInfoTxPower
        (1.3.6.1.4.1.47307.1.4.2.1.7). The Integer32 value is stored as-is with no
        scaling. Values outside -40..60 dBm are dropped.
    ignitenet_radio_rssi_local:
      name: Local RSSI
      desc: RSSI value reported by the radio for the local site from IGNITENET-MIB
        mlRadioInfoRSSILocal (1.3.6.1.4.1.47307.1.4.2.1.10). The MIB does not specify
        its unit; the raw Integer32 is stored with no scaling.
    ignitenet_radio_rssi_remote:
      name: Remote RSSI
      desc: RSSI value reported by the radio for the remote site from IGNITENET-MIB
        mlRadioInfoRSSIRemote (1.3.6.1.4.1.47307.1.4.2.1.11). The MIB does not specify
        its unit; the raw Integer32 is stored with no scaling.
    ignitenet_radio_failover_state:
      name: 60 GHz Failover State
      desc: Whether the 60 GHz radio has failed over to the 5 GHz radio, from IGNITENET-MIB
        mlRadioStatusFailoverStatus (1.3.6.1.4.1.47307.1.4.3.1.2). off(0) maps to
        1 (normal) and on(1) maps to 2 (abnormal); other values are dropped.
monitor_object_metric_group:
  Wireless:
    Base: Base
    Traffic: Traffic
    Wireless: Wireless
    Temperature: Temperature
    Radio: Radio
