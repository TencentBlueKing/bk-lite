Router Ericsson IPOS SNMP:
  name: Ericsson IPOS（Telegraf）
  desc: 面向 Ericsson IPOS 路由器（Router 6000 / SSR 8000，企业号 PEN 193.218）的 SNMP 监控模板，可采集运行时长、CPU 使用率、各内存模块内存、实体温度、风扇与电源状态、接口流量。MINI-LINK 微波设备（PEN 193.223）请使用传输设备 Ericsson 模板。
monitor_object:
  Router: 路由器
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Router:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标表示 Ericsson IPOS 路由器 5 分钟累计平均 CPU 使用率（ERICSSON-ROUTER-CPU-METER-MIB eriRouterCpuMeterFiveMinuteAvg，整数百分比 0–100）。持续偏高可能意味着控制平面过载或路由震荡。
    device_memory_used:
      name: 内存已用量
      desc: 该指标表示 Ericsson IPOS 路由器各内存模块已用内存（eriRouterMemoryKBytesInUse，采集时由 KiB 转为字节）。
    device_memory_free:
      name: 内存空闲量
      desc: 该指标表示 Ericsson IPOS 路由器各内存模块空闲内存（eriRouterMemoryFreeKBytes，采集时由 KiB 转为字节）。
    device_memory_total:
      name: 内存总量
      desc: 该指标表示 Ericsson IPOS 路由器各内存模块总内存，按 已用+空闲 计算，单位字节。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标表示 Ericsson IPOS 路由器各内存模块使用率，按 已用/(已用+空闲)*100 计算。持续偏高可能由内存泄漏或表项过大导致。
    device_temperature_celsius:
      name: 设备温度
      desc: 该指标表示 Ericsson IPOS 路由器各实体温度传感器读数（ERICSSON-ROUTER-ENVMON-MIB eriRouterEntityTempCurrent），单位摄氏度，设备将读数限定在 0–100。温度异常升高可能由风扇故障或散热不良导致。
    device_fan_state:
      name: 风扇状态
      desc: 该指标表示 Ericsson IPOS 路由器各风扇托盘状态（eriRouterFanStatus 原始 normal(1)/failed(2)/absent(3)/unknown(4)），归一为 1=正常、2=异常；absent 与 unknown 行丢弃，不计入故障。
    device_fan_speed:
      name: 风扇转速
      desc: 该指标表示 Ericsson IPOS 路由器各风扇单元转速（eriRouterFanSpeedCurrent），单位 RPM。
    device_psu_state:
      name: 电源状态
      desc: 该指标表示 Ericsson IPOS 路由器各电源模块状态（eriRouterPowerStatus 原始 normal(1)/failed(2)/absent(3)/unknown(4)），归一为 1=正常、2=异常；absent 与 unknown 行丢弃，不计入故障。
monitor_object_metric_group:
  Router:
    Base: 基础
    CPU: CPU
    Memory: 内存
    Temperature: 温度
    Hardware Status: 硬件状态
