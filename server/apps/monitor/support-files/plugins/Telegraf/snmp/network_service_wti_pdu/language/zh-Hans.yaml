NetworkService WTI PDU SNMP:
  name: WTI PDU（Telegraf）
  desc: 面向 WTI VMR / NPS / RPC / NBB 系列 PDU（WTI-POWER-MIB，企业号 PEN 2634）的 SNMP 监控模板，可采集运行时长、单元温度、各支路电流
    / 电压 / 功率、各插座电流 / 功率，以及接口流量。
monitor_object:
  NetworkService: 网络服务
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    pdu_temperature_celsius:
      name: PDU 温度
      desc: 各电源单元温度，单位为摄氏度。
    pdu_branch_current_amps:
      name: 支路电流（A）
      desc: 各供电支路的电流，单位为安。
    pdu_branch_voltage_volts:
      name: 支路电压
      desc: 各供电支路的电压，单位为伏。
    pdu_branch_power_watts:
      name: 支路功率
      desc: 各供电支路消耗的功率，单位为瓦。
    pdu_outlet_current_amps:
      name: 插座电流（A）
      desc: 各插座的电流，单位为安。
    pdu_outlet_power_watts:
      name: 插座功率
      desc: 各插座消耗的功率，单位为瓦。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内出向发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32
        位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  NetworkService:
    Base: 基础
    Traffic: 流量
    Power: 电力
    Environment: 环境
