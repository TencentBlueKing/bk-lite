NetworkService COMET WebSensor SNMP:
  name: COMET WebSensor（Telegraf）
  desc: 面向 COMET SYSTEM WebSensor 温湿度变送器（T3510-MIB，企业号 PEN 22626）的 SNMP 监控模板，可采集运行时长、温度、相对湿度、温湿度告警，以及接口流量。
monitor_object:
  NetworkService: 网络服务
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    env_temperature_celsius:
      name: 温度
      desc: 测得的温度，单位为摄氏度。
    env_humidity_percent:
      name: 相对湿度
      desc: 测得的相对湿度，单位为百分比。
    env_temperature_state:
      name: 温度告警
      desc: 温度告警，异常表示读数高于设备上配置的高限或低于低限。
    env_humidity_state:
      name: 湿度告警
      desc: 湿度告警，异常表示读数高于设备上配置的高限或低于低限。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内出向发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32
        位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  NetworkService:
    Base: 基础
    Traffic: 流量
    Environment: 环境
    Hardware Status: 硬件状态
