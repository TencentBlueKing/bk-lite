Wireless Baicells SNMP:
  name: Baicells（Telegraf）
  desc: 面向 Baicells LTE CPE 设备（BAICELLS-MIB）的 SNMP 监控模板，可采集运行时长、内存总量/空闲/已用与使用率、接口流量（企业号 PEN 53058）。
monitor_object:
  Wireless: 无线设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_memory_usage:
      name: 内存使用率
      desc: 由 MemoryTotal 与 MemoryFree（DisplayString）解析后按（总量−空闲）/总量推导的 Baicells CPE 内存使用率。持续偏高表示内存压力，可能影响业务转发或管理服务。
    device_memory_total:
      name: 内存总量
      desc: Baicells CPE 内存总量（字节），由 MemoryTotal 文本按其容量单位换算，是内存使用率的分母。
    device_memory_free:
      name: 内存空闲
      desc: Baicells CPE 空闲内存（字节），由 MemoryFree 文本按其容量单位换算。空闲量持续偏低表示内存压力。
    device_memory_used:
      name: 内存已用
      desc: Baicells CPE 已用内存（字节），按 总量 − 空闲 推导。
monitor_object_metric_group:
  Wireless:
    Base: 基础
    Traffic: 流量
    Memory: 内存
