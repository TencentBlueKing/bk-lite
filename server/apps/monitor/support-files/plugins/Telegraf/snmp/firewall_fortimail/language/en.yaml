Firewall Fortinet FortiMail SNMP:
  name: Fortinet FortiMail (Telegraf)
  desc: "SNMP monitoring template for Fortinet FortiMail email security gateways (PEN 12356, tree 1.3.6.1.4.1.12356.105). It reports uptime, CPU utilization, memory utilization, log disk usage, mail disk usage, and IF-MIB 64-bit interface traffic."
monitor_object:
  Firewall: Firewall
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Firewall:
    snmp_uptime:
      name: System Uptime
      desc: Uptime of the FortiMail gateway since the last restart (IF-MIB sysUpTime).
    device_cpu_usage:
      name: CPU Usage
      desc: Instantaneous CPU utilization of the FortiMail gateway (FORTINET-FORTIMAIL-MIB
        fmlSysCpuUsage 1.3.6.1.4.1.12356.105.1.6.0, Gauge32 percent). Values outside
        0-100 are dropped.
    device_memory_usage:
      name: Memory Usage
      desc: Instantaneous memory utilization of the FortiMail gateway (FORTINET-FORTIMAIL-MIB
        fmlSysMemUsage 1.3.6.1.4.1.12356.105.1.7.0, Gauge32 percent). Values outside
        0-100 are dropped.
    device_log_disk_usage:
      name: Log Disk Usage
      desc: Log disk utilization of the FortiMail gateway (FORTINET-FORTIMAIL-MIB
        fmlSysLogDiskUsage 1.3.6.1.4.1.12356.105.1.8.0, Gauge32 percent). Values outside
        0-100 are dropped.
    device_mail_disk_usage:
      name: Mail Disk Usage
      desc: Mail disk utilization of the FortiMail gateway (FORTINET-FORTIMAIL-MIB
        fmlSysMailDiskUsage 1.3.6.1.4.1.12356.105.1.9.0, Gauge32 percent). Values
        outside 0-100 are dropped.
    interface_ifHCInOctets:
      name: Interface Incoming Traffic Rate
      desc: Average rate of bytes received over the past 5 minutes from the 64-bit
        IF-MIB ifHCInOctets counter (ifXTable).
    interface_ifHCOutOctets:
      name: Interface Outgoing Traffic Rate
      desc: Average rate of bytes sent over the past 5 minutes from the 64-bit IF-MIB
        ifHCOutOctets counter (ifXTable).
monitor_object_metric_group:
  Firewall:
    Base: Base
    Firewall: Firewall
    Traffic: Traffic
