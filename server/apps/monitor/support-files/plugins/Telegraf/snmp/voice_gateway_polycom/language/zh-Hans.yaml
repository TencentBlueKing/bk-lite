VoiceGateway Polycom SNMP:
  name: Polycom（Telegraf）
  desc: 面向 Polycom 语音网关的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、接口流量，适用于 RealPresence DMA（企业号 PEN 13885）。
monitor_object:
  VoiceGateway: 语音网关
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  VoiceGateway:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_temperature_celsius:
      name: 设备温度
      desc: 语音网关设备温度，单位为摄氏度。用于识别散热异常、风道堵塞或过热风险。
    device_psu_state:
      name: 电源状态
      desc: 语音网关电源状态，归一后 1 表示正常，2 表示异常。
    cpu_usage_percent:
      name: CPU 使用率
      desc: Polycom RealPresence DMA 各服务器 CPU 使用率，直接为 0-100 百分比。看板取最高节点，持续偏高可能表示呼叫控制或会议资源压力。
    memory_used:
      name: 内存已用量
      desc: Polycom RealPresence DMA 服务器当前已用内存（MIB 以 MB 上报，查询侧换算为字节）。与总量一起计算内存使用率。
    memory_total:
      name: 内存总量
      desc: Polycom RealPresence DMA 服务器内存总量（MIB 以 MB 上报，查询侧换算为字节）。与已用量一起计算内存使用率。
    memory_free:
      name: 内存空闲量
      desc: Polycom RealPresence DMA 服务器可选空闲内存（MIB 以 MB 上报，查询侧换算为字节）。部分 DMA 软件版本可能不返回该列。
    memory_usage_percent:
      name: 内存使用率
      desc: Polycom RealPresence DMA 内存使用率，按 已用/总量*100 计算。持续偏高可能表示会话或会议资源压力。
monitor_object_metric_group:
  VoiceGateway:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Memory: 内存
    Temperature: 温度
    Hardware Status: 硬件状态
