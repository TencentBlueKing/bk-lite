VoiceGateway Grandstream UCM SNMP:
  name: Grandstream UCM（Telegraf）
  desc: 面向 Grandstream UCM IP-PBX（GS-SoftWareUCM-SNMP-MIB）的 SNMP 监控模板，可采集运行时长、CPU 负载均值、内存使用率、并发呼叫数、接口流量（企业号 PEN 12581）。
monitor_object:
  VoiceGateway: 语音网关
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  VoiceGateway:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_cpu_load1:
      name: CPU 1 分钟负载
      desc: 由设备返回的负载均值文本解析出的 IP-PBX 1 分钟 CPU 负载。持续高于 CPU 核数表示 PBX 过载。
    device_cpu_load5:
      name: CPU 5 分钟负载
      desc: IP-PBX 5 分钟 CPU 负载均值，设备返回三个负载值时采集。
    device_cpu_load15:
      name: CPU 15 分钟负载
      desc: IP-PBX 15 分钟 CPU 负载均值，设备返回三个负载值时采集。
    device_cpu_usage:
      name: CPU 使用率
      desc: IP-PBX 的 CPU 使用率（0-100），仅当设备返回百分比文本而不是负载均值时采集。
    device_memory_usage:
      name: 内存使用率
      desc: 由内存使用文本解析出的 IP-PBX 内存使用率（0-100）。持续偏高可能影响呼叫处理。
    device_memory_used:
      name: 内存已用
      desc: IP-PBX 已用内存（字节），设备返回带容量单位的“已用/总量”文本时采集。
    device_memory_total:
      name: 内存总量
      desc: IP-PBX 内存总量（字节），设备返回带容量单位的“已用/总量”文本时采集。
    concurrent_calls:
      name: 并发呼叫数
      desc: IP-PBX 当前正在进行的呼叫数。数值骤降可能表示中继或注册异常，接近授权上限表示容量吃紧。
monitor_object_metric_group:
  VoiceGateway:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Memory: 内存
    Voice: 语音
