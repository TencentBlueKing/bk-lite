NetworkService Emerson NetSure SNMP:
  name: Emerson NetSure（Telegraf）
  desc: 面向 Emerson NetSure / EES 直流电源系统（NETSURE-MIB-004-A，企业号 PEN 6302）的 SNMP 监控模板，可采集运行时长、电源系统告警状态、系统电压与电流、电池电压与容量、温度，以及接口流量。
monitor_object:
  NetworkService: 网络服务
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    system_state:
      name: 电源系统状态
      desc: 电源系统当前最高告警级别，异常表示存在 warning 及以上级别告警。
    system_voltage_volts:
      name: 系统电压
      desc: 直流系统电压，单位为伏。
    system_current_amps:
      name: 系统电流（A）
      desc: 直流系统负载总电流，单位为安。
    battery_voltage_volts:
      name: 电池电压
      desc: 电池电压，单位为伏。
    battery_capacity_percent:
      name: 电池容量
      desc: 电池剩余容量百分比，下降表示电池正在放电。
    env_temperature_celsius:
      name: 温度
      desc: 各路温度探头读数，单位为摄氏度。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内出向发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32
        位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  NetworkService:
    Base: 基础
    Traffic: 流量
    Power: 电力
    Temperature: 温度
    Hardware Status: 硬件状态
