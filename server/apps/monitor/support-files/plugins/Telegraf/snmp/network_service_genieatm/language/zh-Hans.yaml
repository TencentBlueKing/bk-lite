NetworkService GenieATM SNMP:
  name: GenieATM（Telegraf）
  desc: 面向 Genie Networks GenieATM 流量分析设备的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、接口流量（企业号 PEN 9926）。
monitor_object:
  NetworkService: 网络服务
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器），单位为字节每秒。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器），单位为字节每秒。
    device_cpu_usage:
      name: CPU 使用率
      desc: GenieATM 本机 CPU 使用率（geAtmSystemDeviceCpuLoad，百分比）。持续偏高表示流量分析负载过高。
    device_memory_usage:
      name: 内存使用率
      desc: GenieATM 本机内存使用率（geAtmSystemDeviceMemUsage，百分比）。持续偏高表示设备存在内存压力。
monitor_object_metric_group:
  NetworkService:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Memory: 内存
