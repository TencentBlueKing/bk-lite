Wanopt Venturi SNMP:
  name: Venturi Wireless (Telegraf)
  desc: "SNMP monitoring template for Venturi Wireless optimisation servers (enterprise PEN 3382, VENTURI-SERVER-STATS-MIB). Besides standard IF-MIB interface traffic and uptime, it reports overall CPU utilisation and Venturi buffer (VBuf) pool usage."
monitor_object_metric:
  Wanopt:
    venturi_vbuf_usage_percent:
      name: Venturi Buffer (VBuf) Usage
      desc: Venturi buffer pool usage as a 0-100 percentage, derived from
        VENTURI-SERVER-STATS-MIB vServerStatsSystemUsedVenturiBuffers divided
        by vServerSystemTotalVenturiBuffers.
