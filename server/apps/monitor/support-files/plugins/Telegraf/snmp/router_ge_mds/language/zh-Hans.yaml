Router GE MDS Orbit SNMP:
  name: GE MDS Orbit（Telegraf）
  desc: 面向 GE MDS Orbit 工业路由器（MDS-SYSTEM-MIB，企业号 PEN 4130）的 SNMP 监控模板，可采集运行时长、系统温度、电源电压，MPR 机型额外采集两路散热片温度与两路电源输出电压，以及接口流量。
monitor_object:
  Router: 路由器
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Router:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_temperature_celsius:
      name: 系统温度
      desc: 路由器系统温度，单位为摄氏度。温度持续偏高可能表示散热不良或环境温度过高。
    mpr_heatsink1_temperature_celsius:
      name: MPR 散热片1温度
      desc: 1 号散热片温度，单位为摄氏度。仅 MPR 机型有该指标。
    mpr_heatsink2_temperature_celsius:
      name: MPR 散热片2温度
      desc: 2 号散热片温度，单位为摄氏度。仅 MPR 机型有该指标。
    device_voltage_volts:
      name: 电源电压
      desc: 电源电压，单位为伏（直流）。偏离标称供电电压可能表示供电异常。
    mpr_psu1_voltage_volts:
      name: MPR 电源1输出电压
      desc: 1 号电源输出电压，单位为伏。仅 MPR 机型有该指标。
    mpr_psu2_voltage_volts:
      name: MPR 电源2输出电压
      desc: 2 号电源输出电压，单位为伏。仅 MPR 机型有该指标。
monitor_object_metric_group:
  Router:
    Base: 基础
    Temperature: 温度
    Hardware Status: 硬件状态
