Wireless Extreme WiNG SNMP:
  name: Extreme WiNG (Telegraf)
  desc: SNMP monitoring template for Extreme / Symbol / Motorola WiNG WLAN devices.
    It reports per-device CPU utilization, memory usage, interface traffic, and system
    uptime (enterprise PEN 388, wingMIB 1.3.6.1.4.1.388.50).
monitor_object:
  Wireless: Wireless
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the WiNG device since the last restart,
        derived from sysUpTime. Monitoring uptime helps administrators understand
        device stability and identify unexpected reboots.
    interface_ifHCInOctets:
      name: Interface Incoming Traffic Rate
      desc: This metric indicates the average rate of bytes received over the past
        5 minutes, measured in bytes per second, from the 64-bit IF-MIB ifHCInOctets
        counter (ifXTable). The 64-bit counter avoids the rapid wrap of the 32-bit
        ifInOctets on high-speed ports, keeping the rate accurate.
    interface_ifHCOutOctets:
      name: Interface Outgoing Traffic Rate
      desc: This metric calculates the average rate of bytes sent over the past 5
        minutes, measured in bytes per second, from the 64-bit IF-MIB ifHCOutOctets
        counter (ifXTable). The 64-bit counter avoids the rapid wrap of the 32-bit
        ifOutOctets on high-speed ports, keeping the rate accurate.
    device_cpu_usage:
      name: CPU Utilization
      desc: 1-minute CPU utilization of a WiNG-managed device in percent, from
        wingStatsDevSysInfoLoadLimitS0 (1.3.6.1.4.1.388.50.1.4.2.2.1.1.8). The SNMP
        value is 10 times the percentage and is divided by 10 before storage. Values
        outside 0-100 after scaling are dropped.
    device_memory_usage:
      name: Memory Utilization
      desc: Memory utilization of a WiNG-managed device in percent, computed as
        (total-free)/total from wingStatsDevSysInfoTotalMem and wingStatsDevSysInfoFreeMem
        (1.3.6.1.4.1.388.50.1.4.2.2.1.1.2 / .1, kilobytes). Emitted only when total
        is greater than 0 and free is between 0 and total.
    device_memory_total:
      name: Memory Total
      desc: Total memory of a WiNG-managed device in bytes, from wingStatsDevSysInfoTotalMem
        (1.3.6.1.4.1.388.50.1.4.2.2.1.1.2). The SNMP value is in kilobytes and is
        multiplied by 1024 before storage.
    device_memory_free:
      name: Memory Free
      desc: Free memory of a WiNG-managed device in bytes, from wingStatsDevSysInfoFreeMem
        (1.3.6.1.4.1.388.50.1.4.2.2.1.1.1). The SNMP value is in kilobytes and is
        multiplied by 1024 before storage.
monitor_object_metric_group:
  Wireless:
    Base: Base
    CPU: CPU
    Memory: Memory
    Traffic: Traffic
