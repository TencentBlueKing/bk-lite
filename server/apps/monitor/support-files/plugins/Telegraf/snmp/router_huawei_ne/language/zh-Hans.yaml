Router Huawei NE SNMP:
  name: 华为 NE（Telegraf）
  desc: 面向华为 NE 路由器的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、温度、风扇、电源状态、光模块、接口流量、电压、功率（企业号 PEN 2011）。
monitor_object:
  Router: 路由器
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Router:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标按实体报告华为 NE 路由器控制平面 CPU 使用率（hwEntityCpuUsage，0～100），维度 descr 为 entPhysicalName。CPU
        持续偏高可能意味着控制平面过载、路由震荡或异常流量。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标按实体报告华为 NE 路由器内存使用率（hwEntityMemUsage，直接百分比 0～100），维度 descr 为 entPhysicalName。内存偏高可能由内存泄漏、路由表过大或容量不足导致。
    device_temperature_celsius:
      name: 温度
      desc: 该指标表示设备各硬件温度传感器的读数，单位为摄氏度。温度异常升高可能意味着风扇故障、散热受阻或环境过热，若不处理可能触发热保护或损坏硬件。
    device_voltage_volts:
      name: 输入电压
      desc: 该指标按实体报告华为 NE 设备输入电压（hwEntityVoltage，原始毫伏，查询侧除以 1000 显示为伏特）。电压偏离额定范围可能意味着供电不稳，存在硬件风险。
    device_fan_state:
      name: 风扇状态
      desc: 该指标表示设备各散热风扇的运行状态（hwEntityFanState），维度 index 为风扇表行索引。非正常状态表示散热故障，可能迅速导致过热，应立即排查。
    device_optical_rx_power:
      name: 光模块接收功率
      desc: 该指标按光模块报告接收光功率（dBm；设备原始为 µW，查询侧 10*log10(µW/1000) 换算，<=0 丢弃），维度 descr 为 entPhysicalName。接收功率过低可能意味着链路衰减、光纤污染或对端发送异常。
    device_optical_tx_power:
      name: 光模块发送功率
      desc: 该指标按光模块报告发送光功率（dBm；设备原始为 µW，查询侧 10*log10(µW/1000) 换算，<=0 丢弃），维度 descr 为 entPhysicalName。发送功率异常偏低通常意味着本端光模块老化或故障。
    device_cpu_dev_duty:
      name: 设备 CPU 占用
      desc: 该指标按 CPU 设备条目报告瞬时占用（hwCpuDevDuty，0～100）。用于补充实体 CPU，观察 NetEngine 控制平面实时负载。
    device_cpu_dev_avg_duty_1min:
      name: 设备 CPU 1 分钟平均占用
      desc: 该指标按 CPU 设备条目报告 1 分钟平均占用（hwAvgDuty1min，0～100）。用于平滑短时尖峰，判断控制平面是否持续承压。
    device_cpu_dev_avg_duty_5min:
      name: 设备 CPU 5 分钟平均占用
      desc: 该指标按 CPU 设备条目报告 5 分钟平均占用（hwAvgDuty5min，0～100）。持续偏高说明控制平面负载已持续存在，而非瞬时突发。
    device_memory_dev_size:
      name: 设备内存总量
      desc: 该指标按内存设备条目报告总量（hwMemoryDevSize64，字节）。与空闲量一起反映转发或控制内存池容量。
    device_memory_dev_free:
      name: 设备空闲内存
      desc: 该指标按内存设备条目报告空闲量（hwMemoryDevFree64，字节）。空闲量持续偏低说明该内存池存在压力。
    device_psu_state:
      name: 电源状态
      desc: 该指标表示各电源模块运行状态（hwEntityPwrState）。非正常状态表示电源冗余缺失或硬件故障，需尽快修复。
    device_psu_present:
      name: 电源在位
      desc: 该指标表示各电源模块是否在位（hwEntityPwrPresent）。不在位表示槽位空置或模块被拔出，冗余能力下降。
    device_fan_speed:
      name: 风扇转速
      desc: 该指标表示各散热风扇转速（hwEntityFanSpeed），维度 index 为风扇表行索引。转速异常偏低或为 0 表示风扇卡转或故障；异常偏高可能是设备在为高温加速散热。
    device_fan_present:
      name: 风扇在位
      desc: 该指标表示各散热风扇是否在位（hwEntityFanPresent），维度 index 为风扇表行索引。不在位表示风扇框缺失，散热能力下降，应立即排查。
    device_entity_board_power:
      name: 单板功耗
      desc: 该指标按实体报告单板功耗（hwEntityBoardPower，瓦特）。功耗异常升高可能意味着单板故障、转发负载过高或散热不良。
    device_power_used:
      name: 整机已用功耗
      desc: 该指标报告整机已用功耗（hwDevicePowerInfoUsedPower，瓦特）。在总功耗预算稳定时持续上升，说明负载增加或硬件效率下降。
    device_power_total:
      name: 整机总功耗
      desc: 该指标报告整机总功耗容量（hwDevicePowerInfoTotalPower，瓦特）。用于判断整机是否接近供电预算上限。
    device_forward_performance_usage:
      name: 转发性能占用
      desc: 该指标报告转发性能占用（hwEntityForwardPerformanceUsage，0～100）。偏高说明转发引擎接近容量上限，新增流量可能时延增大或丢包。
    device_fwd_cpu_usage:
      name: 转发 CPU 使用率
      desc: 该指标报告转发面 CPU 使用率（hwFwdCpuUsageRate，0～100）。持续偏高可能导致转发时延、丢包或协议震荡。
    device_entity_oper_status:
      name: 实体运行状态
      desc: 该指标按实体报告运行状态（hwEntityOperStatus）。disabled 或 offline 应结合主备状态和槽位状态定位故障单板。
    device_entity_standby_status:
      name: 实体主备状态
      desc: 该指标按实体报告主备状态（hwEntityStandbyStatus）。冗余单板意外失去 providingService 或 hotStandby，说明发生倒换或备板故障。
    device_optical_temperature:
      name: 光模块温度
      desc: 该指标按光模块报告温度（摄氏度）。模块温度过高会加速激光器老化，并可能先于光功率异常出现。
    device_optical_bias:
      name: 光模块偏置电流
      desc: 该指标按光模块报告激光器偏置电流。偏离正常范围通常是发送端老化或故障的早期信号。
    device_optical_voltage:
      name: 光模块电压
      desc: 该指标按光模块报告供电电压（原始毫伏，查询侧除以 1000 显示为伏特）。电压越限会导致光模块工作不稳定。
    device_slot_oper_status:
      name: 槽位运行状态
      desc: 该指标按槽位报告运行状态（hwSlotOperStatus）。normal(2) 为正常；null、fault、offline、shutdown 或 isolated 表示单板空置、故障或下电，该槽位上的接口会全部中断。
    interface_ifAdminStatus:
      name: 接口管理状态
      desc: 此指标表示网络接口的管理状态。它用于指示接口是否被管理人员启用（up）或禁用（down）。
    interface_ifOperStatus:
      name: 接口操作状态
      desc: 此指标反映网络接口的实际运行状态，表明接口是否正在工作。
    interface_ifSpeed:
      name: 接口带宽
      desc: 该指标表示网络接口支持的最高数据传输速度，单位为比特每秒。
    interface_ifHighSpeed:
      name: 接口高速带宽
      desc: 该指标来自 IF-MIB ifHighSpeed，单位为兆比特每秒。与 ifSpeed 一起使用，避免高速口被 32 位 ifSpeed 上限截断。
    interface_ifInErrors:
      name: 接收错误数据包速率
      desc: 此指标计算过去5分钟内接收到的错误包的平均速率，单位为包每秒。
    interface_ifOutErrors:
      name: 发送错误数据包速率
      desc: 该指标计算过去5分钟内发送错误包的平均速率，单位为包每秒。
    interface_ifInDiscards:
      name: 接收丢包速率
      desc: 此指标表示过去5分钟内接收到的丢弃包的平均速率，单位为包每秒。
    interface_ifOutDiscards:
      name: 发送丢包速率
      desc: 本指标计算过去5分钟内发送的丢弃包的平均速率，单位为包每秒。
    interface_ifInUcastPkts:
      name: 接收单播数据包速率
      desc: 该指标表示过去5分钟内接收到的单播包的平均速率，单位为包每秒。
    interface_ifOutUcastPkts:
      name: 发送单播数据包速率
      desc: 此指标计算过去5分钟内发送的单播包的平均速率，单位为包每秒。
    interface_ifInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率，单位为字节每秒。
    interface_ifOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率，单位为字节每秒。
    interface_ifHCInOctets:
      name: 接口接收流量速率(HC)
      desc: 该指标表示过去 5 分钟内接收字节数的平均速率，单位为字节每秒，基于 64 位 ifHCInOctets 计数器，在高速接口上不会回绕。
    interface_ifHCOutOctets:
      name: 接口发送流量速率(HC)
      desc: 该指标表示过去 5 分钟内发送字节数的平均速率，单位为字节每秒，基于 64 位 ifHCOutOctets 计数器，在高速接口上不会回绕。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率，单位为字节每秒。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率，单位为字节每秒。
    interface_ext_input_octet_rate:
      name: 接口入向字节速率
      desc: 该指标报告各接口瞬时入向字节速率（hwIFExtInputOctetRate）。与计数器换算的 IF-MIB 速率不同，这是设备计算的瞬时值。
    interface_ext_output_octet_rate:
      name: 接口出向字节速率
      desc: 该指标报告各接口瞬时出向字节速率（hwIFExtOutputOctetRate）。与入向速率一起观察，可判断端口是否单向拥塞。
    interface_ext_input_pkt_rate:
      name: 接口入向包速率
      desc: 该指标报告各接口瞬时入向包速率（hwIFExtInputPktRate）。字节速率不高但包速率很高时，通常表示小包压力。
    interface_ext_output_pkt_rate:
      name: 接口出向包速率
      desc: 该指标报告各接口瞬时出向包速率（hwIFExtOutputPktRate）。结合错包和丢包可区分拥塞与物理故障。
    interface_ext_flow_status:
      name: 接口流状态
      desc: 该指标报告各接口流状态（hwIFExtFlowStatus）。异常表示接口虽 up 但流量被阻断或限速。
    device_bgp_peer_state:
      name: BGP 邻居状态
      desc: 该指标报告各 BGP 邻居状态（hwBgpPeerState）。established 为健康态；已配置邻居长期处于 idle、active 或 connect
        表示会话未能建立或发生震荡。
    device_bgp_peer_established_time:
      name: BGP 邻居保持时间
      desc: 该指标报告 BGP 邻居处于 Established 的时长（hwBgpPeerFsmEstablishedTime，秒）。突然降到接近 0 表示会话重置。
    device_bgp_peer_session_num:
      name: BGP 会话数
      desc: 该指标报告整机 BGP 邻居会话数（hwBgpPeerSessionNum）。突然下降可能意味着多个邻居同时中断。
    device_bgp_ibgp_session_num:
      name: IBGP 会话数
      desc: 该指标报告整机 IBGP 会话数（hwBgpPeerIBgpSessionNum）。IBGP 丢失可能造成 AS 内部路由分区。
    device_bgp_ebgp_session_num:
      name: EBGP 会话数
      desc: 该指标报告整机 EBGP 会话数（hwBgpPeerEBgpSessionNum）。EBGP 丢失会导致外部前缀撤销并引起流量切换。
    device_vrf_count:
      name: 已配置 VRF 数
      desc: 该指标报告已配置 VRF 数量（hwConfiguredVrfs）。数量意外变化可能意味着 VPN 配置回滚或提交失败。
    device_bfd_sess_state:
      name: BFD 会话状态
      desc: 该指标报告各 BFD 会话状态（HUAWEI-BFD-MIB hwBfdSessState：adminDown(0)/down(1)/init(2)/up(3)）。up(3)
        为健康态；原先 up 的会话变为 down 或 init，通常早于路由协议超时，提示转发路径故障。
    device_bfd_sess_act_number:
      name: 活动 BFD 会话数
      desc: 该指标报告活动 BFD 会话数（hwBfdSessActNumber）。突然下降意味着多个会话同时中断，随后可能发生路由收敛。
monitor_object_metric_group:
  Router:
    Base: 基础
    Status: 状态
    Bandwidth: 带宽
    Packet Error: 数据包错误
    Packet Loss: 数据包丢失
    Packet: 数据包
    Traffic: 流量
    CPU: CPU
    Memory: 内存
    Temperature: 温度
    Hardware Status: 硬件状态
    Routing: 路由
