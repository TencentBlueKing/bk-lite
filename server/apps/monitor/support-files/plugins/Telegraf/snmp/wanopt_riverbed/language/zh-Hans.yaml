Wanopt Riverbed SNMP:
  name: Riverbed SteelHead（Telegraf）
  desc: 面向 Riverbed SteelHead WAN优化设备的 SNMP 监控模板，可采集运行时长、CPU 使用率、温度、接口流量（企业号 PEN 17163），以及优化/直通/半开/半闭/已建立/活动/总连接、连接上限、优化服务状态和对端。
monitor_object:
  Wanopt: WAN 优化
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wanopt:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标表示 Riverbed SteelHead 近一分钟滚动 CPU 使用率（STEELHEAD-MIB cpuUtil1），按全
        CPU 聚合的 0-100 百分比记录。持续偏高可能意味着优化服务过载或即将进入准入控制。
    device_cpu_load1:
      name: CPU 负载（1 分钟）
      desc: 该指标表示 Riverbed SteelHead 一分钟 CPU 负载（STEELHEAD-MIB cpuLoad1）。原始值为百分之一负载，展示时除以
        100。这不是百分比。
    device_cpu_load5:
      name: CPU 负载（5 分钟）
      desc: 该指标表示 Riverbed SteelHead 五分钟 CPU 负载（STEELHEAD-MIB cpuLoad5）。原始值为百分之一负载，展示时除以
        100。这不是百分比。
    device_cpu_load15:
      name: CPU 负载（15 分钟）
      desc: 该指标表示 Riverbed SteelHead 十五分钟 CPU 负载（STEELHEAD-MIB cpuLoad15）。原始值为百分之一负载，展示时除以
        100。这不是百分比。
    device_temperature_celsius:
      name: 温度
      desc: 该指标表示 SteelHead 系统温度（STEELHEAD-MIB systemTemperature），单位为摄氏度。持续偏高可能意味着散热不良或环境过热。
    device_health_state:
      name: 系统健康
      desc: 该指标表示 SteelHead 系统健康（STEELHEAD-MIB systemHealth）。原始码 healthy=10000、degraded=30000、admissionControl=31000、critical=50000
        归一为 1=healthy / 2=非 healthy。大于 1 表示降级、准入控制或严重故障。
    optimized_connections:
      name: 优化连接数
      desc: 该指标表示 Riverbed SteelHead 当前优化连接数（STEELHEAD-MIB optimizedConnections）。业务应在加速时为 0，说明优化已停止或连接全部变为直通。
    passthrough_connections:
      name: 直通连接数
      desc: 该指标表示 Riverbed SteelHead 当前直通连接数（STEELHEAD-MIB passthroughConnections）。突然升高可能意味着优化服务停止，或会话被改为未优化直通。
    half_opened_connections:
      name: 半开连接数
      desc: 该指标表示 Riverbed SteelHead 当前半开优化连接数（STEELHEAD-MIB halfOpenedConnections）。持续大于 0 说明会话建立卡住。
    half_closed_connections:
      name: 半闭连接数
      desc: 该指标表示 Riverbed SteelHead 当前半闭优化连接数（STEELHEAD-MIB halfClosedConnections）。持续升高可能意味着对端没有完成连接拆除。
    established_connections:
      name: 已建立连接数
      desc: 该指标表示 Riverbed SteelHead 当前已建立的优化连接数（STEELHEAD-MIB establishedConnections）。
    active_connections:
      name: 活动连接数
      desc: 该指标表示 Riverbed SteelHead 当前活动优化连接数（STEELHEAD-MIB activeConnections）。
    total_connections:
      name: 总连接数
      desc: 该指标表示 Riverbed SteelHead 当前连接总数（STEELHEAD-MIB totalConnections），包含优化连接与直通连接。
    max_connections:
      name: 连接上限
      desc: 该指标表示这台 Riverbed SteelHead 可承载的最大连接数（STEELHEAD-MIB shMaxConnections）。与总连接、优化连接对比可看剩余余量。
    opt_service_ok:
      name: 优化服务
      desc: 该指标由 STEELHEAD-MIB optServiceStatus 派生。1 表示 running。2 表示其余状态，包括 none、unmanaged、pending、正在停止和 stopped。
    opt_service_status:
      name: 优化服务状态
      desc: 该指标表示 Riverbed SteelHead 优化服务原始状态（STEELHEAD-MIB optServiceStatus）：none=0、unmanaged=1、running=2、sentCom1=3、sentTerm1=4、sentTerm2=5、sentTerm3=6、pending=7、stopped=8。
    steelhead_peer:
      name: 优化对端
      desc: 该指标对应 Riverbed SteelHead 优化对端表的一行（STEELHEAD-MIB peerTable），行存在时值为 1。主机名、地址、软件版本和型号作为标签。行数从有掉到无，表示对端全部消失。
    steelhead_peer_count:
      name: 优化对端数
      desc: 该指标表示 Riverbed SteelHead 优化对端行数。对端表为空且设备仍在上报时回落为 0，因此从有对端掉到无对端仍然可见。
monitor_object_metric_group:
  Wanopt:
    CPU: CPU
    Temperature: 温度
    Hardware Status: 硬件状态
    Base: 基础
    Connections: 连接
    Service: 优化服务
    Peers: 对等体
