Loadbalance A10 SNMP:
  name: A10（Telegraf）
  desc: 面向 A10 负载均衡设备的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、接口流量，适用于 Thunder ADC / AX 系列（企业号 PEN 22610）。
monitor_object:
  Loadbalance: 负载均衡
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Loadbalance:
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标报告 A10 Thunder/AX 负载均衡器最近 5 秒的平均 CPU 使用率（A10-AX-MIB axSysAverageCpuUsage）。持续偏高说明流量处理负载吃紧。
    device_memory_total:
      name: 内存总量
      desc: 该指标报告 A10 Thunder/AX 的系统内存总容量（A10-AX-MIB axSysMemoryTotal，设备以 KB 上报，查询侧换算为字节）。
    device_memory_used:
      name: 已用内存
      desc: 该指标报告 A10 Thunder/AX 当前已使用的系统内存（A10-AX-MIB axSysMemoryUsage，设备以 KB 上报已用量，查询侧换算为字节）。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标报告 A10 Thunder/AX 整体内存使用率，按 已用/总量 计算（100*used/total）。持续偏高可能由连接表过大或内存压力导致。
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
monitor_object_metric_group:
  Loadbalance:
    Base: 基础
    Loadbalance: 负载均衡
    Packet Loss: 数据包丢失
    Traffic: 流量
    Packet: 数据包
    Bandwidth: 带宽
    Status: 状态
    Packet Error: 数据包错误
