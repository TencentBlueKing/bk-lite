Loadbalance A10 SNMP:
  name: A10 (Telegraf)
  desc: "SNMP monitoring template for A10 load balancer. It reports uptime, CPU utilization, memory utilization, and interface traffic, for Thunder ADC / AX series (enterprise PEN 22610)."
monitor_object:
  Loadbalance: Load Balance
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Loadbalance:
    device_cpu_usage:
      name: CPU Usage
      desc: This metric reports the average CPU utilization of the A10 Thunder/AX
        load balancer over the last 5 seconds (A10-AX-MIB axSysAverageCpuUsage).
        Sustained high usage indicates heavy traffic-processing load.
    device_memory_total:
      name: Total Memory
      desc: This metric reports the total system memory of the A10 Thunder/AX
        appliance (A10-AX-MIB axSysMemoryTotal, reported in KB and scaled to bytes).
    device_memory_used:
      name: Used Memory
      desc: This metric reports the amount of system memory currently used by the
        A10 Thunder/AX appliance (A10-AX-MIB axSysMemoryUsage, reported in KB used
        and scaled to bytes).
    device_memory_usage:
      name: Memory Usage
      desc: This metric reports the overall memory utilization of the A10 Thunder/AX
        appliance, computed as used/total (100*used/total). Sustained high usage
        may be caused by oversized connection tables or memory pressure.
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart.
        By monitoring the uptime, network administrators can understand the stability
        and reliability of the device and identify potential reboot or failure issues.
monitor_object_metric_group:
  Loadbalance:
    Base: Base
    Loadbalance: Load Balance
    Packet Loss: Packet Loss
    Traffic: Traffic
    Packet: Packet
    Bandwidth: Bandwidth
    Status: Status
    Packet Error: Packet Error
