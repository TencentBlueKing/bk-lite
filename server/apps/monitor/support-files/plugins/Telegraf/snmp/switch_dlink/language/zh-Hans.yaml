Switch D-Link SNMP:
  name: D-Link（Telegraf）
  desc: 面向 D-Link 交换机的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、接口流量（企业号 PEN 171）。
monitor_object:
  Switch: 交换机
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Switch:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标表示 D-Link DGS/DXS 交换机的五分钟 CPU 使用率（agentCPUutilizationIn5min），按 0-100 百分比记录。持续偏高可能意味着控制平面过载、转发表震荡或异常流量。
    device_cpu_usage_5s:
      name: CPU 使用率（5 秒）
      desc: 该指标表示 D-Link DGS/DXS 交换机的五秒 CPU 使用率（agentCPUutilizationIn5sec），按 0-100 百分比记录。
    device_cpu_usage_1min:
      name: CPU 使用率（1 分钟）
      desc: 该指标表示 D-Link DGS/DXS 交换机的一分钟 CPU 使用率（agentCPUutilizationIn1min），按 0-100 百分比记录。
    device_memory_total:
      name: 内存总量
      desc: 该指标表示 D-Link DGS/DXS 交换机的 DRAM 总量（agentDRAMutilizationTotalDRAM，已从 KB 换算为字节）。行按 unitID 索引（0=本机）。
    device_memory_used:
      name: 内存已用量
      desc: 该指标表示 D-Link DGS/DXS 交换机当前已使用的 DRAM（agentDRAMutilizationUsedDRAM，已从 KB 换算为字节）。行按 unitID 索引（0=本机）。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标表示 D-Link DGS/DXS 交换机 DRAM 使用率（agentDRAMutilization），按 0-100 百分比直报。持续偏高可能由内存泄漏、MAC/ARP 表过大或容量不足导致。
monitor_object_metric_group:
  Switch:
    CPU: CPU
    Memory: 内存
    Base: 基础
