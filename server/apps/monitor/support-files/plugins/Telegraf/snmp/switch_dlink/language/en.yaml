Switch D-Link SNMP:
  name: D-Link (Telegraf)
  desc: "SNMP monitoring template for D-Link switch. It reports uptime, CPU utilization, memory utilization, and interface traffic (enterprise PEN 171)."
monitor_object:
  Switch: Switch
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Switch:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart.
        By monitoring the uptime, network administrators can understand the stability
        and reliability of the device and identify potential reboot or failure issues.
    device_cpu_usage:
      name: CPU Utilization
      desc: This metric reports the five-minute CPU utilization of the D-Link
        DGS/DXS switch (agentCPUutilizationIn5min) as a 0-100 percentage. Sustained
        high CPU usage can indicate control-plane overload, forwarding instability,
        or attack traffic.
    device_cpu_usage_5s:
      name: CPU Utilization (5s)
      desc: This metric reports the five-second CPU utilization of the D-Link
        DGS/DXS switch (agentCPUutilizationIn5sec) as a 0-100 percentage.
    device_cpu_usage_1min:
      name: CPU Utilization (1min)
      desc: This metric reports the one-minute CPU utilization of the D-Link
        DGS/DXS switch (agentCPUutilizationIn1min) as a 0-100 percentage.
    device_memory_total:
      name: Memory Total
      desc: This metric reports the total DRAM of the D-Link DGS/DXS switch in
        bytes (agentDRAMutilizationTotalDRAM, converted from kilobytes). Rows are
        indexed by unitID (0 = local device).
    device_memory_used:
      name: Memory Used
      desc: This metric reports the used DRAM of the D-Link DGS/DXS switch in
        bytes (agentDRAMutilizationUsedDRAM, converted from kilobytes). Rows are
        indexed by unitID (0 = local device).
    device_memory_usage:
      name: Memory Utilization
      desc: This metric reports DRAM utilization of the D-Link DGS/DXS switch
        (agentDRAMutilization) as a 0-100 percentage. High memory usage may indicate
        leaks, oversized MAC/ARP tables, or insufficient capacity.
monitor_object_metric_group:
  Switch:
    CPU: CPU
    Memory: Memory
    Base: Base
