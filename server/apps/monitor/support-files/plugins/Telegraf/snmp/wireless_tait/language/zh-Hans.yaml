Wireless Tait SNMP:
  name: Tait（Telegraf）
  desc: 面向 Tait TN9300 集群通信网络节点（DMR / P25，TAIT-TN9300-MIB，企业号 PEN 3570）的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、接口流量。
monitor_object:
  Wireless: 无线设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: 网络节点进程的 CPU 总负载百分比。持续偏高可能表示呼叫处理压力大或进程异常。
    device_memory_usage:
      name: 内存使用率
      desc: 网络节点进程占用的物理内存百分比。持续偏高可能表示内存紧张或存在内存泄漏。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  Wireless:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Memory: 内存
