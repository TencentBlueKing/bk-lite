Wireless HPE MSM SNMP:
  name: HPE MSM (Telegraf)
  desc: "SNMP monitoring template for HPE MSM / Colubris wireless controller and AP platform. It reports uptime, CPU utilization (now and 5-second), 1-minute load average, memory total/free/usage and temporary storage usage, based on the COLUBRIS-USAGE-INFORMATION-MIB (coUsageInformationGroup, enterprise PEN 8744). There is no chassis temperature, fan or PSU gauge."
monitor_object:
  Wireless: Wireless
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: System Uptime
      desc: Uptime of the HPE MSM / Colubris wireless device since the last restart,
        derived from sysUpTime. Monitoring uptime helps administrators understand
        device stability and identify unexpected reboots.
    device_cpu_usage:
      name: CPU Utilization
      desc: Instantaneous CPU utilization of the HPE MSM / Colubris device
        (coUsInfoCpuUseNow), reported as a 0-100 percentage. Sustained high CPU usage
        can indicate heavy AP or station management load affecting roaming and
        management responsiveness.
    device_cpu_usage_5s:
      name: CPU Utilization (5s)
      desc: CPU utilization of the HPE MSM / Colubris device over the past 5 seconds
        (coUsInfoCpuUse5Sec), reported as a 0-100 percentage.
    device_load_average:
      name: Load Average
      desc: 1-minute system load average of the HPE MSM / Colubris device
        (coUsInfoLoadAverage1Min). Sustained high load may indicate control-plane
        overload.
    device_memory_total:
      name: Memory Total
      desc: Total RAM of the HPE MSM / Colubris device (coUsInfoRamTotal). The device
        reports kilobytes; the collector stores the value in bytes (×1024).
    device_memory_free:
      name: Memory Free
      desc: Free RAM of the HPE MSM / Colubris device (coUsInfoRamFree). The device
        reports kilobytes; the collector stores the value in bytes (×1024).
    device_memory_usage:
      name: Memory Utilization
      desc: Memory utilization of the HPE MSM / Colubris device, calculated as
        (total − free) / total × 100 from coUsInfoRamTotal and coUsInfoRamFree.
        High memory pressure can cause the controller to drop station associations
        or delay AP joins.
    device_storage_usage:
      name: Temporary Storage Usage
      desc: Temporary storage utilization of the HPE MSM / Colubris device
        (coUsInfoStorageUseTemporary), reported as a 0-100 percentage.
monitor_object_metric_group:
  Wireless:
    Base: Base
    CPU: CPU
    Memory: Memory
