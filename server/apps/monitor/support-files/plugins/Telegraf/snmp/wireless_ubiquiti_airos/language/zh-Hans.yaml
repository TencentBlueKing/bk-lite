Wireless Ubiquiti airOS SNMP:
  name: Ubiquiti airOS（Telegraf）
  desc: 面向 Ubiquiti airOS 无线设备的 SNMP 监控模板，可采集运行时长、CPU 负载、内存使用、接口流量，适用于 airMAX 及基于 airOS 的 airFiber（FROGFOOT-RESOURCES-MIB，企业号 PEN 10002），不适用于 EdgeSwitch / UniFi 交换机。
monitor_object:
  Wireless: 无线设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_cpu_usage:
      name: CPU 使用率
      desc: airOS 设备处理器负载百分比，取负载表 5 分钟平均行。持续偏高可能表示无线业务压力大、关联终端过多或管理面异常负载。
    device_memory_usage:
      name: 内存使用率
      desc: airOS 设备内存使用率，采集侧按（总量 - 空闲）/ 总量 × 100 计算。内存压力过高可能导致终端掉线或服务重启。
    device_memory_total:
      name: 内存总量
      desc: airOS 设备可用物理内存总量，单位字节（采集侧由 KB 换算）。
    device_memory_used:
      name: 已用内存
      desc: airOS 设备已用物理内存，单位字节，采集侧按总量 - 空闲计算。
    device_memory_free:
      name: 空闲内存
      desc: airOS 设备空闲物理内存，单位字节（采集侧由 KB 换算）。
monitor_object_metric_group:
  Wireless:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Memory: 内存
