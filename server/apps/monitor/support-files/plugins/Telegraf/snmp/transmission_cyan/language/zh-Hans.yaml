Transmission Cyan SNMP:
  name: Cyan（Telegraf）
  desc: 面向 Cyan BOSS 光传输模块的 SNMP 监控模板，可采集进风口/出风口/电源温度、模块电流、双路馈电状态与电压、运行时长和接口流量（企业号 PEN 28533）。
monitor_object:
  Transmission: 传输设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Transmission:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示 Cyan BOSS 模块自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    intake_temperature_celsius:
      name: 进风口温度
      desc: Cyan BOSS 模块进风口温度，单位为摄氏度，由毫摄氏度换算。超出 -40 到 125 摄氏度的读数会被丢弃。
    exhaust_temperature_celsius:
      name: 出风口温度
      desc: Cyan BOSS 模块出风口温度，单位为摄氏度，由毫摄氏度换算。超出 -40 到 125 摄氏度的读数会被丢弃。
    psu_temperature_celsius:
      name: 电源温度
      desc: Cyan BOSS 模块电源温度，单位为摄氏度，由毫摄氏度换算。超出 -40 到 125 摄氏度的读数会被丢弃。
    device_current_amps:
      name: 模块电流
      desc: Cyan BOSS 模块供电电流，单位为安培，由毫安换算。
    device_psu_state:
      name: 馈电状态
      desc: Cyan BOSS 模块 A/B 路馈电开关状态，on 归一为正常，off 和 unknown 归一为 2（异常）。
    device_voltage_volts:
      name: 馈电电压
      desc: Cyan BOSS 模块 A/B 路馈电电压，单位为伏特，由毫伏换算。非正值不上报。
monitor_object_metric_group:
  Transmission:
    Base: 基础
    Traffic: 流量
    Temperature: 温度
    Hardware Status: 硬件状态
    Power: 电源
