Switch Huawei SNMP:
  name: 华为（Telegraf）
  desc: 面向华为交换机的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、温度、风扇、电源状态、光模块、接口流量、电压、功率（企业号 PEN 2011）。
monitor_object:
  Switch: 交换机
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Switch:
    device_voltage_volts:
      name: 输入电压
      desc: 该指标按实体报告华为交换机输入电压（hwEntityVoltage，原始毫伏，查询侧除以 1000 显示为伏特），维度 descr 为 entPhysicalName。与光模块电压 device_optical_voltage（hwEntityOpticalVoltage）不同，二者可并存。电压偏离额定范围可能意味着供电不稳，存在硬件风险。
    device_optical_rx_power:
      name: 光模块接收功率
      desc: 该指标按光模块报告接收光功率（dBm；园区交换机线侧为 µW，查询侧 10*log10(µW/1000) 换算，<=0 与无效哨兵 2147483647 丢弃），维度 descr 为 entPhysicalName。接收功率过低可能意味着链路衰减（光衰）、光纤污染或对端发送异常。
    device_optical_tx_power:
      name: 光模块发送功率
      desc: 该指标按光模块报告发送光功率（dBm；园区交换机线侧为 µW，查询侧 10*log10(µW/1000) 换算，<=0 与无效哨兵 2147483647 丢弃），维度 descr 为 entPhysicalName。发送功率异常偏低通常意味着本端光模块老化或故障，而非单纯光纤光衰。
    device_optical_temperature:
      name: 光模块温度
      desc: 该指标按光模块报告温度（hwEntityOpticalTemperature，摄氏度；无效哨兵 2147483647 丢弃），维度 descr 为 entPhysicalName。模块温度过高会加速激光器老化，并可能先于光功率异常出现。
    device_optical_bias:
      name: 光模块偏置电流
      desc: 该指标按光模块报告激光器偏置电流（hwEntityOpticalBiasCurrent，线侧单位 µA；无效哨兵 2147483647 丢弃），维度 descr 为 entPhysicalName。偏离正常范围通常是发送端老化或故障的早期信号。
    device_optical_voltage:
      name: 光模块电压
      desc: 该指标按光模块报告供电电压（hwEntityOpticalVoltage；原始毫伏，查询侧除以 1000 显示为伏特，无效哨兵 2147483647 丢弃），维度 descr 为 entPhysicalName。与实体电压 device_voltage_volts（hwEntityVoltage）不同，二者可并存。电压越限会导致光模块工作不稳定。
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。通过监测设备的运行时间，网络管理员可以了解到设备的稳定性及可靠性，识别潜在的重启或故障问题。
    interface_ifAdminStatus:
      name: 接口管理状态
      desc: 此指标表示网络交换机接口的管理状态。它用于指示接口是否被管理人员启用（up）或禁用（down），以及其他状态如测试或已删除等。这个信息对网络管理和故障排查非常重要。
    interface_ifOperStatus:
      name: 接口操作状态
      desc: 此指标反映网络交换机接口的实际运行状态，表明接口是否正在工作。与管理状态不同，运行状态指示接口是否能够成功接收和发送流量。这对监测网络健康至关重要。
    interface_ifSpeed:
      name: 接口带宽
      desc: 该指标表示网络接口支持的最高数据传输速度，单位为比特每秒。了解接口的最高速度能够帮助管理员优化流量和利用网络资源。
    interface_ifInErrors:
      name: 接收错误数据包速率
      desc: 此指标计算过去5分钟内接收到的错误包的平均速率，单位为包每秒。通过监测接收错误，管理员可以及时发现潜在的问题，例如物理连接故障或配置错误。
    interface_ifOutErrors:
      name: 发送错误数据包速率
      desc: 该指标计算过去5分钟内发送错误包的平均速率，单位为包每秒。监测发送错误对于识别传输问题和确保数据完整性至关重要。
    interface_ifInDiscards:
      name: 接收丢包速率
      desc: 此指标表示过去5分钟内接收到的丢弃包的平均速率，单位为包每秒。丢包可能表示网络堵塞或资源不足，监控此指标可以帮助管理员优化网络性能。
    interface_ifOutDiscards:
      name: 发送丢包速率
      desc: 本指标计算过去5分钟内发送的丢弃包的平均速率，单位为包每秒。关注发送丢包情况能够帮助识别网络传输问题和配置不当的情况。
    interface_ifInUcastPkts:
      name: 接收单播数据包速率
      desc: 该指标表示过去5分钟内接收到的单播包的平均速率，单位为包每秒。单播包的监测对于评估接口的使用情况及流量负载非常重要。
    interface_ifOutUcastPkts:
      name: 发送单播数据包速率
      desc: 此指标计算过去5分钟内发送的单播包的平均速率，单位为包每秒。通过监测单播包的数量，管理员可以评估接口的传输性能以及流量的使用情况。
    interface_ifInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率，单位为字节每秒。监测字节流量有助于评估接口的负载及带宽使用情况。
    interface_ifOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率，单位为字节每秒。监测发送流量对于确保数据传输质量和优化网络性能非常重要。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器），单位为字节每秒。64 位计数器可避免
        32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器），单位为字节每秒。64 位计数器可避免
        32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率，单位为字节每秒。通过对多个接口的接收字节进行汇总计算，帮助管理员获取整个设备的接收流量情况，从而支持总体流量监控以及容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率，单位为字节每秒。通过对多个接口的发送字节进行汇总，管理员可以全面评估整个系统的发送性能，从而进行更有效的流量管理和优化。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标按实体报告华为交换机控制平面 CPU 使用率（hwEntityCpuUsage，0～100），维度 descr 为 entPhysicalName。CPU 持续偏高可能意味着控制平面过载、路由震荡或异常流量。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标按实体报告华为交换机内存使用率（hwEntityMemUsage，直接百分比 0～100），维度 descr 为 entPhysicalName。内存偏高可能由内存泄漏、路由/MAC/ARP 表项过大或容量不足导致。
    device_memory_used:
      name: 内存已用量
      desc: 该指标表示设备各内存池当前已使用的字节数。它帮助管理员了解每个内存池（如 Processor、I/O 池）的绝对内存消耗，并定位承压的内存池。
    device_memory_free:
      name: 内存空闲量
      desc: 该指标表示设备各内存池当前空闲可用的字节数。它与已用量一起决定整体内存使用率；空闲量持续偏低说明该内存池存在内存压力。
    device_memory_total:
      name: 内存总量
      desc: 该指标表示设备的内存总容量。它是计算内存使用率的分母（部分厂商按 (总量-空闲)/总量 计算），与空闲量一起反映整体内存压力。
    device_temperature_celsius:
      name: 温度
      desc: 该指标表示设备各硬件温度传感器的读数，单位为摄氏度。温度异常升高可能意味着风扇故障、散热受阻或环境过热，若不处理可能触发热保护或损坏硬件。
    device_fan_state:
      name: 风扇状态
      desc: 该指标表示设备各散热风扇的运行状态。线侧为二元枚举（1=正常，2=异常）。非正常状态表示散热故障，可能迅速导致过热，应立即排查。
    device_psu_state:
      name: 电源状态
      desc: 该指标表示已在位电源模块的运行状态（hwEntityPwrState）。线侧为 supply(1)/notSupply(2)/sleep(3)/unknown(4)。sleep 是冗余电源休眠，不是故障；空槽位通过 present(1) 过滤，不要把 >1 当成异常。
    device_psu_present:
      name: 电源在位
      desc: 该指标表示各电源模块是否在位（hwEntityPwrPresent）。线侧为 present(1)/absent(2)，不是 0/1。不在位表示槽位空置或模块被拔出。
    device_psu_current_mA:
      name: 电源电流
      desc: 该指标报告已在位电源模块输出电流（hwEntityPwrCurrent），线侧单位为毫安 (mA)，不是安培。空槽通过 present(1) 过滤；除以 1000 可读安培。维度 descr 为 hwEntityPwrSlot。
    device_psu_voltage_mV:
      name: 电源电压
      desc: 该指标报告已在位电源模块输出电压（hwEntityPwrVoltage），线侧单位为毫伏 (mV)，不是伏特。空槽通过 present(1) 过滤；除以 1000 可读伏特。维度 descr 为 hwEntityPwrSlot。
    device_psu_rated_power_watts:
      name: 电源额定功率
      desc: 该指标报告已在位电源模块的额定功率（hwEntityPwrPower，瓦特）。这是模块铭牌额定值，不是整机瞬时功耗。空槽通过 present(1) 过滤。维度 descr 为 hwEntityPwrSlot。
    device_fan_speed:
      name: 风扇转速
      desc: 该指标报告已在位散热风扇相对满速的转速百分比（hwEntityFanSpeed）。与风扇状态共用 hwFanStatusTable，维度 descr 为 hwEntityFanSlot；空槽通过 present(1) 过滤。转速持续偏高可能是在为高温补偿；状态正常但转速接近 0% 仍可能意味着卡转。
    device_fan_present:
      name: 风扇在位
      desc: 该指标表示各散热风扇是否在位（hwEntityFanPresent）。线侧为 present(1)/absent(2)，不是 0/1。不在位表示槽位空置或风扇框被拔出。
    device_power_used:
      name: 整机已用功耗
      desc: 该指标报告整机已用功耗（hwDevicePowerInfoUsedPower，瓦特）。在总功耗预算稳定时持续上升，说明负载增加或硬件效率下降。
    device_power_total:
      name: 整机总功耗
      desc: 该指标报告整机总功耗容量（hwDevicePowerInfoTotalPower，瓦特）。用于判断整机是否接近供电预算上限。
    device_entity_board_power:
      name: 单板功耗
      desc: 该指标按实体报告单板功耗（hwEntityBoardPower，瓦特），维度 descr 为 entPhysicalName。与 ENERGYMNGT 毫瓦序列 device_board_current_power_mw / device_board_rated_power_mw 并存，勿混单位。功耗异常升高可能意味着单板故障、转发负载过高或散热不良。
    device_energy_current_power_mw:
      name: 整机瞬时能耗（毫瓦）
      desc: 该指标报告整机瞬时能耗（hwCurrentPower），单位毫瓦。展示可 ÷1000 为瓦特。与 device_power_used（hwDevicePowerInfoUsedPower，瓦特）并存，勿混单位。
    device_energy_average_power_mw:
      name: 整机平均能耗（毫瓦）
      desc: 该指标报告整机周期平均能耗（hwAveragePower），单位毫瓦。展示可 ÷1000 为瓦特。与 device_power_used（瓦特）单位不同。
    device_energy_rated_power_mw:
      name: 整机额定能耗（毫瓦）
      desc: 该指标报告整机额定能耗（hwRatedPower），单位毫瓦。展示可 ÷1000 为瓦特。与 device_power_total（hwDevicePowerInfoTotalPower，瓦特）并存，勿混单位。
    device_board_current_power_mw:
      name: 板卡瞬时能耗（毫瓦）
      desc: 该指标按板卡报告瞬时能耗（hwBoardCurrentPower），单位毫瓦。展示可 ÷1000 为瓦特。维度 hwBoardName 为板卡名称。与整机瓦特功耗指标 device_power_used / device_power_total 以及实体瓦特指标 device_entity_board_power（hwEntityBoardPower）单位不同。
    device_board_rated_power_mw:
      name: 板卡额定能耗（毫瓦）
      desc: 该指标按板卡报告额定能耗（hwBoardRatedPower），单位毫瓦。展示可 ÷1000 为瓦特。维度 hwBoardName 为板卡名称。
    device_stack_member_role:
      name: 堆叠成员角色
      desc: 该指标表示 iStack/CE 堆叠各成员角色（hwMemberStackRole）。线侧为 master(1)/standby(2)/slave(3)；角色意外变化表示发生主备倒换或成员加入/离开。
    device_stack_port_state:
      name: 堆叠口状态
      desc: 该指标表示 iStack/CE 各堆叠口运行状态（hwStackPortStatus）。线侧为 up(1)/down(2)。down 表示堆叠物理口无法承载堆叠控制或转发。
    device_css_member_role:
      name: CSS 成员角色
      desc: 该指标表示 CSS 各成员角色（hwCssMemberRole）。线侧为 master(1)/standby(2)/slave(3)/single(4)/unknown(10)；角色意外变化表示 CSS 主备倒换。
    device_css_port_state:
      name: CSS 端口状态
      desc: 该指标表示 CSS 端口运行状态（hwCssPortOperStatus）。线侧为 down(0)/up(1)，与堆叠口 up(1)/down(2) 不同。down 表示集群端口无法承载 CSS 控制或转发。
    device_mlag_port_state:
      name: M-LAG 口状态
      desc: 该指标表示各 M-LAG 成员口运行状态（hwPortState）。线侧为 down(0)/up(1)。down 表示该成员口无法在双归捆绑中转发；未启用 M-LAG 时无序列。
    device_mlag_member_heartbeat:
      name: M-LAG 成员心跳
      desc: 该指标表示本端 M-LAG 成员心跳（hwLocalHeartBeatState）。线侧为 ok(1)/lost(2)。lost 表示双活控制通道中断。一致性检查为 trap，不轮询。
    device_flow_bytes_rate:
      name: 设备 Flow 总流量速率
      desc: 按当前协议指标契约从 Flow 记录估算出的设备总流量速率，用于观察整体带宽压力和容量趋势。
    device_flow_packets_rate:
      name: 设备 Flow 总包速率
      desc: 按当前协议指标契约从 Flow 记录估算出的设备总包速率，用于观察包级负载和突增流量。
    device_flow_in_bytes_rate:
      name: 设备 Flow 入方向流量速率
      desc: 基于 Flow 记录换算并归属到输入侧数据的流量速率；具体协议的接口方向请以接口指标为准。
    device_flow_out_bytes_rate:
      name: 设备 Flow 出方向流量速率
      desc: 基于 Flow 记录换算并归属到输出侧数据的流量速率；具体协议的接口方向请以接口指标为准。
    device_flow_in_packets_rate:
      name: 设备 Flow 入方向包速率
      desc: 基于 Flow 记录换算并归属到输入侧数据的包速率；具体协议的接口方向请以接口指标为准。
    device_flow_out_packets_rate:
      name: 设备 Flow 出方向包速率
      desc: 基于 Flow 记录换算并归属到输出侧数据的包速率；具体协议的接口方向请以接口指标为准。
    device_flow_avg_packet_size:
      name: 设备 Flow 平均包大小
      desc: 基于 Flow 记录计算出的平均包大小或采样帧长，可辅助识别小包风暴或大包传输特征。
    device_flow_effective_sampling_rate:
      name: 设备 Flow 生效采样率
      desc: 当前 Flow 数据计算使用的生效采样率，优先取设备上报字段，缺失时使用资产兜底采样率。
    device_flow_interface_bytes_rate:
      name: 接口 Flow 流量速率
      desc: 按接口和方向聚合的 Flow 流量速率，用于定位接口维度的流量热点。
    device_flow_interface_packets_rate:
      name: 接口 Flow 包速率
      desc: 按接口和方向聚合的 Flow 包速率，用于定位接口维度的包量热点。
    device_flow_top_interfaces_by_bytes:
      name: Top 接口 Flow 流量速率
      desc: 按流量速率排序的接口 Flow 排行，用于快速发现高流量接口。
    device_flow_protocol_bytes_rate:
      name: 协议 Flow 流量速率
      desc: 按协议聚合的 Flow 流量速率，用于识别 TCP、UDP、ICMP 等协议流量占比。
    device_flow_protocol_packets_rate:
      name: 协议 Flow 包速率
      desc: 按协议聚合的 Flow 包速率，用于识别协议层面的包量异常。
    device_flow_dst_port_bytes_rate:
      name: 目的端口 Flow 流量速率
      desc: 按目的端口聚合的 Flow 流量速率，用于分析应用或服务端口流量热点。
    device_flow_dst_port_packets_rate:
      name: 目的端口 Flow 包速率
      desc: 按目的端口聚合的 Flow 包速率，用于分析应用或服务端口包量热点。
    device_flow_src_port_bytes_rate:
      name: 源端口 Flow 流量速率
      desc: 按源端口聚合的 Flow 流量速率，用于辅助分析客户端侧端口流量分布。
    device_flow_top_src_bytes_rate:
      name: Top 源地址 Flow 流量速率
      desc: 按源地址聚合并排序的 Flow 流量速率，用于发现主要流量来源。
    device_flow_top_dst_bytes_rate:
      name: Top 目的地址 Flow 流量速率
      desc: 按目的地址聚合并排序的 Flow 流量速率，用于发现主要流量去向。
    device_flow_top_src_packets_rate:
      name: Top 源地址 Flow 包速率
      desc: 按源地址聚合并排序的 Flow 包速率，用于发现包量异常来源。
    device_flow_top_dst_packets_rate:
      name: Top 目的地址 Flow 包速率
      desc: 按目的地址聚合并排序的 Flow 包速率，用于发现包量异常目标。
    device_flow_top_conversation_bytes_rate:
      name: Top 会话 Flow 流量速率
      desc: 按源地址、目的地址、协议和目的端口聚合的会话流量排行，用于定位主要通信关系。
    device_psu_temperature_celsius:
      name: 电源温度
      desc: 采集 IP Infusion (OcNOS) 设备机箱级 PSU 1 温度传感器读数（IPI-CMM-CHASSIS-MIB cmmSysPSTemperature1），单位摄氏度。用于监测电源模块工作温度，过高温度可能提示散热不良、风扇故障或环境过热，存在触发热保护或硬件损坏风险。
