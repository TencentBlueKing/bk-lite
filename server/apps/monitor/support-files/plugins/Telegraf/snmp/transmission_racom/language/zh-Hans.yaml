Transmission RACOM SNMP:
  name: RACOM（Telegraf）
  desc: 面向 RACOM 传输设备的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、温度、接口流量、电压，适用于 RAy3（企业号 PEN 33555）。
monitor_object:
  Transmission: 传输设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Transmission:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    cpu_usage_percent:
      name: CPU 使用率
      desc: RACOM RAy3 微波设备的 CPU 使用率，以 0-100 百分比直接上报、不做换算。持续偏高可能表示无线回传业务压力、控制平面负载或异常流量。
    memory_usage_percent:
      name: 内存使用率
      desc: RACOM RAy3 微波设备的内存使用率，以 0-100 百分比直接上报、不做换算。持续偏高可能表示控制面资源压力或设备服务不稳定。
    modem_temperature_celsius:
      name: 调制解调器温度
      desc: RACOM RAy3 微波设备调制解调器板温度，单位为摄氏度。SNMP 标量以百分之一摄氏度上报，查询侧除以 100。温度偏高可能表示散热异常、环境温度过高或硬件过载。
    radio_temperature_celsius:
      name: 射频温度
      desc: RACOM RAy3 微波设备可选射频模块温度，单位为摄氏度。SNMP 标量以百分之一摄氏度上报，查询侧除以 100。部分固件不返回该对象。温度偏高可能表示射频硬件热压力。
    device_voltage_volts:
      name: 供电电压
      desc: RACOM RAy3 微波设备可选供电电压，单位为伏特。SNMP 标量以十分之一伏特上报，查询侧除以 10。偏离额定直流输入可能表示欠压、接线故障或电源异常。
    rss_dbm:
      name: 接收信号强度
      desc: RACOM RAy3 微波链路可选接收信号强度，单位为 dBm。SNMP 标量以十分之一 dBm 上报（例如 -39 表示 -3.9 dBm），查询侧除以 10。RSS 持续下降可能表示路径衰落、天线失准或射频劣化。
    device_cpu_usage:
      name: CPU 使用率
      desc: 传输设备的整体 CPU 使用率，以 0-100 百分比直接上报。持续偏高可能表示无线回传业务压力、控制平面负载或异常流量。
    device_memory_usage:
      name: 内存使用率
      desc: 传输设备的整体内存使用率，以 0-100 百分比直接上报。持续偏高可能表示控制面资源压力或设备服务不稳定。
    device_temperature_celsius:
      name: 温度
      desc: 传输设备的 CPU 或机箱温度，单位为摄氏度。温度偏高可能表示散热异常、环境温度过高或硬件过载。
    device_fan_state:
      name: 风扇状态
      desc: 传输设备各散热风扇或风扇控制器的运行状态。非正常状态表示散热模块异常、离线或通信故障，可能导致设备过热。
    device_psu_state:
      name: 电源状态
      desc: 传输设备各电源模块的运行状态。非正常状态表示电源离线、无输入、过温、硬件故障或告警，需及时排查。
monitor_object_metric_group:
  Transmission:
    Base: 基础
    Traffic: 流量
    CPU: CPU
    Memory: 内存
    Temperature: 温度
    Hardware Status: 硬件状态
    Radio: 无线
