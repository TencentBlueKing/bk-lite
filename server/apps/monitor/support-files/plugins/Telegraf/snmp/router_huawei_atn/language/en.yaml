Router Huawei ATN SNMP:
  name: Huawei ATN (Telegraf)
  desc: "SNMP monitoring template for Huawei ATN series routers. It reports uptime, CPU utilization, memory utilization, temperature, fan, power supply status, optical modules, interface traffic, voltage, and power (enterprise PEN 2011)."
monitor_object:
  Router: Router
monitor_object_type:
  Network Device: Network Equipment
monitor_object_metric:
  Router:
    snmp_uptime:
      name: System Uptime
      desc: This metric indicates the uptime of the device since the last restart. By monitoring
        the uptime, network administrators can understand the stability and reliability of
        the device and identify potential reboot or failure issues.
    device_cpu_usage:
      name: CPU Utilization
      desc: Per-entity CPU utilization of the Huawei ATN device control plane (hwEntityCpuUsage),
        normalized to a 0-100 percentage. Dimension descr is entPhysicalName. Sustained high
        CPU usage can indicate control-plane overload, routing instability, or attack traffic,
        and may lead to slow management response or packet processing delays.
    device_memory_usage:
      name: Memory Utilization
      desc: Per-entity memory utilization of the Huawei ATN device (hwEntityMemUsage), reported
        directly as a 0-100 percentage. Dimension descr is entPhysicalName. High memory usage
        may indicate memory leaks, oversized routing tables, or insufficient capacity, and
        can cause instability or failed allocations.
    device_temperature_celsius:
      name: Temperature
      desc: This metric reports the temperature reading of each Huawei hardware sensor (hwEntityTemperature),
        in degrees Celsius. Abnormally high temperatures may indicate fan failure, blocked
        airflow, or excessive ambient heat, and can trigger thermal protection or hardware
        damage if left unaddressed.
    device_voltage_volts:
      name: Input Voltage
      desc: Per-entity input voltage of the Huawei ATN device (hwEntityVoltage). The device
        reports millivolts; the query divides by 1000 to display volts. Values outside the
        rated range may indicate unstable power and hardware risk.
    device_fan_state:
      name: Fan Status
      desc: This metric reports the operational state of each Huawei cooling fan (hwEntityFanState).
        Huawei reports a binary state (1=normal, 2=abnormal). Dimension index is the fan
        table row index. A non-normal state indicates a cooling fault that can quickly lead
        to overheating and should be investigated immediately.
    device_optical_rx_power:
      name: SFP RX Power
      desc: Per-module SFP/optical receive power in dBm (hwEntityOpticalRxPower). The device
        reports uW; Telegraf stores raw uW and this query converts with 10*log10(uW/1000),
        dropping <=0 (invalid/no-module). Dimension descr is entPhysicalName. A dropping RX
        level is an early sign of fiber attenuation, dirty optics, or a failing peer transmitter.
    device_optical_tx_power:
      name: SFP TX Power
      desc: Per-module SFP/optical transmit power in dBm (hwEntityOpticalTxPower). The device
        reports uW; Telegraf stores raw uW and this query converts with 10*log10(uW/1000),
        dropping <=0 (invalid/no-module). Dimension descr is entPhysicalName. An abnormally
        low TX level indicates a failing laser/optic rather than fiber attenuation alone.
    device_cpu_dev_duty:
      name: Device CPU Duty
      desc: Instantaneous CPU duty of each Huawei ATN CPU device entry (hwCpuDevDuty), reported
        as a 0-100 percentage. Complements per-entity hwEntityCpuUsage for control-plane load
        on ATN platforms.
    device_cpu_dev_avg_duty_1min:
      name: Device CPU Duty (1 min)
      desc: One-minute average CPU duty of each Huawei ATN CPU device entry (hwAvgDuty1min),
        reported as a 0-100 percentage. Use this to smooth short spikes when judging control-plane
        pressure.
    device_cpu_dev_avg_duty_5min:
      name: Device CPU Duty (5 min)
      desc: Five-minute average CPU duty of each Huawei ATN CPU device entry (hwAvgDuty5min),
        reported as a 0-100 percentage. Sustained elevation points to lasting control-plane
        load rather than a brief burst.
    device_memory_dev_size:
      name: Device Memory Size
      desc: Total memory size of each Huawei ATN memory device entry (hwMemoryDevSize64), in
        bytes. Together with free memory it shows capacity remaining on the forwarding/control
        memory pool.
    device_memory_dev_free:
      name: Device Memory Free
      desc: Free memory of each Huawei ATN memory device entry (hwMemoryDevFree64), in bytes.
        Persistently low free memory indicates rising memory pressure and risk of allocation
        failure.
    device_psu_state:
      name: Power Supply Status
      desc: Operational state of each Huawei ATN power supply (hwEntityPwrState). On-wire
        values are supply(1), notSupply(2), sleep(3), and unknown(4), not a binary normal/abnormal.
        sleep is a valid redundant-PSU energy-saving state, not a fault. Do not treat >1 as
        a fault.
    device_psu_present:
      name: Power Supply Present
      desc: Presence of each Huawei ATN power supply (hwEntityPwrPresent). Absent means the
        slot is empty or the module was pulled; combined with PSU state this confirms lost
        redundancy.
    device_fan_speed:
      name: Fan Speed
      desc: Fan rotation speed of each Huawei ATN cooling fan (hwEntityFanSpeed). Dimension
        index is the fan table row index. Abnormally low or zero speed indicates a stalled
        or failed fan and a risk of overheating; abnormally high speed may indicate the device
        is compensating for high temperature.
    device_fan_present:
      name: Fan Present
      desc: Presence of each Huawei ATN cooling fan (hwEntityFanPresent). Dimension index is
        the fan table row index. Absent means the fan tray is missing; investigate immediately
        because cooling capacity is reduced.
    device_entity_board_power:
      name: Board Power
      desc: Board power consumption of each Huawei ATN entity (hwEntityBoardPower), in watts.
        Unexpected rise can indicate a failing board, abnormal traffic load, or a cooling
        problem that increases power draw.
    device_power_used:
      name: Chassis Used Power
      desc: Chassis-level used power of the Huawei ATN device (hwDevicePowerInfoUsedPower),
        in watts. Rising used power against a stable total budget indicates growing load or
        a hardware inefficiency.
    device_power_total:
      name: Chassis Total Power
      desc: Chassis-level total power capacity of the Huawei ATN device (hwDevicePowerInfoTotalPower),
        in watts. Used as the denominator when judging how close the chassis is to its power
        budget.
    device_entity_oper_status:
      name: Entity Oper Status
      desc: Operational status of each Huawei ATN entity (hwEntityOperStatus). Disabled or
        offline entities should be correlated with standby status and slot state to locate
        failed boards.
    device_entity_standby_status:
      name: Entity Standby Status
      desc: Standby status of each Huawei ATN entity (hwEntityStandbyStatus). Unexpected loss
        of providingService or hotStandby on a redundant board indicates a switchover or a
        failed standby.
    device_optical_temperature:
      name: Optical Module Temperature
      desc: Temperature of each Huawei ATN optical module (hwEntityOpticalTemperature), in
        degrees Celsius. High module temperature accelerates laser aging and can precede optical
        power failure.
    device_optical_bias:
      name: Optical Module Bias
      desc: Laser bias current of each Huawei ATN optical module (hwEntityOpticalBiasCurrent).
        Drift away from the normal range is an early sign of a failing transmitter.
    device_optical_voltage:
      name: Optical Module Voltage
      desc: Supply voltage of each Huawei ATN optical module (hwEntityOpticalVoltage). The
        device reports millivolts; the query divides by 1000 to display volts. Out-of-range
        voltage can cause unstable optics.
    interface_ifAdminStatus:
      name: Interface Admin Status
      desc: This metric indicates the administrative status of the network interface.
    interface_ifOperStatus:
      name: Interface Oper Status
      desc: This metric reflects the actual operational status of the network interface.
    interface_ifSpeed:
      name: Interface Bandwidth
      desc: This metric indicates the maximum data transmission speed supported by the network
        interface.
    interface_ifHighSpeed:
      name: Interface High Speed
      desc: Interface speed in megabits per second from IF-MIB ifHighSpeed. Used together
        with ifSpeed so high-rate ATN ports are not capped by the 32-bit ifSpeed gauge.
    interface_ifInErrors:
      name: Incoming Errors Rate
      desc: This metric calculates the average rate of incoming error packets over the past
        5 minutes.
    interface_ifOutErrors:
      name: Outgoing Errors Rate
      desc: This metric calculates the average rate of outgoing error packets over the past
        5 minutes.
    interface_ifInDiscards:
      name: Incoming Discards Rate
      desc: This metric represents the average rate of incoming discarded packets over the
        past 5 minutes.
    interface_ifOutDiscards:
      name: Outgoing Discards Rate
      desc: This metric calculates the average rate of outgoing discarded packets over the
        past 5 minutes.
    interface_ifInUcastPkts:
      name: Incoming Unicast Packets Rate
      desc: This metric indicates the average rate of incoming unicast packets over the past
        5 minutes.
    interface_ifOutUcastPkts:
      name: Outgoing Unicast Packets Rate
      desc: This metric calculates the average rate of outgoing unicast packets over the past
        5 minutes.
    interface_ifInOctets:
      name: Interface Incoming Traffic Rate
      desc: This metric indicates the average rate of bytes received over the past 5 minutes.
    interface_ifOutOctets:
      name: Interface Outgoing Traffic Rate
      desc: This metric calculates the average rate of bytes sent over the past 5 minutes.
    interface_ifHCInOctets:
      name: Interface Incoming Traffic Rate (HC)
      desc: This metric indicates the average rate of bytes received over the past 5 minutes,
        based on the 64-bit ifHCInOctets counter which does not wrap on high-speed interfaces.
    interface_ifHCOutOctets:
      name: Interface Outgoing Traffic Rate (HC)
      desc: This metric calculates the average rate of bytes sent over the past 5 minutes,
        based on the 64-bit ifHCOutOctets counter which does not wrap on high-speed interfaces.
    device_total_incoming_traffic:
      name: Device Total Incoming Traffic Rate
      desc: This metric indicates the average rate of total bytes received by the entire device
        over the past 5 minutes.
    device_total_outgoing_traffic:
      name: Device Total Outgoing Traffic Rate
      desc: This metric represents the average rate of total bytes sent by the entire device
        over the past 5 minutes.
monitor_object_metric_group:
  Router:
    Base: Base
    Status: Status
    Bandwidth: Bandwidth
    Packet Error: Packet Error
    Packet Loss: Packet Loss
    Packet: Packet
    Traffic: Traffic
    CPU: CPU
    Memory: Memory
    Temperature: Temperature
    Hardware Status: Hardware Status
