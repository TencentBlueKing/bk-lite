Transmission MNI Proteus SNMP:
  name: MNI Proteus（Telegraf）
  desc: 面向 Microwave Networks Proteus AMT / MX 系列微波设备（MNI-PROTEUS-AMT-MIB，企业号 PEN 3323）的 SNMP 监控模板，可按射频采集运行时长、RFU
    温度、发射功率、接收信号电平（RSL），以及接口流量。
monitor_object:
  Transmission: 传输设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Transmission:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    device_temperature_celsius:
      name: RFU 温度
      desc: 各射频单元（RFU）温度，单位为摄氏度。温度持续偏高可能表示日晒或散热异常。
    radio_tx_power_dbm:
      name: 发射功率（dBm）
      desc: 各射频实际发射功率，单位为 dBm。
    radio_rsl_dbm:
      name: 接收信号电平（dBm）
      desc: 各射频接收信号电平（RSL），单位为 dBm。持续下降可能表示衰落、天线偏移或路径遮挡。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  Transmission:
    Base: 基础
    Traffic: 流量
    Temperature: 温度
    Radio: 射频
