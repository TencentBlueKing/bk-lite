Firewall Juniper SNMP:
  name: 瞻博 SRX（Telegraf）
  desc: 面向瞻博 SRX 防火墙的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、会话/连接数、接口流量（企业号 PEN 2636）。
monitor_object:
  Firewall: 防火墙
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Firewall:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间。
    device_cpu_usage:
      name: CPU 使用率
      desc: 该指标按 SPU 报告 Juniper SRX 防火墙 CPU 使用率（jnxJsSPUMonitoringCPUUsage，0～100），维度
        index 为 SNMP 表行，node_descr 为可选 SPU 节点描述。持续偏高可能意味着检测负载过重或攻击活动。
    device_memory_usage:
      name: 内存使用率
      desc: 该指标按 SPU 报告 Juniper SRX 防火墙内存使用率（jnxJsSPUMonitoringMemoryUsage，直接百分比）。内存压力过高时可能影响会话处理。
    firewall_active_sessions:
      name: 活动会话数
      desc: 该指标报告各 Juniper SRX SPU 当前跟踪的流会话数（jnxJsSPUMonitoringCurrentFlowSession）。数量快速上升可能意味着连接洪泛或会话表压力。
    firewall_max_sessions:
      name: 最大会话数
      desc: 该指标报告各 Juniper SRX SPU 的流会话容量（jnxJsSPUMonitoringMaxFlowSession）。结合活动会话数可评估会话表余量。
monitor_object_metric_group:
  Firewall:
    Base: 基础
    Firewall: 防火墙
