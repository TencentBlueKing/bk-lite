NetworkService HW group STE SNMP:
  name: HW group STE（Telegraf）
  desc: 面向 HW group STE / STE2 以太网温湿度计（STE-MIB / STE2-MIB，企业号 PEN 21796）的 SNMP 监控模板，可采集运行时长、温度与相对湿度传感器读数、传感器告警状态，以及接口流量。
monitor_object:
  NetworkService: 网络服务
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    sensor_temperature_celsius:
      name: 传感器温度
      desc: 各温度传感器读数，单位为摄氏度。
    sensor_humidity_percent:
      name: 传感器相对湿度
      desc: 各湿度传感器读数，单位为百分比。
    sensor_state:
      name: 传感器告警状态
      desc: 各传感器告警状态，异常表示读数超出范围或超出设备上配置的告警上下限。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内出向发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32
        位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  NetworkService:
    Base: 基础
    Traffic: 流量
    Environment: 环境
    Hardware Status: 硬件状态
