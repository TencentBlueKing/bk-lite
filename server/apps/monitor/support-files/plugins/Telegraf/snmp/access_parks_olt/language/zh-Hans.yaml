Access Parks OLT SNMP:
  name: Parks OLT（Telegraf）
  desc: 面向 Parks Fiberlink OLT 接入设备的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存（总量、空闲、已用、使用率）、温度传感器读数与告警状态、接口流量（企业号
    PEN 3893），风扇与电源状态不采集。
monitor_object:
  Access: 接入设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Access:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免
        32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免
        32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
    device_cpu_usage:
      name: CPU 使用率
      desc: Parks OLT 的 CPU 平均使用率（pkCpuSystem，设备以 0.1% 为单位上报）。持续偏高说明控制平面或管理平面负载过高。
    device_memory_total:
      name: 内存总量
      desc: Parks OLT 的内存总量（pkMemoryTotal，设备以 KB 上报），单位为字节。
    device_memory_free:
      name: 空闲内存
      desc: Parks OLT 的空闲内存（pkMemoryFree，设备以 KB 上报），单位为字节。持续降低表示存在内存压力。
    device_memory_used:
      name: 已用内存
      desc: Parks OLT 的已用内存（pkMemoryUsed，设备以 KB 上报），单位为字节。
    device_memory_usage:
      name: 内存使用率
      desc: Parks OLT 的内存使用率，按 已用/总量 × 100 计算。持续偏高可能表示 ONU 管理表或控制服务存在内存压力。
    device_temperature_celsius:
      name: 温度
      desc: Parks OLT 各温度传感器读数，单位摄氏度，按传感器位置区分。持续升高可能表示散热异常或环境温度过高。
    device_temperature_state:
      name: 温度传感器状态
      desc: Parks OLT 各温度传感器告警状态。normal 归一为 1；limitexceeded 及其它值归一为 2，表示传感器超过阈值。
monitor_object_metric_group:
  Access:
    Base: 基础
    Traffic: 流量
    Access: 接入设备
    Temperature: 温度
    Hardware Status: 硬件状态
