Wireless Zmtel SNMP:
  name: Zmtel（Telegraf）
  desc: 面向 Zmtel LTE ODU 无线设备的 SNMP 监控模板，可采集运行时长、CPU 使用率、内存使用率、内存总量、接口流量（企业号 PEN 38595）。
monitor_object:
  Wireless: 无线设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示 Zmtel LTE ODU 自上次启动以来的运行时间（来自 sysUpTime）。通过监测运行时间，管理员可以了解室外单元的稳定性，识别意外重启。
    device_cpu_usage:
      name: CPU 使用率
      desc: Zmtel LTE ODU 的当前 CPU 利用率（ZMTEL-ODU-MIB cpuUsageCurrent，OID 1.3.6.1.4.1.38595.10.2.2.0），以
        0-100 百分比上报。持续偏高可能表示室外单元控制平面过载。
    device_memory_usage:
      name: 内存使用率
      desc: Zmtel LTE ODU 的当前内存利用率（ZMTEL-ODU-MIB memUsageCurrent，OID 1.3.6.1.4.1.38595.10.2.6.0），以
        0-100 百分比上报。内存压力过高可能影响 LTE 会话处理。
    device_memory_total:
      name: 内存总量
      desc: Zmtel LTE ODU 的内存总量，单位字节（ZMTEL-ODU-MIB memTotal，OID 1.3.6.1.4.1.38595.10.2.5.0，设备以
        KB 上报，采集时 ×1024 转为字节）。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  Wireless:
    Base: 基础
    CPU: CPU
    Memory: 内存
    Traffic: 流量
