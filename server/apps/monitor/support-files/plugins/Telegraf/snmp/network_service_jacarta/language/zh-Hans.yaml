NetworkService Jacarta interSeptor Pro SNMP:
  name: Jacarta interSeptor Pro（Telegraf）
  desc: 面向 Jacarta interSeptor Pro 环境监控设备的 SNMP 监控模板，可采集环境温度、温度状态、相对湿度、湿度状态、每端口入向流量速率、每端口出向流量速率和运行时长。默认按摄氏标定，现场需核对温度单位。
monitor_object:
  NetworkService: 网络服务
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  NetworkService:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内出向发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64
        位计数器可避免 32 位 ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    env_temperature_celsius:
      name: 环境温度
      desc: 来自 isDeviceMonitorTemperature 的逐传感器环境温度，单位为摄氏度。SNMP 原始值为百分之一度，采集侧除以 100。华氏读数会换算为摄氏。alarm 为 disable 的行会被丢弃。
    env_temperature_status:
      name: 环境温度状态
      desc: 来自 isDeviceMonitorTemperatureAlarm 的温度告警状态，统一归一为 1=正常、2=异常。unknown 不产出状态值，disable 丢弃该行。
    env_humidity_percent:
      name: 环境湿度
      desc: 来自 isDeviceMonitorHumidity 的逐传感器相对湿度，单位为百分比。SNMP 原始值为百分之一，采集侧除以 100。alarm 为 disable 的行会被丢弃。
    env_humidity_status:
      name: 环境湿度状态
      desc: 来自 isDeviceMonitorHumidityAlarm 的湿度告警状态，统一归一为 1=正常、2=异常。unknown 不产出状态值，disable 丢弃该行。
monitor_object_metric_group:
  NetworkService:
    Base: 基础
    Traffic: 流量
    NetworkService: 网络服务
    Environment: 环境
