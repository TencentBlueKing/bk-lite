Access Calix E5 SNMP:
  name: Calix E5（Telegraf）
  desc: 面向 Calix E5-111 以太网接入 / MSAN 设备（企业号 PEN 6321，E5-111-IESCOMMON-MIB）的 SNMP 监控模板，可采集运行时长、系统温度传感器、风扇转速、各路电压、接口流量。
monitor_object:
  Access: 接入设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Access:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    device_temperature_celsius:
      name: 设备温度
      desc: 接入设备温度，单位为摄氏度。温度持续偏高可能表示散热不良、环境温度过高或设备负载过高。
    device_fan_rpm:
      name: 风扇转速
      desc: 接入设备风扇转速，单位为转每分钟。转速持续偏低或为零可能表示风扇停转或散热失效。
    device_voltage_volts:
      name: 板卡电压
      desc: 接入设备板卡电压读数，单位伏特（由毫伏换算）。读数偏离预期轨压可能表示电源或硬件异常。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifOutOctets 在高速口上快速回绕，使流量速率更准确。
monitor_object_metric_group:
  Access:
    Base: 基础
    Traffic: 流量
    Temperature: 温度
    Hardware Status: 硬件状态
