Wireless Ruckus Unleashed SNMP:
  name: Ruckus Unleashed（Telegraf）
  desc: 面向 Ruckus Unleashed 无线网络（RUCKUS-UNLEASHED-SYSTEM-MIB）的 SNMP 监控模板，可采集运行时长、CPU 与内存使用率、关联/已注册/许可
    AP 数、已认证客户端数、接口流量（企业号 PEN 25053）。
monitor_object:
  Wireless: 无线设备
monitor_object_type:
  Network Device: 网络设备
monitor_object_metric:
  Wireless:
    snmp_uptime:
      name: 系统运行时间
      desc: 该指标表示设备自上次启动以来的运行时间（来自 sysUpTime）。通过监测设备运行时间，网络管理员可以了解设备的稳定性与可靠性，识别潜在的重启或故障问题。
    device_cpu_usage:
      name: CPU 使用率
      desc: Ruckus Unleashed 主 AP 直接上报的 CPU 使用率（0~100）。持续偏高可能表示终端接入负载过重或控制面压力，影响漫游与管理响应。
    device_memory_usage:
      name: 内存使用率
      desc: Ruckus Unleashed 主 AP 直接上报的内存使用率（0~100）。内存压力过高可能导致终端掉线或服务重启。
    wireless_ap_count:
      name: 关联 AP 数
      desc: 当前已加入 Unleashed 网络的 AP 数量。突然下降可能表示 AP 失联或主 AP 切换。
    wireless_registered_ap_count:
      name: 已注册 AP 数
      desc: Unleashed 网络中已注册的 AP 数量。与在线 AP 数对比可发现已注册但离线的 AP。
    wireless_client_count:
      name: 客户端数
      desc: Unleashed 网络中已认证的无线终端数量。快速增长可能伴随主 AP 的 CPU 与内存压力上升。
    wireless_licensed_ap_count:
      name: 许可 AP 数
      desc: Unleashed 网络允许接入的最大 AP 数量。在线 AP 数接近该上限时，新 AP 将无法加入。
    interface_ifHCInOctets:
      name: 接口接收流量速率
      desc: 此指标表示过去5分钟内接收到的字节数的平均速率（来自 64 位 IF-MIB ifHCInOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifInOctets 在高速口上快速回绕，使流量速率更准确。
    interface_ifHCOutOctets:
      name: 接口发送流量速率
      desc: 该指标计算过去5分钟内发送的字节数的平均速率（来自 64 位 IF-MIB ifHCOutOctets 计数器，ifXTable），单位为字节每秒。64 位计数器可避免 32 位
        ifOutOctets 在高速口上快速回绕，使流量速率更准确。
    device_total_incoming_traffic:
      name: 设备接收总流量速率
      desc: 此指标表示整个设备在过去5分钟内接收到的总字节流量的平均速率（按所有接口的 64 位 ifHCInOctets 汇总），单位为字节每秒。帮助管理员获取整个设备的接收流量情况，支持总体流量监控与容量规划。
    device_total_outgoing_traffic:
      name: 设备发送总流量速率
      desc: 此指标表示整个设备在过去5分钟内发送的总字节流量的平均速率（按所有接口的 64 位 ifHCOutOctets 汇总），单位为字节每秒。帮助管理员评估整个系统的发送性能，进行更有效的流量管理与优化。
monitor_object_metric_group:
  Wireless:
    Base: 基础
    Traffic: 流量
    Wireless: 无线
