Nginx:
  desc: Through the Telegraf collector, regularly collect metrics from Nginx such
    as requests, connection status, and processing efficiency, to aid in monitoring
    and optimizing website performance and stability.
  name: Nginx(Telegraf)
monitor_object:
  Nginx: Nginx
monitor_object_type:
  Middleware: Middleware
monitor_object_metric:
  Nginx:
    nginx_active:
      name: Active Connections
      desc: Number of active client connections, reflecting concurrent load
    nginx_reading:
      name: Reading Connections
      desc: Number of connections reading request headers, reflecting request processing
        status
    nginx_writing:
      name: Writing Connections
      desc: Number of connections writing responses, reflecting response processing
        status
    nginx_waiting:
      name: Waiting Connections
      desc: Number of idle connections waiting for requests, reflecting connection
        pool usage
    nginx_requests_rate:
      name: Request Rate
      desc: Average requests handled per second over the last 5 minutes, used to observe
        real-time load.
    nginx_accepts_rate:
      name: Connection Acceptance Rate
      desc: Average new connections accepted per second over the last 5 minutes.
    nginx_handled_rate:
      name: Connection Handling Rate
      desc: Average connections handled per second over the last 5 minutes.
    nginx_http_requests_total:
      name: Total HTTP Requests
      desc: Total number of HTTP requests handled by Nginx.
    nginx_connections_accepted:
      name: Accepted Connections
      desc: Client connections accepted by Nginx.
    nginx_connections_handled:
      name: Handled Connections
      desc: Client connections handled by Nginx.
    nginx_up:
      name: Collection Status
      desc: 1 when stub_status collection succeeds, and 0 when it fails.
      enum:
        "0": Failed
        "1": Succeeded
    nginx_vts_server_connections:
      name: Server Connections
      desc: Current connections grouped by status.
    nginx_vts_connections_accepted:
      name: Accepted Connections Total
      desc: Client connections accepted by Nginx.
    nginx_vts_connections_handled:
      name: Handled Connections Total
      desc: Client connections handled by Nginx.
    nginx_vts_connections_requests:
      name: HTTP Requests Total
      desc: HTTP requests handled by Nginx.
    nginx_vts_server_requests:
      name: Server Requests
      desc: Requests per server zone, counted by response status code.
    nginx_vts_server_bytes:
      name: Server Bytes
      desc: Inbound or outbound bytes for each server zone.
    nginx_vts_server_cache:
      name: Server Cache
      desc: Requests per server zone, counted by cache result.
    nginx_vts_server_requestMsec:
      name: Request Processing Time
      desc: Average request processing time for each server zone.
    nginx_vts_filter_requests:
      name: Filter Requests
      desc: Requests per filter, counted by response status code.
    nginx_vts_filter_bytes:
      name: Filter Bytes
      desc: Inbound or outbound bytes for each filter.
    nginx_vts_filter_requestMsec:
      name: Filter Request Time
      desc: Average request processing time for each filter.
    nginx_vts_filter_cache:
      name: Filter Cache
      desc: Requests per filter, counted by cache result.
    nginx_vts_upstream_requests:
      name: Upstream Requests
      desc: Requests per upstream server, counted by response status code.
    nginx_vts_upstream_bytes:
      name: Upstream Bytes
      desc: Inbound or outbound bytes for each upstream server.
    nginx_vts_upstream_requestMsec:
      name: Upstream Request Time
      desc: Average request processing time for each upstream server.
    nginx_vts_upstream_responseMsec:
      name: Upstream Response Time
      desc: Average response time for each upstream server.
    nginx_vts_upstream_down:
      name: Upstream Down
      desc: Whether the upstream server is marked down.
      enum:
        "0": Not Down
        "1": Down
    nginx_vts_upstream_backup:
      name: Upstream Backup
      desc: Whether the upstream server is a backup server.
      enum:
        "0": Primary
        "1": Backup
    nginx_vts_upstream_weight:
      name: Upstream Weight
      desc: Load weight of the upstream server.
    nginx_vts_upstream_max_fails:
      name: Max Fails
      desc: Maximum failures allowed for the upstream server.
    nginx_vts_upstream_fail_timeout:
      name: Fail Timeout
      desc: Pause duration after the upstream server reaches its failure limit.
monitor_object_metric_group:
  Nginx:
    StubStatus: Stub Status
    Performance: Performance
    Vts: Virtual Host Traffic
