      desc: Prefill time P99 over the last 5 minutes.
    vllm:request_prefill_time_seconds_avg:
      name: Prefill Time Average
      desc: Average prefill time over the last 5 minutes.
    vllm:request_decode_time_seconds_p50:
      name: Decode Time P50
      desc: Decode time P50 over the last 5 minutes.
    vllm:request_decode_time_seconds_p90:
      name: Decode Time P90
