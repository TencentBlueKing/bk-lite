VLLM:
  name: vLLM Inference Server
  desc: Collect vLLM Prometheus metrics via Telegraf Pull
monitor_object:
  VLLM: vLLM
monitor_object_type:
  LLM Inference: LLM Inference
monitor_object_metric:
  VLLM:
    vllm:num_requests_running_gauge:
      name: Running Requests
      desc: Number of requests currently in model execution batches.
    vllm:num_requests_waiting_gauge:
      name: Waiting Requests
      desc: Number of requests waiting for scheduler capacity.
    vllm:kv_cache_usage_perc_gauge:
      name: KV Cache Usage
      desc: Fraction of used KV cache blocks (0–1).
    vllm:prompt_tokens_total_counter_rate:
      name: Prefill Token Rate
      desc: Prompt (prefill) token processing rate over the last 5 minutes.
    vllm:generation_tokens_total_counter_rate:
      name: Generation Token Rate
      desc: Generation token rate over the last 5 minutes.
    vllm:time_to_first_token_seconds_p99:
      name: TTFT P99
      desc: Time-to-First-Token P99 over the last 5 minutes.
    vllm:e2e_request_latency_seconds_p99:
      name: E2E Latency P99
      desc: End-to-end request latency P99 over the last 5 minutes.
    vllm:request_success_total_counter_rate:
      name: Successful Request Rate
      desc: Successful request completion rate over the last 5 minutes.
    vllm:time_to_first_token_seconds_p50:
      name: TTFT P50
      desc: Time-to-First-Token P50 over the last 5 minutes.
    vllm:time_to_first_token_seconds_p90:
      name: TTFT P90
      desc: Time-to-First-Token P90 over the last 5 minutes.
    vllm:time_to_first_token_seconds_p95:
      name: TTFT P95
      desc: Time-to-First-Token P95 over the last 5 minutes.
    vllm:time_to_first_token_seconds_avg:
      name: TTFT Average
      desc: Average Time-to-First-Token over the last 5 minutes.
    vllm:e2e_request_latency_seconds_p50:
      name: E2E Latency P50
      desc: End-to-end request latency P50 over the last 5 minutes.
    vllm:e2e_request_latency_seconds_p90:
      name: E2E Latency P90
      desc: End-to-end request latency P90 over the last 5 minutes.
    vllm:e2e_request_latency_seconds_p95:
      name: E2E Latency P95
      desc: End-to-end request latency P95 over the last 5 minutes.
    vllm:e2e_request_latency_seconds_avg:
      name: E2E Latency Average
      desc: Average end-to-end request latency over the last 5 minutes.
    vllm:inter_token_latency_seconds_p50:
      name: ITL P50
      desc: Inter-Token Latency P50 over the last 5 minutes.
    vllm:inter_token_latency_seconds_p90:
      name: ITL P90
      desc: Inter-Token Latency P90 over the last 5 minutes.
    vllm:inter_token_latency_seconds_p95:
      name: ITL P95
      desc: Inter-Token Latency P95 over the last 5 minutes.
    vllm:inter_token_latency_seconds_p99:
      name: ITL P99
      desc: Inter-Token Latency P99 over the last 5 minutes.
    vllm:inter_token_latency_seconds_avg:
      name: ITL Average
      desc: Average Inter-Token Latency over the last 5 minutes.
    vllm:request_queue_time_seconds_p50:
      name: Queue Time P50
      desc: Request queue time P50 over the last 5 minutes.
    vllm:request_queue_time_seconds_p90:
      name: Queue Time P90
      desc: Request queue time P90 over the last 5 minutes.
    vllm:request_queue_time_seconds_p95:
      name: Queue Time P95
      desc: Request queue time P95 over the last 5 minutes.
    vllm:request_queue_time_seconds_p99:
      name: Queue Time P99
      desc: Request queue time P99 over the last 5 minutes.
    vllm:request_queue_time_seconds_avg:
      name: Queue Time Average
      desc: Average request queue time over the last 5 minutes.
    vllm:request_prefill_time_seconds_p50:
      name: Prefill Time P50
      desc: Prefill time P50 over the last 5 minutes.
    vllm:request_prefill_time_seconds_p90:
      name: Prefill Time P90
      desc: Prefill time P90 over the last 5 minutes.
    vllm:request_prefill_time_seconds_p95:
