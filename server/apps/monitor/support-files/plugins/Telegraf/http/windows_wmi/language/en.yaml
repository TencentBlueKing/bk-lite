Windows WMI:
  desc: Remote Windows host metrics collection through WMI/DCOM from Stargazer.
  name: Windows Host Collection (WMI)
monitor_object:
  Host: Host
monitor_object_type:
  OS: Operating System
monitor_object_metric:
  Host:
    cpu_usage_total:
      name: CPU Usage
      desc: Reflects the overall CPU utilization of the host, representing the proportion of non-idle
        CPU time. Sustained high values usually indicate CPU resource pressure or bottlenecks.
    system_uptime:
      name: System Uptime
      desc: Represents how long the host has been running since the last boot, in seconds, useful for
        observing stability and detecting unexpected restarts.
    diskio_io_util:
      name: Disk I/O Usage
      desc: Indicates the proportion of time a disk device is busy handling I/O operations. Sustained
        high values usually suggest disk I/O saturation.
    disk_read_latency:
      name: Disk Read Latency
      desc: Average disk read latency in milliseconds from formatted AvgDiskSecPerRead.
    disk_write_latency:
      name: Disk Write Latency
      desc: Average disk write latency in milliseconds from formatted AvgDiskSecPerWrite.
    diskio_writes_rate:
      name: Disk Write IOPS
      desc: Represents the number of disk write operations completed per second, measuring write I/O intensity
        and concurrency.
    diskio_write_bytes_rate:
      name: Disk Write Rate
      desc: Indicates the amount of data written to disk per unit time, used to evaluate disk write throughput.
    diskio_reads_rate:
      name: Disk Read IOPS
      desc: Represents the number of disk read operations completed per second, measuring read I/O concurrency
        and intensity.
    diskio_read_bytes_rate:
      name: Disk Read Rate
      desc: Indicates the amount of data read from disk per unit time, used to evaluate disk read throughput.
    disk_total:
      name: Disk Total
      desc: Represents the total capacity of a disk or filesystem, used for capacity planning and resource
        management.
    disk_free:
      name: Disk Free
      desc: Represents the currently available free space of a disk or filesystem, used to monitor capacity
        risks.
    disk_used_percent:
      name: Disk Usage
      desc: Represents the percentage of disk space that has been consumed, a core metric for disk capacity
        monitoring.
    processes_running:
      name: Process Count
      desc: Total Windows process table size, not Linux run-queue size.
    mem_total:
      name: Total Memory
      desc: Represents the total amount of physical memory available on the system, serving as a baseline
        for memory evaluation.
    mem_available:
      name: Available Memory
      desc: Represents the amount of memory available for applications without causing significant performance
        degradation.
    mem_used_percent:
      name: Memory Usage
      desc: Represents the percentage of memory currently in use, indicating overall memory pressure.
    net_packets_recv_rate:
      name: Network Receive Packet Rate
      desc: Represents the number of packets received per unit time on a network interface, reflecting
        packet-level traffic.
    net_packets_sent_rate:
      name: Network Send Packet Rate
      desc: Represents the number of packets sent per unit time on a network interface.
    net_bytes_recv_rate:
      name: Network Receive Throughput Rate
      desc: Represents the amount of data received per unit time on a network interface, used to evaluate
        inbound bandwidth utilization.
    net_bytes_sent_rate:
      name: Network Send Throughput Rate
      desc: Represents the amount of data sent per unit time on a network interface, used to evaluate
        outbound bandwidth utilization.
    net_err_in_rate:
      name: Network Receive Error Rate
      desc: Represents the number of errored packets received per unit time, used to monitor network quality.
    net_err_out_rate:
      name: Network Send Error Rate
      desc: Represents the number of errored packets sent per unit time on a network interface.
    net_drop_in_rate:
      name: Network Receive Drop Rate
      desc: Represents the number of incoming packets dropped per unit time, indicating congestion or
        abnormal conditions.
    net_drop_out_rate:
      name: Network Send Drop Rate
      desc: Represents the number of outgoing packets dropped per unit time on a network interface.
monitor_object_metric_group:
  Host:
    CPU: CPU
    System: System
    Disk IO: Disk I/O
    Disk: Disk
    Process: Process
    Processes: Processes
    Memory: Memory
    Net: Net
    Network: Network
    Nvidia GPU: Nvidia GPU
