Cisco Meraki Wireless AP:
  name: Cisco Meraki 无线 AP
  desc: 通过 Meraki Dashboard API v1 采集无线 AP 以太网状态与丢包。
monitor_object:
  Meraki Wireless Inventory: Meraki 无线清单
  Meraki Wireless AP: Meraki 无线 AP
monitor_object_type:
  Cisco Meraki: Cisco Meraki
monitor_object_metric_group:
  Meraki Wireless Inventory:
    Base: 基础
    Inventory: 清单
  Meraki Wireless AP:
    Packet Loss: 丢包
    Ethernet: 以太网
monitor_object_metric:
  Meraki Wireless Inventory:
    meraki_wireless_connect_status:
      name: 连接状态
      desc: 无线 AP 采集所用 Dashboard API 是否可用。
    meraki_wireless_ap_count:
      name: 无线 AP 数量
      desc: 以太网状态与丢包数据中去重后的无线 AP 数量。
  Meraki Wireless AP:
    meraki_wireless_ap_upstream_loss_percent:
      name: 上行丢包率
      desc: 无线 AP 上行丢包百分比。
    meraki_wireless_ap_downstream_loss_percent:
      name: 下行丢包率
      desc: 无线 AP 下行丢包百分比。
    meraki_wireless_ap_ethernet_speed_mbps:
      name: 以太网速率
      desc: 无线 AP 以太网协商速率。
    meraki_wireless_ap_ethernet_link_up:
      name: 以太网链路
      desc: 以太网口是否链路 up。优先使用 status/linkStatus/connected；否则根据 linkNegotiation 的 speed>0 或 duplex 为 full/half。
