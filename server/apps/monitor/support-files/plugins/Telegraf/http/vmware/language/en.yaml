VMWare:
  desc: Through the Telegraf collector, utilize Stargazer's capability to regularly
    gather key metrics from VMware vCenter, ESXi, virtual machines, and datastores.
  name: VMWare
monitor_object:
  vCenter: vCenter
  ESXI: ESXi Host
  DataStorage: Datastore
  VM: Virtual Machine
monitor_object_type:
  VMWare: VMware
monitor_object_metric_group:
  vCenter:
    Quantity: Quantity
  ESXI:
    CPU: CPU
    Memory: Memory
    Disk: Disk
    Network: Network
    System: System
  DataStorage:
    DataStorage: Datastore
  VM:
    CPU: CPU
    Memory: Memory
    Disk: Disk
    Network: Network
    Power: Power
    Snapshot: Snapshot
monitor_object_metric:
  vCenter:
    vmware_esxi_count:
      name: ESXi Host Count
      desc: Number of ESXi hosts in the VMware environment.
    vmware_datastore_count:
      name: Datastore Count
      desc: Number of datastores in the VMware environment.
    vmware_vm_count:
      name: Virtual Machine Count
      desc: Number of virtual machines in the VMware environment.
  ESXI:
    cpu_usage_average_gauge:
      name: CPU Usage
      desc: CPU utilization of the ESXi host.
    mem_usage_average_gauge:
      name: Memory Usage
      desc: Memory utilization of the ESXi host.
    mem_consumed_average_gauge:
      name: Memory Consumed
      desc: Active memory consumed by the ESXi host.
    disk_read_average_gauge:
      name: Disk Read Throughput
      desc: Amount of data read from disk per second.
    disk_write_average_gauge:
      name: Disk Write Throughput
      desc: Amount of data written to disk per second.
    disk_numberRead_summation_gauge_rate:
      name: Disk Read Operations
      desc: Number of disk read operations completed per second.
    disk_numberWrite_summation_gauge_rate:
      name: Disk Write Operations
      desc: Number of disk write operations completed per second.
    net_bytesRx_average_gauge:
      name: Network Receive Throughput
      desc: Amount of network data received per second.
    net_bytesTx_average_gauge:
      name: Network Transmit Throughput
      desc: Amount of network data sent per second.
    boot_time_gauge:
      name: Boot time
      desc: ESXi host boot time as Unix seconds. Changes only after a reboot.
    uptime_seconds_gauge:
      name: Uptime
      desc: Seconds since the ESXi host booted. Not converted to days.
  DataStorage:
    disk_used_average_gauge:
      name: Disk Usage
      desc: Percentage of datastore disk space in use.
    disk_free_average_gauge:
      name: Free Disk Space
      desc: Unused datastore disk space.
    store_accessible_gauge:
      name: Datastore Accessibility
      desc: Whether the datastore is accessible.
    datastore_io_read_latency_gauge:
      name: Read latency
      desc: Aggregate datastore read latency in milliseconds.
    datastore_io_write_latency_gauge:
      name: Write latency
      desc: Aggregate datastore write latency in milliseconds.
  VM:
    cpu_usage_average_gauge:
      name: CPU Usage
      desc: CPU utilization of the virtual machine.
    mem_usage_average_gauge:
      name: Memory Usage
      desc: Memory utilization of the virtual machine.
    mem_consumed_average_gauge:
      name: Memory Consumed
      desc: Active memory consumed by the virtual machine.
    disk_io_usage_gauge:
      name: Disk I/O Usage
      desc: Disk I/O utilization of the virtual machine.
    disk_read_average_gauge:
      name: Disk Read Throughput
      desc: Average disk read throughput of the virtual machine.
    disk_used_average_gauge:
      name: Disk Usage
      desc: Percentage of disk space used by the virtual machine.
    disk_numberRead_summation_gauge_rate:
      name: Disk Read Operations
      desc: Number of disk read operations completed per second.
    disk_numberWrite_summation_gauge_rate:
      name: Disk Write Operations
      desc: Number of disk write operations completed per second.
    disk_write_average_gauge:
      name: Disk Write Throughput
      desc: Average disk write throughput of the virtual machine.
    net_bytesRx_average_gauge:
      name: Network Receive Throughput
      desc: Amount of network data received by the virtual machine per second.
    net_bytesTx_average_gauge:
      name: Network Transmit Throughput
      desc: Amount of network data sent by the virtual machine per second.
    power_state_gauge:
      name: Power State
      desc: Current power state of the virtual machine.
    tools_status_gauge:
      name: Tools status
      desc: VMware Tools status code. 0 toolsOk, 1 toolsOld, 2 toolsNotInstalled, 3 toolsNotRunning.
    snapshot_storage_bytes_gauge:
      name: Snapshot storage
      desc: Deduplicated bytes of snapshot delta, data, and memory files. Zero when there is no snapshot.
    oldest_snapshot_age_seconds_gauge:
      name: Oldest snapshot age
      desc: Seconds since the oldest snapshot was created. Zero when there is no valid createTime.
    snapshot_count_gauge:
      name: Snapshot count
      desc: Number of snapshots in the VM snapshot tree. Zero when there is no snapshot.
