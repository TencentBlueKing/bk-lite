Kafka-Exporter:
  name: Kafka（Exporter）
  desc: 通过Kafka Exporter采集器定期收集Kafka集群的主题统计、分区数量、消费者组状态等指标，帮助监控Kafka集群的健康和性能。
monitor_object:
  Kafka: Kafka
monitor_object_type:
  Middleware: 中间件
monitor_object_metric:
  Kafka:
    kafka_up_gauge:
      name: 监控探针状态
      desc: 监控探针的运行状态。0代表连接服务不正常，1代表连接服务正常。需要注意无数据的情况可能是连接不存在。
    kafka_brokers_gauge:
      name: Broker数量
      desc: Kafka集群中的 Broker 数量。
    kafka_broker_info_gauge:
      name: 节点信息
      desc: Kafka节点的信息，包含节点地址和节点ID。
    kafka_topic_partition_count:
      name: 主题分区数
      desc: 主题的分区数量。
    kafka_topic_partition_current_offset:
      name: 分区当前偏移量
      desc: 指定主题和分区的当前偏移量。
    kafka_topic_partition_oldest_offset:
      name: 分区最早偏移量
      desc: 指定主题和分区的最早偏移量。
    kafka_topic_partition_in_sync_replica:
      name: 分区同步副本数
      desc: 指定主题和分区的同步副本数量。
    kafka_topic_partition_leader:
      name: 分区Leader节点
      desc: 指定主题和分区的Leader Broker节点ID。
    kafka_topic_partition_leader_is_preferred:
      name: 分区首选领导者状态
      desc: 若主题/分区正在使用首选 Broker节点，则值为 1，否则为 0。
    kafka_topic_partition_replicas:
      name: 分区副本数
      desc: 指定主题和分区的副本数量。
    kafka_topic_partition_under_replicated_partition:
      name: 分区副本不足状态
      desc: 若主题/分区处于副本不足状态，则值为 1，否则为 0。
    kafka_consumergroup_current_offset:
      name: 消费者组当前偏移量
      desc: 指定消费者组在指定主题和分区的当前偏移量。
    kafka_consumergroup_current_offset_sum:
      name: 消费者组当前偏移量汇总
      desc: 指定消费者组在指定主题上的已提交偏移量汇总。
    kafka_consumergroup_lag:
      name: 消费者组滞后偏移量
      desc: 指定消费者组在指定主题和分区的当前近似滞后偏移量。
    kafka_consumergroup_lag_sum:
      name: 消费者组Lag汇总
      desc: 指定消费者组在指定主题上的分区Lag汇总。
    kafka_consumergroup_members:
      name: 消费者组成员数
      desc: 指定消费者组当前的成员数量。
    kafka_consumergroup_lag_anomaly:
      name: 消费者组Lag异常状态
      desc: 同一轮采集内已提交偏移量大于日志末端偏移量时值为1。
    kafka_exporter_scrape_duration_seconds:
      name: Kafka监控单轮采集耗时
      desc: Kafka监控完整单轮采集耗时。
    kafka_exporter_scrape_success:
      name: Kafka监控单轮采集成功状态
      desc: 最近一轮Kafka监控采集无请求错误且完成时为1，否则为0。
    kafka_exporter_scrape_stage_duration_seconds:
      name: Kafka监控各阶段采集耗时
      desc: Kafka监控各采集阶段的耗时。
    kafka_exporter_kafka_requests:
      name: Kafka监控单轮请求数量
      desc: 最近一轮采集向Kafka发出的请求数量。
    kafka_exporter_kafka_request_errors:
      name: Kafka监控单轮请求错误数量
      desc: 最近一轮采集中的Kafka请求错误数量。
    kafka_exporter_collected_series:
      name: Kafka监控单轮输出序列数量
      desc: 最近一轮采集输出的Kafka数据序列数量，不含探针自监控指标。
    kafka_exporter_lag_anomalies:
      name: Kafka消费组偏移量异常分区数量
      desc: 最近一轮采集中已提交偏移量大于同轮日志末端偏移量的分区数量。
    kafka_exporter_last_success_timestamp_seconds:
      name: Kafka监控最近成功采集时间
      desc: 最近一次完整成功Kafka监控采集的Unix时间戳。
    up_gauge:
      name: 监控探针状态
      desc: 监控探针的运行状态。0代表连接服务不正常，1代表连接服务正常。需要注意无数据的情况可能是连接不存在。
    brokers_gauge:
      name: Broker数量
      desc: Kafka集群中的 Broker 数量。
    broker_info_gauge:
      name: 节点信息
      desc: Kafka节点的信息，包含节点地址和节点ID。
    topic_partition_count:
      name: 主题分区数
      desc: 主题的分区数量。
    topic_partition_current_offset:
      name: 分区当前偏移量
      desc: 指定主题和分区的当前偏移量。
    topic_partition_oldest_offset:
      name: 分区最早偏移量
      desc: 指定主题和分区的最早偏移量。
    topic_partition_in_sync_replica:
      name: 分区同步副本数
      desc: 指定主题和分区的同步副本数量。
    topic_partition_leader_is_preferred:
      name: 分区首选领导者状态
      desc: 若主题/分区正在使用首选 Broker节点，则值为 1，否则为 0。
    topic_partition_replicas:
      name: 分区副本数
      desc: 指定主题和分区的副本数量。
    topic_partition_under_replicated_partition:
      name: 分区副本不足状态
      desc: 若主题/分区处于副本不足状态，则值为 1，否则为 0。
    consumergroup_current_offset:
      name: 消费者组当前偏移量
      desc: 指定消费者组在指定主题和分区的当前偏移量。
    consumergroup_lag:
      name: 消费者组滞后偏移量
      desc: 指定消费者组在指定主题和分区的当前近似滞后偏移量。
    process_cpu_seconds_total:
      name: 探针进程CPU总时间
      desc: 监控探针进程已使用的CPU时间总量。
    process_max_fds_gauge:
      name: 探针进程最大文件描述符数
      desc: 监控探针进程能够打开的最大文件描述符数。
    process_open_fds_gauge:
      name: 探针进程打开文件描述符数
      desc: 监控探针进程当前打开的文件描述符数。
    process_resident_memory_bytes_gauge:
      name: 探针进程常驻内存大小
      desc: 监控探针进程当前常驻内存的大小。
    process_virtual_memory_bytes_gauge:
      name: 探针进程虚拟内存大小
      desc: 监控探针进程当前虚拟内存的大小。
monitor_object_metric_group:
  Kafka:
    Base: 基础信息
    Topic: 主题
    ConsumerGroup: 消费者组
    Exporter: 采集器
    Process: 进程
