collect_type:
  Auditbeat:
    auditd:
      description: 采集 Linux 审计框架日志，用于全面的系统安全监控与合规审计。
      name: 审计日志采集
    file_integrity:
      name: 文件完整性监控
      description: 监控文件系统变化，检测未经授权的修改，确保数据完整性。
  Vector:
    syslog:
      name: 系统日志
      description: 采集 syslog 消息，用于集中式日志记录和监控。
    kubernetes:
      name: Kubernetes 集群
      description: 从 Kubernetes 集群采集日志和指标，用于监控和分析。
    exec:
      name: 命令执行
      description: 执行命令从各种来源采集日志数据，用于处理和分析。
    docker:
      description: 从 Docker 容器采集和处理日志，用于集中式日志记录和分析。
      name: Docker 日志
    file:
      description: 从文件采集日志数据，用于集中式日志记录和分析。
      name: 文件采集
    kafka_subscribe:
      name: Kafka 日志订阅
      description: 订阅平台外 Kafka Topic 中的日志并转发到日志系统，不是采集 Kafka 进程日志文件。
  Packetbeat:
    http:
      description: 监控 HTTP 流量，分析 Web 应用程序性能并检测异常。
      name: HTTP 流量
    dhcp:
      name: DHCP 协议
      description: 采集 DHCP 流量，监控 IP 地址分配和网络配置。
    dns:
      name: DNS 协议
      description: 捕获 DNS 查询和响应数据，用于网络故障排查和安全分析。
    flows:
      description: 分析网络流量数据，监控流量模式并检测潜在的安全威胁。
      name: 网络流量
    icmp:
      name: ICMP 协议
      description: 监控 ICMP 流量，用于网络诊断和性能分析。
  Snmptrapd:
    snmp_trap:
      name: SNMP Trap
      description: 采集 SNMP trap 消息，用于网络设备监控和告警。
  Filebeat:
    filestream:
      name: 文件流采集
      description: 从各种来源采集和转发日志数据，用于集中式日志记录和分析。
    apache:
      name: Apache 日志
      description: 使用 Filebeat 模块采集并解析 Apache HTTP 服务器访问日志和错误日志。
    elasticsearch:
      name: Elasticsearch 日志
      description: 使用 Filebeat 模块采集并解析 Elasticsearch 服务日志、审计日志、慢日志、弃用日志和 GC 日志。
    mysql:
      name: MySQL 日志
      description: 使用 Filebeat 模块采集并解析 MySQL 慢日志和错误日志。
    kafka:
      name: Kafka 日志
      description: 使用 Filebeat 模块采集并解析 Kafka 日志文件。
    nginx:
      name: Nginx 日志
      description: 使用 Filebeat 模块采集并解析 Nginx 访问日志和错误日志。
    mongodb:
      name: MongoDB 日志
      description: 使用 Filebeat 模块采集并解析 MongoDB 日志。
    rabbitmq:
      name: RabbitMQ 日志
      description: 使用 Filebeat 模块采集并解析 RabbitMQ 日志文件。
    redis:
      name: Redis 日志
      description: 使用 Filebeat 模块采集并解析 Redis 日志和慢日志。
    postgresql:
      name: PostgreSQL 日志
      description: 使用 Filebeat 模块采集并解析 PostgreSQL 日志。
  Winlogbeat:
    winlogbeat:
      name: Windows 事件日志
      description: 采集 Windows 事件日志，包括安全、系统、应用程序、Sysmon、PowerShell、Defender 和计划任务等日志。

display_category:
  general:
    name: 通用
    description: 通用文件流、系统日志等基础采集
  k8s:
    name: K8s
    description: Kubernetes 集群日志采集
  database:
    name: 数据库
    description: 关系型数据库、NoSQL、缓存等数据存储系统日志
  middleware:
    name: 中间件
    description: Web服务器、消息队列、应用服务器日志
  network:
    name: 网络
    description: 网络协议流量分析、连接监控
  container:
    name: 容器
    description: 容器运行时日志采集
  security:
    name: 安全与审计
    description: 系统审计、文件完整性、安全事件监控
error:
  extractor_name_required: 名称不能为空
  extractor_instance_locked: 编辑时不能更换采集实例
  extractor_type_locked: 编辑时不能更换采集类型
  must_be_list: 必须是一个列表
  list_items_must_be_int: 列表中的元素必须是整数
  log_group_rule_object: 日志分组规则必须是对象（object）格式
  organization_required: 至少需要一个组织
  search_condition_object: 搜索条件配置必须是字典格式
  search_condition_query_required: 搜索条件配置中必须包含query字段
  search_condition_groups_required: 搜索条件配置中必须包含log_groups字段
  log_groups_must_be_list: log_groups必须是列表格式
  log_groups_missing: "以下日志分组不存在: {names}"
  handler_invalid: 处理人标识无效
  handler_required: 至少指定一名处理人
  policy_name_exists: 当前范围下策略名称已存在
  topn_unsupported: 该字段不支持 TopN 统计
  type_extractor_unsupported: 仅 syslog 与 snmp_trap 支持类型级提取器
  collect_type_missing: 采集类型不存在
  instance_rule_limit: "单个采集实例最多 {count} 条规则"
  instance_name_duplicate: 实例内名称或顺序重复
  type_rule_limit: "单个采集类型最多 {count} 条规则"
  type_name_duplicate: 类型内名称或顺序重复
  scope_name_duplicate: 作用域内名称重复
  rule_ids_unique: 必须提交无重复的完整规则 ID 列表
  instance_rule_ids_exact: 必须提交当前实例全部且仅全部规则 ID
  type_rule_ids_exact: 必须提交当前采集类型全部且仅全部规则 ID
  event_object_required: 必须是日志事件对象
  rule_out_of_scope: 规则不属于当前作用域
  collect_instance_required: 采集实例必填
  scope_exclusive: 必须且只能提供采集实例或采集类型之一
  generation_published: 当前 generation 已发布
  channel_query_failed: 通知通道查询失败
