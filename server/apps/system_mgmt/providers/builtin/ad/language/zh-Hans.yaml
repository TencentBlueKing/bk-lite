name: Active Directory
description: Active Directory 接入，用于登录认证和用户同步。

templates:
  base_connection:
    title: 基础连接
    groups:
      connection:
        title: 连接配置
        fields:
          connection_url:
            label: 服务器 IP
            help_text: 仅填写服务器 IP 地址，协议和默认端口由系统按 SSL 配置自动补全。
          ssl_encryption:
            label: SSL加密方式
            options:
              "none": 不加密
              ssl: SSL
          timeout:
            label: 超时时间
          bind_dn:
            label: 连接账号
            help_text: 建议填写 UPN（如 administrator@corp.example.com）或完整 DN（如 CN=svc_ad,OU=Service,DC=corp,DC=example,DC=com），避免依赖裸用户名的域解析。
          bind_password:
            label: 连接密码
  login_auth_form:
    title: 登录认证配置
    groups:
      mapping:
        title: 字段映射
        fields:
          display_name:
            label: 显示名称
          icon:
            label: 图标
          description:
            label: 描述
          external_field:
            label: 外部字段
          platform_field:
            label: 平台字段
          unmatched_user_action:
            label: 未匹配用户处理方式
          default_group_name:
            label: 默认用户组名称
  user_sync_form:
    title: 用户同步配置
    groups:
      scope:
        title: 同步范围
        fields:
          root_dns:
            label: 同步拉取 DN
            placeholder: "OU=BizA,DC=example,DC=com\nOU=BizC,DC=example,DC=com"
            help_text: 每行一个完整 DN。只填一个时，该目录下的子组织直接挂在同步源根组织下；填多个时，每个 OU 都会作为根组织下的独立组织显示。
          user_object_class:
            label: 用户对象类
            help_text: 指定 AD/LDAP 中用户账号的类别，常用user类型，若无需要，保持默认即可。
          user_filter:
            label: 用户对象过滤
            help_text: 在用户账号基础上，再加一层筛选，决定具体拉哪些人，若无需要，保持默认即可。
          organization_object_class:
            label: 组织架构类
            help_text: 指定 AD/LDAP 中用来表示组织架构/部门的对象类，AD系统中默认值为organizationalUnit，若无需要，保持默认即可。

capabilities:
  login_auth:
    fields:
      base_dn:
        label: 登录搜索 Base DN
        help_text: 登录认证时 LDAP 搜索的根目录，决定可在哪个 OU/子树范围内查找登录用户。与「同步拉取 DN (root_dns)」是不同字段：root_dns 限制同步范围，base_dn 限制登录搜索范围。
      login_auth_identity_field:
        label: 登录账号类型
        options:
          sAMAccountName: 用户名（sAMAccountName）
          userPrincipalName: 邮箱账号（userPrincipalName）
