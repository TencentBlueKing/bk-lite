name: 企业微信
description: 企业微信接入，支持登录认证、用户同步、通知渠道和群协作。

templates:
  base_connection:
    title: 基础连接
    groups:
      credentials:
        title: 应用凭证
        fields:
          corp_id:
            label: 企业 ID
            help_text: 企业微信管理后台 → 我的企业 → 企业信息 → 企业 ID
          corp_secret:
            label: 应用 Secret
            placeholder: 如无需变更可留空
          agent_id:
            label: 应用 AgentId
            help_text: 企业微信管理后台 → 应用管理 → 自建应用 → AgentId
      endpoints:
        title: 公共接口
        fields:
          access_token_url:
            label: 访问令牌地址
          proxy_url:
            label: 网络代理地址
            help_text: 可选。BK-Lite 后端访问该企业微信实例的 HTTP(S) 网络代理；留空表示直接连接。仅支持 HTTP/HTTPS，不支持 SOCKS。
  login_auth_form:
    title: 登录认证配置
    groups:
      mapping:
        title: 字段映射
        fields:
          display_name:
            label: 显示名称
          icon:
            label: 图标
          description:
            label: 描述
          external_field:
            label: 外部字段
          platform_field:
            label: 平台字段
  user_sync_form:
    title: 用户同步配置
    groups:
      pull:
        title: 拉取配置
        fields:
          root_department_id:
            label: 根部门 ID
          include_child_departments:
            label: 递归包含子部门
            help_text: 默认递归同步根部门及全部子部门成员；关闭后只同步该部门直属成员。
  im_notification_form:
    title: IM 通知配置
    groups:
      send:
        title: 发送配置
        fields:
          mapping_strategy:
            label: 映射策略

capabilities:
  login_auth:
    fields:
      login_auth_authorize_url:
        label: 扫码授权地址
      login_auth_user_info_url:
        label: 用户身份地址
  user_sync:
    fields:
      user_sync_departments_url:
        label: 部门地址
      user_sync_users_url:
        label: 成员地址
  im_notification:
    fields:
      im_notification_users_url:
        label: 成员地址
      im_notification_send_message_url:
        label: 应用消息地址
