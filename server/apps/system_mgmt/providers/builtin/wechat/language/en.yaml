name: WeChat
description: WeChat integration for login authentication.

templates:
  base_connection:
    title: Base Connection
    groups:
      credentials:
        title: App credentials
        fields:
          app_id:
            label: App ID
          app_secret:
            label: App Secret
  login_auth_form:
    title: Login authentication
    groups:
      mapping:
        title: Field mapping
        fields:
          display_name:
            label: Display name
          icon:
            label: Icon
          description:
            label: Description
          external_field:
            label: External field
          platform_field:
            label: Platform field
          unmatched_user_action:
            label: Unmatched user action
          default_group_name:
            label: Default user group name

capabilities:
  login_auth:
    fields:
      login_auth_authorize_url:
        label: Authorization URL
      login_auth_access_token_url:
        label: Access token URL
      login_auth_user_info_url:
        label: User info URL
