      error_count:
        title: 异常任务数
        description: 最近状态为异常的任务数
      running_count:
        title: 运行中任务数
        description: 当前状态为运行中的任务数
      timeout_count:
        title: 超时任务数
        description: 当前状态为超时的任务数
      never_run_count:
        title: 从未执行任务数
        description: 当前状态为未执行的任务数
