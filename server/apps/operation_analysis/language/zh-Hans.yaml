      mon-stat-c02:
        name: 内置插件数
        description: 系统预置的标准插件
      mon-stat-c03:
        name: 自定义插件数
        description: 用户自定义的扩展插件
      mon-stat-c04:
        name: 指标定义总数
        description: 系统已定义的指标条目
      mon-stat-c05:
        name: 指标分组总数
        description: 指标分组的数量
      mon-stat-c06:
        name: 采集配置总数
