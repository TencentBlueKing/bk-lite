        title: 模型ID
        description: 模型唯一标识（排行维度为模型时使用）
      classification:
        title: 分类名称
        description: 分类显示名称；按模型排时为所属分类，按分类排时为排行项
      classification_id:
        title: 分类ID
        description: 分类标识
      count:
        title: 实例数
        description: 该排行项下的实例数量
    params:
      limit: 返回条数
      classification_id: 模型分类 ID
      group_by: 排行维度
      organization: 组织
