      063b6d01-ec91-4218-b6ad-9f34c82ea94b:
        name: 通知成功数
        description: 发送成功的通知数
      fb51e119-3763-4a99-844f-274fa6c50577:
        name: 通知成功率
        description: 发送成功通知占全部通知的比例
      356ec2d9-0bf2-4d03-aa0b-dda3d9d7cf87:
        name: 关联事件缺少指标项占比
