        description: 系统累计产生的告警
      mon-stat-a03:
        name: 今日新增告警数
        description: 今日 0 点起新产生的告警
      mon-stat-a04:
        name: 告警策略总数
        description: 已配置的告警策略总数
      mon-stat-a05:
        name: 启用策略数
        description: 处于启用状态的策略
      mon-stat-a06:
        name: 禁用策略数
