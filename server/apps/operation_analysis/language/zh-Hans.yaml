datasources:
  "CMDB 3D机房布局::cmdb/get_room3d_layout":
    name: CMDB 3D机房布局
    desc: 查询指定 CMDB 机房的 3D 机柜布局数据
    params:
      server_room_id: 机房ID
  "CMDB 变更趋势::cmdb/get_change_trend":
    name: CMDB 变更趋势
    desc: 跟随时间范围，统计实例新增、修改和删除趋势，可按模型筛选
    params:
      time: 时间范围
      model_id: 模型 ID
  "CMDB模型实例TOPN::cmdb/get_cmdb_model_instance_top":
    name: CMDB 实例排行（按模型/分类）
    desc: 按实例数降序排行；默认按模型，也可按分类汇总。老 CMDB 盘默认按模型，勿改默认值。
    fields:
      model:
        title: 模型名称
        description: 模型显示名称（排行维度为模型时使用）
