      8c4c5cb4-dfd9-4b01-9baa-33a9f758a4b6:
        name: 关联事件缺少外部事件 ID 占比
        description: 分母为时间范围内告警关联事件
      739e9aab-809e-42c6-901a-ca6d664db676:
        name: 活跃告警持续时长 TOP 10
        description: 当前持续时间最长的活跃告警
        columns:
          alert_id: 告警 ID
          title: title
          level: level
          status: status
          duration_seconds: duration_seconds
          created_at: created_at
          resource_name: resource_name
        params:
          limit: 返回条数
  "dashboard::监控中心仪表盘_内置":
    name: 监控中心仪表盘
    desc: 监控中心资源/能力/告警总览
    widgets:
      mon-stat-r01:
        name: 监控对象总数
        description: 系统已定义的全部监控对象
      mon-stat-r02:
        name: 可见监控对象数
        description: 当前用户可见的监控对象
      mon-stat-r03:
        name: 监控对象分类数
        description: 对象按类型划分的分类数
      mon-stat-r04:
        name: 监控实例总数
        description: 接入监控的实例总数
      mon-stat-r05:
        name: 活跃实例数
        description: 当前启用中的监控实例
      mon-stat-r06:
        name: 停用实例数
        description: 当前已停用的监控实例
      mon-stat-c01:
        name: 监控插件总数
