      mon-stat-a11:
        name: 监控事件总数
        description: 累计产生的监控事件
      mon-stat-a12:
        name: 今日新增事件数
        description: 今日 0 点起新增的事件
      mon-stat-a13:
        name: 告警快照总数
        description: 告警全周期快照记录
      mon-stat-a14:
        name: 无数据基准总数
        description: 无数据检测的实例基准
  "dashboard::Flow网络流量分析仪表盘":
    name: Flow 网络流量分析仪表盘
    desc: 按所选网络设备查看 Flow 总流量、趋势、协议分布、TopN、会话与通信关系。
    filters:
      instance_ids:
        name: 设备
      time:
        name: 时间范围
    widgets:
      group-overview:
        name: 流量概览
        description: 所选设备在时间窗内的总流量、包速、平均包大小与有效采样率
      flow-kpi-bytes:
        name: 总流量
        description: 所选设备归一化后的 Flow 字节速率
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      flow-kpi-packets:
        name: 总包速
        description: 所选设备归一化后的 Flow 包速率
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      flow-kpi-avg-size:
        name: 平均包大小
        description: 由归一化字节与包数计算的平均包大小
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      flow-kpi-sampling:
        name: 有效采样率
        description: Flow 流量归一化使用的有效采样率
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      group-trend:
        name: 流量趋势
        description: Bytes/s、Packets/s 与协议流量趋势
      flow-trend-bytes:
        name: 总流量趋势
        description: 所选设备合计的 Flow 字节速率
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      flow-trend-packets:
        name: 总包速趋势
        description: 所选设备合计的 Flow 包速率
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      flow-trend-protocol:
        name: 协议流量趋势
        description: 按协议折叠后的 Flow 字节速率
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      group-rank:
        name: 协议与排行
        description: 协议占比与 Source / Destination / IP+端口 / Protocol TopN
      flow-pie-protocol:
        name: 协议分布
        description: 时间窗内按协议折叠的流量占比
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      flow-topn:
        name: 流量 TopN
        description: 切换源地址、目的地址、源 IP+端口、目标 IP+端口或协议查看占用
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      group-conversation:
        name: 会话
        description: Top Conversation 的源、目的、端口、协议和流量
      flow-table-conversation:
        name: Top 会话
        description: 时间窗内占用最高的通信对
        columns:
          name: 会话
          src: 源地址
          dst: 目的地址
          dst_port: 目的端口
          protocol: 协议
          value: 流量
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
      group-node-graph:
        name: 通信关系
        description: 按会话流量画主机互访与访问服务
      flow-node-graph-ip:
        name: 主机通信
        description: 源 IP 与目的 IP 之间的有向流量
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
          limit: 返回条数
      flow-node-graph-service:
        name: 访问服务
        description: 源 IP 访问目的 IP:端口 的有向流量
        params:
          instance_ids: 设备
          metric: 指标
          mode: 查询模式
          time: 时间范围
          limit: 返回条数
  "dashboard::WeOpsX平台使用_内置":
    name: WeOpsX 平台使用
    desc: 按所选组织查看各模块此刻库存与模块内成效（比率 / TopN）。库存不随时间窗变化。
    filters:
      organization:
        name: 组织
      time:
        name: 时间范围
    widgets:
      group-overview:
        name: 平台总览
        description: 各模块此刻库存
      weopsx-kpi-cmdb-instances:
        name: CMDB 实例
        description: 当前组织可见的 CMDB 实例总数
        params:
          organization: 组织
      weopsx-kpi-monitor-instances:
        name: 监控实例
        description: 当前组织未删除的监控实例总数
        params:
          organization: 组织
      weopsx-kpi-monitor-metrics:
        name: 监控指标
        description: 指标定义条目总数
        params:
          organization: 组织
      weopsx-kpi-log-instances:
        name: 日志采集实例
        description: 当前组织可见的日志采集实例数
        params:
          organization: 组织
      weopsx-kpi-open-alerts:
        name: 未关闭告警
        description: 当前未分派、待响应和处理中的告警总数，不受时间窗影响
        params:
          organization: 组织
      weopsx-kpi-nodes:
        name: 节点
        description: 当前组织可见的节点总数
        params:
          organization: 组织
      group-cmdb:
        name: CMDB
        description: 分类/模型/实例规模、采集覆盖与分类排行
      weopsx-cmdb-classifications:
        name: 分类数
        description: 当前可见的 CMDB 模型分类数
        params:
          organization: 组织
      weopsx-cmdb-models:
        name: 模型数
        description: 当前组织可见的 CMDB 模型数
        params:
          organization: 组织
      weopsx-cmdb-instances:
        name: 实例数
        description: 当前组织可见的 CMDB 实例总数
        params:
          organization: 组织
      weopsx-cmdb-coverage:
        name: 采集覆盖率
        description: 有权可见且已挂采集任务的实例数在实例总数中的占比
        params:
          organization: 组织
      weopsx-cmdb-class-top:
        name: 分类实例 TOP
        description: 按分类汇总实例数降序
        params:
          organization: 组织
          limit: 返回条数
          group_by: 排行维度
      group-monitor:
        name: 监控
        description: 对象、实例、指标、策略库存，以及时间窗内实例告警排行
      weopsx-mon-objects:
        name: 监控对象
        description: 监控对象定义总数（平台目录）
        params:
          organization: 组织
      weopsx-mon-instances:
        name: 监控实例
        description: 当前组织未删除的监控实例总数
        params:
          organization: 组织
      weopsx-mon-metrics:
        name: 指标定义
        description: 指标定义条目总数
        params:
          organization: 组织
      weopsx-mon-policies:
        name: 告警策略
        description: 当前组织可见的告警策略总数
        params:
          organization: 组织
      weopsx-mon-most-alerts:
        name: 告警最多实例
        description: 时间窗内产生告警最多的监控实例
        params:
          organization: 组织
          time: 时间范围
          ranking: 排行模式
          limit: 返回条数
      weopsx-mon-least-alerts:
        name: 已配策略告警最少
        description: 已配策略覆盖且时间窗内告警最少（含 0）的监控实例
        params:
          organization: 组织
          time: 时间范围
          ranking: 排行模式
          limit: 返回条数
      group-log:
        name: 日志
        description: 采集实例、提取规则、告警规则与绑定率，以及策略告警排行
      weopsx-log-instances:
        name: 采集实例
        description: 当前组织可见的日志采集实例数
        params:
          organization: 组织
      weopsx-log-extractors:
        name: 提取规则
        description: 关联当前组织采集实例或采集类型的提取规则数
        params:
          organization: 组织
      weopsx-log-policies:
        name: 告警规则
        description: 当前组织可见的日志告警策略数
        params:
          organization: 组织
      weopsx-log-bound:
        name: 已绑定资产占比
        description: 已关联资产的采集实例占采集实例总数的比例
        params:
          organization: 组织
      weopsx-log-policy-top:
        name: 告警规则 TOP
        description: 时间窗内产生告警最多的日志告警策略
        params:
          organization: 组织
          time: 时间范围
          limit: 返回条数
      group-alert:
        name: 告警
        description: 未关闭告警、接入源、闭环率与排行
      weopsx-alert-active:
        name: 未关闭告警
        description: 当前未关闭（未分派+待响应+处理中）告警数，不受时间窗影响
        params:
          organization: 组织
      weopsx-alert-sources:
        name: 接入源
        description: 已配置的告警源总数，不受时间窗影响
        params:
          organization: 组织
      weopsx-alert-loop:
        name: 闭环率
