        description: All monitor objects defined in the system
      mon-stat-r02:
        name: Visible Monitor Objects
        description: Monitor objects visible to the current user
      mon-stat-r03:
        name: Object Categories
        description: Object categories by type
      mon-stat-r04:
        name: Monitor Instances
        description: Total instances under monitoring
      mon-stat-r05:
        name: Active Instances
        description: Currently enabled monitor instances
      mon-stat-r06:
        name: Inactive Instances
        description: Currently disabled monitor instances
      mon-stat-c01:
        name: Monitor Plugins
        description: Total registered monitor plugins
      mon-stat-c02:
        name: Built-in Plugins
        description: System-provided standard plugins
      mon-stat-c03:
        name: Custom Plugins
        description: User-defined extension plugins
      mon-stat-c04:
        name: Metric Definitions
        description: Metric entries defined in the system
      mon-stat-c05:
        name: Metric Groups
        description: Number of metric groups
      mon-stat-c06:
        name: Collect Configs
        description: Total configured collection tasks
      mon-stat-a01:
        name: Open Alerts
        description: Unhandled active alerts
      mon-stat-a02:
        name: Historical Alerts
        description: Cumulative alerts produced
      mon-stat-a03:
        name: Alerts Created Today
        description: Alerts created since 00:00 today
      mon-stat-a04:
        name: Alert Policies
        description: Total configured alert policies
      mon-stat-a05:
        name: Enabled Policies
        description: Enabled policies
      mon-stat-a06:
        name: Disabled Policies
        description: Disabled policies
      mon-stat-a07:
        name: Threshold Policies
        description: Policies with threshold conditions
      mon-stat-a08:
        name: No-data Policies
        description: Policies with no-data detection
      mon-stat-a09:
        name: Recovered Alerts
        description: Auto-recovered alerts
      mon-stat-a10:
