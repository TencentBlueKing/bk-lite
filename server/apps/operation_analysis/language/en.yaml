  "dashboard::Flow网络流量分析仪表盘":
    name: Flow Network Traffic Analysis Dashboard
    desc: Flow traffic, trends, protocol distribution, TopN, conversations, and communication graphs for selected network devices.
    filters:
      instance_ids:
        name: Devices
      time:
        name: Time Range
    widgets:
      group-overview:
        name: Traffic Overview
        description: Total traffic, packet rate, average packet size, and effective sampling rate for selected devices in the time window
      flow-kpi-bytes:
        name: Total Traffic
        description: Normalized Flow byte rate of selected devices
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      flow-kpi-packets:
        name: Packet Rate
        description: Normalized Flow packet rate of selected devices
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      flow-kpi-avg-size:
        name: Avg Packet Size
        description: Average packet size from normalized bytes and packets
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      flow-kpi-sampling:
        name: Effective Sampling Rate
        description: Effective sampling rate used to normalize Flow traffic
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      group-trend:
        name: Traffic Trend
        description: Bytes/s, Packets/s, and protocol traffic trends
      flow-trend-bytes:
        name: Traffic Trend
        description: Aggregated Flow byte rate of selected devices
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      flow-trend-packets:
        name: Packet Rate Trend
        description: Aggregated Flow packet rate of selected devices
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      flow-trend-protocol:
        name: Protocol Traffic Trend
        description: Flow byte rate rolled up by protocol
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      group-rank:
        name: Protocols & TopN
        description: Protocol share and Source / Destination / IP+port / Protocol TopN
      flow-pie-protocol:
        name: Protocol Distribution
        description: Traffic share rolled up by protocol in the time window
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      flow-topn:
        name: Traffic TopN
        description: Switch among source, destination, source IP+port, destination IP+port, or protocol to view usage
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      group-conversation:
        name: Conversation
        description: Source, destination, port, protocol, and traffic of top conversations
      flow-table-conversation:
        name: Top Conversations
        description: Highest-traffic conversations in the time window
        columns:
          name: Conversation
          src: Source Address
          dst: Destination Address
          dst_port: Destination Port
          protocol: Protocol
          value: Traffic
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
      group-node-graph:
        name: Communication Graph
        description: Host-to-host and service access from conversation traffic
      flow-node-graph-ip:
        name: Host Communication
        description: Directed traffic between source IP and destination IP
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
          limit: Limit
      flow-node-graph-service:
        name: Service Access
        description: Directed traffic from source IP to destination IP:port
        params:
          instance_ids: Devices
          metric: Metric
          mode: Query Mode
          time: Time Range
          limit: Limit
  "dashboard::WeOpsX平台使用_内置":
    name: WeOpsX Platform Usage
    desc: Current module inventory and in-module outcomes (ratios / TopN) for the selected organization. Inventory does not follow the time window.
    filters:
      organization:
        name: Organization
      time:
        name: Time Range
    widgets:
      group-overview:
        name: Platform Overview
        description: Current inventory by module
      weopsx-kpi-cmdb-instances:
        name: CMDB Instances
        description: Visible CMDB instances in the current organization
        params:
          organization: Organization
      weopsx-kpi-monitor-instances:
        name: Monitor Instances
        description: Non-deleted monitor instances in the current organization
        params:
          organization: Organization
      weopsx-kpi-monitor-metrics:
        name: Monitor Metrics
        description: Total metric definition entries
        params:
          organization: Organization
      weopsx-kpi-log-instances:
        name: Log Collect Instances
        description: Visible log collect instances in the current organization
        params:
          organization: Organization
      weopsx-kpi-open-alerts:
        name: Open Alerts
        description: Currently unassigned, pending, and processing alerts; not affected by the time window
        params:
          organization: Organization
      weopsx-kpi-nodes:
        name: Nodes
        description: Visible nodes in the current organization
        params:
          organization: Organization
      group-cmdb:
        name: CMDB
        description: Classification/model/instance scale, collection coverage, and classification ranking
      weopsx-cmdb-classifications:
        name: Classifications
        description: Currently visible CMDB classifications
        params:
          organization: Organization
      weopsx-cmdb-models:
        name: Models
        description: Visible CMDB models in the current organization
        params:
          organization: Organization
      weopsx-cmdb-instances:
        name: Instances
        description: Visible CMDB instances in the current organization
        params:
          organization: Organization
      weopsx-cmdb-coverage:
        name: Collection Coverage
        description: Visible instances with collection tasks as a share of all instances
        params:
          organization: Organization
      weopsx-cmdb-class-top:
        name: Classification Instance TopN
        description: Instance count by classification, descending
        params:
          organization: Organization
          limit: Limit
          group_by: Rank By
      group-monitor:
        name: Monitor
        description: Object, instance, metric, and policy inventory, plus instance alert ranking in the time window
      weopsx-mon-objects:
        name: Monitor Objects
        description: Monitor object definitions (platform catalog)
        params:
          organization: Organization
      weopsx-mon-instances:
        name: Monitor Instances
        description: Non-deleted monitor instances in the current organization
        params:
          organization: Organization
      weopsx-mon-metrics:
        name: Metric Definitions
        description: Total metric definition entries
        params:
          organization: Organization
      weopsx-mon-policies:
        name: Alert Policies
        description: Visible alert policies in the current organization
        params:
          organization: Organization
      weopsx-mon-most-alerts:
        name: Instances with Most Alerts
        description: Monitor instances with the most alerts in the time window
        params:
          organization: Organization
          time: Time Range
          ranking: Ranking Mode
          limit: Limit
      weopsx-mon-least-alerts:
        name: Fewest Alerts (Policy-covered)
        description: Policy-covered monitor instances with the fewest alerts in the time window (including 0)
        params:
          organization: Organization
          time: Time Range
          ranking: Ranking Mode
          limit: Limit
      group-log:
        name: Logs
        description: Collect instances, extractors, alert rules, bind rate, and policy alert ranking
      weopsx-log-instances:
        name: Collect Instances
        description: Visible log collect instances in the current organization
        params:
          organization: Organization
      weopsx-log-extractors:
        name: Extractors
        description: Extractors linked to current-organization collect instances or collect types
        params:
          organization: Organization
      weopsx-log-policies:
        name: Alert Rules
        description: Visible log alert policies in the current organization
        params:
          organization: Organization
      weopsx-log-bound:
        name: Asset-bound Ratio
        description: Collect instances linked to assets as a share of all collect instances
        params:
          organization: Organization
      weopsx-log-policy-top:
        name: Alert Rule TopN
        description: Log alert policies with the most alerts in the time window
        params:
          organization: Organization
          time: Time Range
          limit: Limit
      group-alert:
        name: Alerts
        description: Open alerts, ingest sources, closed-loop rate, and rankings
      weopsx-alert-active:
        name: Open Alerts
        description: Currently open alerts (unassigned + pending + processing); not affected by the time window
        params:
          organization: Organization
      weopsx-alert-sources:
        name: Ingest Sources
        description: Configured alert sources; not affected by the time window
        params:
          organization: Organization
      weopsx-alert-loop:
        name: Closed-loop Rate
        description: Closed alerts divided by new alerts in the time window; can exceed 100% when closes outnumber news
        params:
          time: Time Range
          organization: Organization
      weopsx-alert-source-top:
        name: Ingest Source Event TopN
        description: Alert ingest sources with the most events in the time window
        params:
          organization: Organization
          time: Time Range
          limit: Limit
      weopsx-alert-rule-top:
        name: Correlation Hit TopN
        description: Correlation/aggregation rule hits in the time window (by produced alerts)
        params:
          organization: Organization
          time: Time Range
          limit: Limit
      group-node:
        name: Nodes
        description: Nodes, collectors, cloud regions, and online rate
      weopsx-node-total:
        name: Nodes
        description: Nodes in the current organization
        params:
          organization: Organization
      weopsx-node-collectors:
        name: Collectors
        description: Collector catalog entries
        params:
          organization: Organization
      weopsx-node-clouds:
        name: Cloud Regions
        description: Cloud regions used by current-organization nodes
        params:
          organization: Organization
      weopsx-node-online:
        name: Online Ratio
        description: Online nodes as a share of all nodes
        params:
          organization: Organization
      weopsx-node-cloud-top:
        name: Cloud Region Node TopN
        description: Ranked by node count per cloud region, descending
        params:
          organization: Organization
          limit: Limit
      group-job:
        name: Jobs
        description: Job and template inventory, plus execution success rate in the time window
      weopsx-job-jobs:
        name: Jobs
        description: Jobs in the current organization
        params:
          organization: Organization
          time: Time Range
      weopsx-job-templates:
        name: Templates
        description: Job templates in the current organization
        params:
          organization: Organization
          time: Time Range
      weopsx-job-success:
        name: Execution Success Rate
        description: Successful executions as a share of all executions in the time window
        params:
          organization: Organization
          time: Time Range
      group-system:
        name: System Management
        description: Organization, user, and notification Channel scale
      weopsx-sys-orgs:
        name: Organizations
        description: Selected organization and descendants, excluding archived
        params:
          organization: Organization
      weopsx-sys-users:
        name: Users
        description: Users belonging to the current organization
        params:
          organization: Organization
      weopsx-sys-channels:
        name: Channels
        description: Configured notification Channels (standard + IM)
        params:
          organization: Organization
      weopsx-sys-enabled:
        name: Channel Enablement Rate
        description: Enabled Channels as a share of configured Channels. Standard notification Channels have no toggle and count as enabled once configured; IM channels use enabled.
        params:
          organization: Organization
