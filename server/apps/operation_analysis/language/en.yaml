  "screen::3D机房大屏_内置":
    name: 3D Data Center Screen
    desc: 3D data center screen from CMDB rooms, cabinets, and devices; switch rooms inside the widget
    decorations:
      title: Cabinet Overview
    widgets:
      builtin-room3d-main:
        title: 3D Data Center
  "screen::3D应用大屏_内置":
    name: 3D Application Screen
    desc: 3D application wall showing health, active alerts, and details of visible applications
    decorations:
      title: Application Wall
    widgets:
      builtin-application3d-main:
        title: 3D Applications
  "screen::网络状态拓扑大屏_内置":
    name: Network Status Topology Screen
    desc: Built-in screen example showing CMDB relations for selected network devices, overlaid with Monitor Center active alerts.
    decorations:
      title: Network Status Topology Screen
    widgets:
      network-topology-builtin-main:
        title: Network Status Topology Overview
datasources:
  "CMDB 3D机房布局::cmdb/get_room3d_layout":
    name: CMDB 3D Data Center Layout
    desc: Query 3D cabinet layout for a CMDB server room
    params:
      server_room_id: Server Room ID
  "CMDB 变更趋势::cmdb/get_change_trend":
    name: CMDB Change Trend
    desc: Instance create, update, and delete trend in the time range; filterable by model
    params:
      time: Time Range
      model_id: Model ID
  "CMDB模型实例TOPN::cmdb/get_cmdb_model_instance_top":
    name: CMDB Instance Ranking (Model/Classification)
    desc: Rank by instance count descending; default by model, optional classification rollup. Keep the default model grouping for the legacy CMDB dashboard.
    fields:
      model:
        title: Model Name
        description: Model display name (used when ranking by model)
      model_id:
        title: Model ID
        description: Model ID (used when ranking by model)
      classification:
        title: Classification
        description: Classification display name; parent when ranking by model, rank item when ranking by classification
      classification_id:
        title: Classification ID
        description: Classification ID
      count:
        title: Instances
        description: Instance count for this rank item
    params:
      limit: Limit
      classification_id: Classification ID
      group_by: Rank By
      organization: Organization
  "CMDB采集健康统计::cmdb/get_cmdb_collect_statistics":
    name: CMDB Collection Task Status
    desc: Collection task total, scheduled tasks, and latest run status
    fields:
      task_count:
        title: Total Tasks
        description: Currently visible collection tasks
      interval_task_count:
        title: Scheduled Tasks
        description: Collection tasks with scheduled polling
      success_count:
        title: Successful Tasks
        description: Tasks whose latest status is success
      error_count:
        title: Error Tasks
        description: Tasks whose latest status is error
      running_count:
        title: Running Tasks
        description: Tasks currently running
      timeout_count:
