    value: 10080
    alias_name: 时间范围
    filterType: filter
  - name: model_id
    type: string
    value: ''
    alias_name: 模型 ID
    filterType: params
  tags:
  - CMDB
  chart_type:
  - line
  - bar
  field_schema: []
  namespace_keys:
  - 默认命名空间
- key: CMDB模型实例TOPN::cmdb/get_cmdb_model_instance_top
  name: CMDB 实例排行（按模型/分类）
  rest_api: cmdb/get_cmdb_model_instance_top
  desc: 按实例数降序排行；默认按模型，也可按分类汇总。老 CMDB 盘默认按模型，勿改默认值。
  is_active: true
  params:
  - name: limit
    type: number
    value: 5
    alias_name: 返回条数
    filterType: params
  - name: classification_id
    type: string
    value: ''
    alias_name: 模型分类 ID
    filterType: params
  - name: group_by
    type: string
    value: model
    alias_name: 排行维度
    filterType: params
  - name: organization
    type: string
    value: ''
    alias_name: 组织
    filterType: filter
    inputConfig:
      control: organization
  tags:
  - CMDB
  chart_type:
  - table
  - topN
  field_schema:
  - key: model
    title: 模型名称
    value_type: string
    description: 模型显示名称（排行维度为模型时使用）
  - key: model_id
    title: 模型ID
    value_type: string
    description: 模型唯一标识（排行维度为模型时使用）
  - key: classification
    title: 分类名称
    value_type: string
    description: 分类显示名称；按模型排时为所属分类，按分类排时为排行项
  - key: classification_id
    title: 分类ID
    value_type: string
    description: 分类标识
  - key: count
