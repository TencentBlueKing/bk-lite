datasources:
- key: CMDB 3D机房布局::cmdb/get_room3d_layout
  name: CMDB 3D机房布局
  rest_api: cmdb/get_room3d_layout
  desc: 查询指定 CMDB 机房的 3D 机柜布局数据
  is_active: true
  params:
  - name: server_room_id
    type: string
    value: ''
    alias_name: 机房ID
    filterType: params
    inputConfig:
      control: select
      componentSwitch: true
      optionsSource:
        type: dynamic
        sourceRef:
          type: rest_api
          value: cmdb/get_room_list
        valueField: inst_uuid
        labelField: inst_name
  tags:
  - CMDB
  chart_type:
  - room3D
  field_schema: []
  namespace_keys:
  - 默认命名空间
- key: CMDB 变更趋势::cmdb/get_change_trend
  name: CMDB 变更趋势
  rest_api: cmdb/get_change_trend
  desc: 跟随时间范围，统计实例新增、修改和删除趋势，可按模型筛选
  is_active: true
  params:
  - name: time
    type: timeRange
    value: 10080
    alias_name: 时间范围
    filterType: filter
  - name: model_id
    type: string
    value: ''
    alias_name: 模型 ID
    filterType: params
  tags:
  - CMDB
  chart_type:
  - line
  - bar
  field_schema: []
  namespace_keys:
  - 默认命名空间
- key: CMDB模型实例TOPN::cmdb/get_cmdb_model_instance_top
  name: CMDB 模型实例排行
  rest_api: cmdb/get_cmdb_model_instance_top
  desc: 按实例数从高到低展示模型，可按分类筛选
  is_active: true
  params:
  - name: limit
    type: number
    value: 5
    alias_name: 返回条数
    filterType: params
  - name: classification_id
    type: string
    value: ''
    alias_name: 模型分类 ID
    filterType: params
  tags:
  - CMDB
  chart_type:
  - table
  - topN
  field_schema:
  - key: model
    title: 模型名称
    value_type: string
    description: 模型显示名称
  - key: model_id
    title: 模型ID
    value_type: string
    description: 模型唯一标识
  - key: classification
    title: 分类名称
    value_type: string
    description: 所属分类显示名称
  - key: classification_id
    title: 分类ID
    value_type: string
    description: 所属分类标识
  - key: count
    title: 实例数
    value_type: number
    description: 该模型下实例数量
  namespace_keys:
  - 默认命名空间
- key: CMDB采集健康统计::cmdb/get_cmdb_collect_statistics
  name: CMDB 采集任务状态
  rest_api: cmdb/get_cmdb_collect_statistics
  desc: 采集任务总数、周期任务数及最近执行状态分布
  is_active: true
  params: []
  tags:
  - CMDB
  chart_type:
  - single
  field_schema:
  - key: task_count
    title: 任务总数
    value_type: number
    description: 当前可见采集任务总数
  - key: interval_task_count
    title: 周期任务数
    value_type: number
    description: 开启周期巡检的采集任务数量
  - key: success_count
    title: 成功任务数
    value_type: number
    description: 最近状态为成功的任务数
  - key: error_count
    title: 异常任务数
    value_type: number
    description: 最近状态为异常的任务数
  - key: running_count
    title: 运行中任务数
    value_type: number
    description: 当前状态为运行中的任务数
  - key: timeout_count
    title: 超时任务数
    value_type: number
    description: 当前状态为超时的任务数
  - key: never_run_count
    title: 从未执行任务数
    value_type: number
    description: 当前状态为未执行的任务数
  - key: partial_success_count
    title: 部分成功任务数
    value_type: number
    description: 最近状态为部分成功的任务数
  namespace_keys:
  - 默认命名空间
- key: 主机操作系统分布::get_instance_group_by
  name: 主机操作系统分布
  rest_api: get_instance_group_by
  desc: 按主机 os_type 统计实例数；未填写类型归为 unknown
  is_active: true
  params:
  - name: model_id
    type: string
    value: host
    alias_name: 模型 ID
    filterType: fixed
  - name: field
    type: string
    value: os_type
    alias_name: 分组字段
    filterType: fixed
  tags:
  - CMDB
  chart_type:
  - pie
  - multiValue
  field_schema:
  - key: name
    title: 操作系统
    value_type: string
    description: 主机操作系统类型
  - key: value
    title: 实例数
    value_type: number
    description: 该操作系统类型下的主机实例数
  namespace_keys:
  - 默认命名空间
