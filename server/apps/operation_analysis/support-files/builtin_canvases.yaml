    - h: 1080
      w: 1920
      x: 0
      y: 0
      id: builtin-room3d-main
      type: widget
      title: 3D机房
      zIndex: 1
      chartType: room3D
      valueConfig:
        chartType: room3D
        dataSource: CMDB 3D机房布局::cmdb/get_room3d_layout
