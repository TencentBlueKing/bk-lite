- key: 告警源总数/启用率/活跃数::alert/get_alert_source_statistics
  name: 告警源配置与活跃数
  rest_api: alert/get_alert_source_statistics
  desc: 告警源总数、启用数和启用率为配置快照；活跃告警源数统计时间范围内至少收到一条事件的来源
  is_active: true
  params:
  - name: time
    type: timeRange
    value: 10080
    alias_name: 时间范围
    filterType: filter
  tags:
  - 告警
  chart_type:
  - single
  field_schema:
  - key: total_count
    title: 告警源总数
    value_type: number
    description: 当前可见的告警源配置总数，不受时间范围影响
