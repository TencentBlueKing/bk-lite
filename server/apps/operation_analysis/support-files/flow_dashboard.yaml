# 内置画布：Flow 网络流量分析仪表盘。
# 由 init_builtin_canvases 与 builtin_canvases.yaml 合并加载。
# 数据源以 source_api.json 为准；本文件保留同名定义以便单独导入。
# 组件按流量概览 / 趋势 / 协议与排行 / 会话 / 通信关系分组。
meta:
  schema_version: 1.2.0
  exported_at: '2026-09-03T14:00:00+08:00'
  source:
    organization_id: 0
  object_counts:
    dashboards: 1
    topologies: 0
    screens: 0
    reports: 0
    architectures: 0
    datasources: 3
    namespaces: 1
dashboards:
- key: dashboard::Flow网络流量分析仪表盘
  name: Flow 网络流量分析仪表盘
  desc: 按所选网络设备查看 Flow 总流量、趋势、协议分布、TopN、会话与通信关系。
  other:
    timeSelector:
      selectValue: 360
      rangePickerVaule: null
  view_sets:
  - id: group-overview
    itemType: group
    name: 流量概览
    description: 所选设备在时间窗内的总流量、包速、平均包大小与有效采样率
    x: 0
    y: 0
    w: 12
    h: 4
    headerH: 1
    sizeToContent: true
    subGridOpts:
      children:
      - h: 3
        w: 3
        x: 0
        y: 0
        id: flow-kpi-bytes
        name: 总流量
        itemType: widget
        description: 所选设备归一化后的 Flow 字节速率
        valueConfig:
          chartType: single
          dataSource: 受控指标排行::monitor/query_metric_series
          selectedFields:
          - value
          unitId: bps
          conversionFactor: 8
          decimalPlaces: 1
          filterBindings:
            instance_ids__string: true
            time__timeRange: true
          dataSourceParams:
          - &id001
            name: instance_ids
            type: string
            value: []
            alias_name: 设备
            filterType: filter
            inputConfig: &id006
              control: select
              multiple: true
              picker: table
              optionsSource:
                type: dynamic
                sourceRef:
                  type: rest_api
                  value: monitor/get_monitor_instance_list
                valueField: instance_id
                labelField: display_name
          - name: metric
            type: string
            value: device_flow_bytes_rate
            alias_name: 指标
            filterType: params
            required: true
            inputConfig:
              control: select
              componentSwitch: false
              optionsSource:
                type: static
                staticItems: &id007
                - label: 总流量
                  value: device_flow_bytes_rate
                - label: 总包速
                  value: device_flow_packets_rate
                - label: 平均包大小
                  value: device_flow_avg_packet_size
                - label: 有效采样率
                  value: device_flow_effective_sampling_rate
                - label: 协议流量
                  value: device_flow_protocol_bytes_rate
                - label: Top 源地址
                  value: device_flow_top_src_bytes_rate
                - label: Top 目的地址
                  value: device_flow_top_dst_bytes_rate
                - label: Top 源 IP+端口
                  value: device_flow_top_src_ip_port_bytes_rate
                - label: Top 目标 IP+端口
                  value: device_flow_top_dst_ip_port_bytes_rate
                - label: 源端口流量
                  value: device_flow_src_port_bytes_rate
                - label: 目的端口流量
                  value: device_flow_dst_port_bytes_rate
                - label: Top 会话
                  value: device_flow_top_conversation_bytes_rate
          - &id008
            name: mode
            type: string
            value: instant
            alias_name: 查询模式
            filterType: fixed
            required: true
          - &id004
            name: time
            type: timeRange
            value: 360
            alias_name: 时间范围
            filterType: filter
          thresholdColors: &id002
          - color: '#366ce4'
            value: '70'
          - color: '#366ce4'
            value: '30'
          - color: '#366ce4'
            value: '0'
      - h: 3
        w: 3
        x: 3
        y: 0
        id: flow-kpi-packets
        name: 总包速
        itemType: widget
        description: 所选设备归一化后的 Flow 包速率
        valueConfig:
          chartType: single
          dataSource: 受控指标排行::monitor/query_metric_series
          selectedFields:
