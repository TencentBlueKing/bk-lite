    alias_name: 组织
    filterType: filter
    inputConfig:
      control: organization
  tags:
  - 日志
  chart_type:
  - single
  - gauge
  field_schema:
  - key: collect_instance_count
    title: 采集实例数
    value_type: number
    description: 当前组织可见的日志采集实例数
  - key: extractor_count
