# 内置画布：僵尸机报表。
# 由 init_builtin_canvases 与 builtin_canvases.yaml 合并加载。
# 数据源以 source_api.json 为准；本文件保留同名定义以便单独导入。
# 第一期只含统一筛选与一张表格，不是仪表盘。
meta:
  schema_version: 1.2.0
  exported_at: '2026-09-09T17:00:00+08:00'
  source:
    organization_id: 0
  object_counts:
    dashboards: 0
    topologies: 0
    screens: 0
    reports: 1
    architectures: 0
    datasources: 2
    namespaces: 1
dashboards: []
topologies: []
architectures: []
screens: []
reports:
- key: report::僵尸机报表
  name: 僵尸机报表
  desc: 按所选应用系统下已监控 CMDB 主机查询时间窗内登录、入包、CPU/内存/IO，并按闲机口径阈值筛出疑似僵尸机。时间默认 7 天；阈值不随窗口缩放；登录未采集不按 0 过滤。未选应用系统不退回全量。
  other: {}
  view_sets:
    schema_version: 1
    filters:
    - id: system_uuids__string
      key: system_uuids
      name: 应用系统
      type: string
      defaultValue: []
      order: 0
      enabled: true
      inputMode: select
      inputConfig: &systemOptions
        control: select
        multiple: true
        optionsSource:
          type: dynamic
          sourceRef:
            type: rest_api
            value: cmdb/list_application_systems
          valueField: inst_uuid
          labelField: display_name
    - id: time__timeRange
      key: time
      name: 时间范围
      type: timeRange
      defaultValue:
        selectValue: 10080
        rangePickerVaule: null
      order: 1
      enabled: true
    - id: os_type__string
      key: os_type
      name: 系统类型
      type: string
      defaultValue: ''
      order: 2
      enabled: true
      inputConfig: &osTypeOptions
        control: select
        optionsSource:
          type: static
          staticItems:
          - label: Linux
            value: '1'
          - label: Windows
            value: '2'
    - id: zombie_whitelist__string
      key: zombie_whitelist
      name: 僵尸机白名单
      type: string
      defaultValue: ''
      order: 3
      enabled: true
      inputConfig: &whitelistOptions
        control: select
        optionsSource:
          type: static
          staticItems:
          - label: 是
            value: 'yes'
          - label: 否
            value: 'no'
    - id: login_min__number
      key: login_min
      name: 登录次数下限
      type: number
      defaultValue: -1
      order: 4
      enabled: true
    - id: login_max__number
      key: login_max
      name: 登录次数上限
      type: number
      defaultValue: 2
      order: 5
      enabled: true
    - id: packets_recv_max_min__number
      key: packets_recv_max_min
      name: 入包峰值下限(pps)
      type: number
      defaultValue: -1
      order: 6
      enabled: true
    - id: packets_recv_max_max__number
      key: packets_recv_max_max
      name: 入包峰值上限(pps)
      type: number
      defaultValue: 200
      order: 7
      enabled: true
    - id: packets_recv_avg_min__number
      key: packets_recv_avg_min
      name: 入包均值下限(pps)
      type: number
      defaultValue: -1
      order: 8
      enabled: true
    - id: packets_recv_avg_max__number
      key: packets_recv_avg_max
      name: 入包均值上限(pps)
      type: number
      defaultValue: 50
      order: 9
      enabled: true
    - id: cpu_avg_min__number
      key: cpu_avg_min
      name: CPU均值下限(%)
      type: number
      defaultValue: -1
      order: 10
      enabled: true
    - id: cpu_avg_max__number
      key: cpu_avg_max
      name: CPU均值上限(%)
      type: number
      defaultValue: 8
      order: 11
      enabled: true
    - id: cpu_max_min__number
      key: cpu_max_min
      name: CPU峰值下限(%)
      type: number
      defaultValue: -1
      order: 12
      enabled: true
    - id: cpu_max_max__number
      key: cpu_max_max
      name: CPU峰值上限(%)
      type: number
      defaultValue: 20
      order: 13
      enabled: true
    - id: mem_avg_min__number
      key: mem_avg_min
      name: 内存均值下限(%)
      type: number
      defaultValue: -1
      order: 14
      enabled: true
    - id: mem_avg_max__number
      key: mem_avg_max
      name: 内存均值上限(%)
      type: number
      defaultValue: 25
      order: 15
      enabled: true
    - id: mem_max_min__number
      key: mem_max_min
      name: 内存峰值下限(%)
      type: number
      defaultValue: -1
      order: 16
      enabled: true
    - id: mem_max_max__number
      key: mem_max_max
      name: 内存峰值上限(%)
      type: number
      defaultValue: 40
      order: 17
      enabled: true
    - id: io_max_min__number
      key: io_max_min
      name: IO峰值下限(%)
      type: number
      defaultValue: -1
      order: 18
      enabled: true
    - id: io_max_max__number
      key: io_max_max
      name: IO峰值上限(%)
      type: number
      defaultValue: 10
      order: 19
      enabled: true
    sections:
