          unitId: percent
          decimalPlaces: 1
          filterBindings:
            instance_ids__stringList: true
          dataSourceParams:
          - *id001
          thresholdColors:
          - color: '#7c6cf0'
            value: '70'
          - color: '#7c6cf0'
            value: '30'
          - color: '#7c6cf0'
            value: '0'
      - h: 3
