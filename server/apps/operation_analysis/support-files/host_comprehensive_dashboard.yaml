# 可导入的非内置画布：主机综合监控仪表盘。
# 不会被 init_builtin_canvases 加载。
# 导入前请先执行 init_source_api_data；若环境已有同名内置数据源，冲突策略选「跳过」。
# 健康/异常/无数据主机数不在本画布中。
# 组件按资源概览 / 核心使用率 / Top10 / 负载与流量 / 磁盘 IO / 写入与进程分组。
meta:
  schema_version: 1.2.0
  exported_at: '2026-08-20T18:00:00+08:00'
  source:
    organization_id: 0
  object_counts:
    dashboards: 1
    topologies: 0
    screens: 0
    reports: 0
    architectures: 0
    datasources: 4
    namespaces: 0
dashboards:
- key: dashboard::主机综合监控仪表盘
  name: 主机综合监控仪表盘
  desc: 按所选监控主机查看 CPU/内存/磁盘均值与最高值、趋势和 Top10。不含健康/异常主机数。导入后不是内置画布。
  other:
    timeSelector:
      selectValue: 360
      rangePickerVaule: null
  view_sets:
  - id: group-overview
    itemType: group
    name: 资源概览
    description: 所选主机数与 CPU/内存/磁盘均值、最高值
    x: 0
    y: 0
    w: 12
    h: 4
    headerH: 1
    sizeToContent: true
    subGridOpts:
      children:
      - h: 3
        w: 2
        x: 0
        y: 0
        id: host-kpi-count
        name: 所选主机
        itemType: widget
        description: 当前筛选选中的主机数
        valueConfig:
          chartType: single
          dataSource: 主机资源快照::monitor/get_host_resource_snapshot
          selectedFields:
          - host_count
          filterBindings:
            instance_ids__stringList: true
          dataSourceParams:
          - &id001
            name: instance_ids
            type: stringList
            value: []
            alias_name: 主机
            filterType: filter
            inputConfig: &id006
              control: select
              multiple: true
              picker: table
              optionsSource:
                type: dynamic
                sourceRef:
                  type: rest_api
                  value: monitor/get_host_instance_list
                valueField: instance_id
                labelField: display_name
          thresholdColors: &id002
          - color: '#366ce4'
            value: '70'
          - color: '#366ce4'
            value: '30'
          - color: '#366ce4'
            value: '0'
      - h: 3
        w: 2
        x: 2
        y: 0
        id: host-kpi-avg-cpu
        name: 平均 CPU
        itemType: widget
        description: 所选主机 CPU 使用率均值
        valueConfig:
          chartType: single
          dataSource: 主机资源快照::monitor/get_host_resource_snapshot
          selectedFields:
          - avg_cpu
          unitId: percent
          decimalPlaces: 1
          filterBindings:
            instance_ids__stringList: true
          dataSourceParams:
          - *id001
          thresholdColors: *id002
      - h: 3
        w: 2
        x: 4
        y: 0
        id: host-kpi-avg-memory
        name: 平均内存
        itemType: widget
        description: 所选主机内存使用率均值
        valueConfig:
          chartType: single
          dataSource: 主机资源快照::monitor/get_host_resource_snapshot
          selectedFields:
