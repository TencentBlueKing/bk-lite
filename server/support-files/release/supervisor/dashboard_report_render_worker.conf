[program:dashboard_report_render_worker]
command=celery -A apps.core.celery worker --loglevel=info --pool threads --concurrency=%(ENV_DASHBOARD_REPORT_RENDER_CONCURRENCY)s -Q dashboard_report_render
directory=/apps
autostart=true
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
