[program:job_celery]
command=celery -A apps.core.celery worker --loglevel=info --pool prefork --concurrency=%(ENV_JOB_CELERY_CONCURRENCY)s --max-tasks-per-child=%(ENV_CELERY_MAX_TASKS_PER_CHILD)s --max-memory-per-child=%(ENV_CELERY_MAX_MEMORY_PER_CHILD)s -Q job -n job@%%h
directory=/apps
autostart=true
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
