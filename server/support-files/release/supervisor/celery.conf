[program:celery]
; TODO: keep a single default Celery worker in this rollout. If long-running
; controller install tasks begin to contend with short tasks, split this into
; dedicated short/long workers and queues in a later optimization pass.
; threads 池无法回收进程 RSS，且 Celery 5.4 对阻塞 IO 接近串行。prefork + 子进程回收才能把内存还给 OS。
command=celery -A apps.core.celery worker --loglevel=info --pool prefork --concurrency=%(ENV_CELERY_CONCURRENCY)s --max-tasks-per-child=%(ENV_CELERY_MAX_TASKS_PER_CHILD)s --max-memory-per-child=%(ENV_CELERY_MAX_MEMORY_PER_CHILD)s
directory=/apps
autostart=true
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
