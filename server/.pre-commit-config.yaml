default_stages: [pre-commit]
repos:
  - repo: https://github.com/asottile/pyupgrade
    rev: v2.31.0
    hooks:
      - id: pyupgrade
        language_version: python3.12
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
    - id: check-merge-conflict
  - repo: https://github.com/psf/black
    rev: 23.1.0
    hooks:
    - id: black
      language_version: python3.12
      args: [ "--config=./pyproject.toml" ]
  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        args: [ "--settings-path=./server/.isort.cfg" ]
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
    - id: flake8
      additional_dependencies: ["flake8==7.1.1"]
      language_version: python3.12
      args: ["--config=./server/.flake8"]
  - repo: local
    hooks:
      - id: check-migrate
        name: check migrate
        entry: python3 ./server/scripts/check_migrate/check_migrate.py
        language: system
        types: [python]
      - id: check-commit-message
        name: Check commit message
        entry: python3 ./server/scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: check-requirements
        name: Check Requirements
        entry: python3 ./server/scripts/check_requirements.py
        language: system
      - id: ops-analysis-i18n
        name: ops-analysis i18n catalogs
        entry: uv run --directory server pytest apps/operation_analysis/tests/test_language_catalog_i18n.py apps/operation_analysis/tests/test_user_messages.py apps/system_mgmt/tests/test_ops_analysis_permission_tabs.py -o addopts= -q --no-cov
        language: system
        pass_filenames: false
        files: ^server/apps/(operation_analysis/language/|system_mgmt/language/|operation_analysis/tests/test_language_catalog_i18n\.py|operation_analysis/tests/test_user_messages\.py|system_mgmt/tests/test_ops_analysis_permission_tabs\.py)
