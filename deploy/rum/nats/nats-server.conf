# Local RUM control-plane NATS (password auth for fixture convenience).
# Production should prefer NKey/TLS as in collector/internal/rum/controller/testdata/nats.conf.

port: 4222
http_port: 8222
server_name: rum-control-fixture
max_payload: 8388608
jetstream: disabled

authorization {
  users: [
    {
      user: $RUM_NATS_CTL_USERNAME
      password: $RUM_NATS_CTL_PASSWORD
      permissions: {
        publish: { allow: ["rum.v1.control.>"], deny: ["agents.v1.>", "otel.v1.>", "apm.>"] }
        subscribe: { allow: ["_INBOX.>"], deny: ["agents.v1.>", "otel.v1.>", "apm.>", "rum.v1.control.>"] }
      }
    },
    {
      user: $RUM_NATS_CONTROLLER_USERNAME
      password: $RUM_NATS_CONTROLLER_PASSWORD
      permissions: {
        publish: { allow: ["_INBOX.>"], deny: ["agents.v1.>", "otel.v1.>", "apm.>"] }
        subscribe: { allow: ["rum.v1.control.>", "_INBOX.>"], deny: ["agents.v1.>", "otel.v1.>", "apm.>"] }
      }
    }
  ]
}
