port: 4222
http_port: 8222
server_name: rum-control
max_payload: 8388608

tls {
  cert_file: "/run/secrets/rum_nats_tls_cert"
  key_file: "/run/secrets/rum_nats_tls_key"
  ca_file: "/run/secrets/rum_nats_tls_ca"
  timeout: 3
}

authorization {
  users: [
    {
      nkey: $RUM_CTL_PUBLIC_NKEY
      permissions: {
        publish: { allow: ["rum.v1.control.>"], deny: ["agents.v1.>", "otel.v1.>"] }
        subscribe: { allow: ["_INBOX.>"], deny: ["agents.v1.>", "otel.v1.>", "rum.v1.control.>"] }
      }
    },
    {
      nkey: $RUM_CONTROLLER_PUBLIC_NKEY
      permissions: {
        publish: { allow: ["_INBOX.>"], deny: ["agents.v1.>", "otel.v1.>"] }
        subscribe: { allow: ["rum.v1.control.>"], deny: ["agents.v1.>", "otel.v1.>"] }
      }
    }
  ]
}

jetstream: disabled
