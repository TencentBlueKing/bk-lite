# BK-Lite RUM gateway — local/dev profile.
# Collect:  :4319/rum/v1/collect
# Replay:   :4320/rum/v1/replay
# Health:   :13135
#
# Required env (see env/rum.gateway.dev.env.example):
#   RUM_IDENTITY_HMAC_CURRENT (>=32 chars)
#   RUM_ADMISSION_REDIS_URL
#   RUM_SESSION_REDIS_URL
#   RUM_REPLAY_REDIS_URL
#   RUM_VICTORIA_LOGS_ENDPOINT
#   RUM_VICTORIA_TRACES_ENDPOINT
#   RUM_MINIO_ENDPOINT / RUM_MINIO_ACCESS_KEY / RUM_MINIO_SECRET_KEY / RUM_MINIO_SECURE

receivers:
  faro/rum:
    endpoint: 0.0.0.0:4319
    tenant_id: ${env:RUM_TENANT_ID}
    identity_hmac_secret: ${env:RUM_IDENTITY_HMAC_CURRENT}
    identity_hmac_version: ${env:RUM_IDENTITY_HMAC_CURRENT_VERSION}
    identity_hmac_previous_secret: ${env:RUM_IDENTITY_HMAC_PREVIOUS}
    identity_hmac_previous_version: ${env:RUM_IDENTITY_HMAC_PREVIOUS_VERSION}
    admission_redis_url: ${env:RUM_ADMISSION_REDIS_URL}
    max_compressed_bytes: 1048576
    max_decompressed_bytes: 4194304
    max_compression_ratio: 100
    max_items: 1000
    max_json_depth: 32
    max_context_entries: 32
    max_context_key_bytes: 128
    max_context_value_bytes: 1024
    read_header_timeout: 5s
    read_timeout: 15s
    idle_timeout: 30s
  rum_replay:
    endpoint: 0.0.0.0:4320
    tenant_id: ${env:RUM_TENANT_ID}
    identity_hmac_secret: ${env:RUM_IDENTITY_HMAC_CURRENT}
    identity_hmac_version: ${env:RUM_IDENTITY_HMAC_CURRENT_VERSION}
    identity_hmac_previous_secret: ${env:RUM_IDENTITY_HMAC_PREVIOUS}
    identity_hmac_previous_version: ${env:RUM_IDENTITY_HMAC_PREVIOUS_VERSION}
    admission_redis_url: ${env:RUM_ADMISSION_REDIS_URL}
    max_compressed_bytes: 1048576
    max_decompressed_bytes: 4194304
    max_compression_ratio: 100
    max_events: 10000
    max_event_bytes: 4194304
    max_json_depth: 64
    read_header_timeout: 5s
    read_timeout: 15s
    idle_timeout: 30s

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  rumsession:
    redis_url: ${env:RUM_SESSION_REDIS_URL}
    idle_timeout: 15m
    maximum_length: 4h
    state_ttl: 5h
    aof_timeout: 2s
  batch/rum_agg:
    timeout: ${env:RUM_AGG_BATCH_TIMEOUT:-60s}
  deltatocumulative/rum:
    max_stale: 10m
    max_streams: ${env:RUM_AGG_MAX_STREAMS:-420000}
  rumroutecap:
    redis_url: ${env:RUM_SESSION_REDIS_URL}
    shard: ${env:RUM_AGG_SHARD}

exporters:
  rum_victoria/rum:
    logs_endpoint: ${env:RUM_VICTORIA_LOGS_ENDPOINT}/insert/opentelemetry/v1/logs
    admission_redis_url: ${env:RUM_ADMISSION_REDIS_URL}
    max_queue_age: 336h
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/rum_logs
      sizer: bytes
      queue_size: 536870912
      num_consumers: 2
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      max_elapsed_time: 336h
  rum_victoria/traces:
    traces_endpoint: ${env:RUM_VICTORIA_TRACES_ENDPOINT}/insert/opentelemetry/v1/traces
    admission_redis_url: ${env:RUM_ADMISSION_REDIS_URL}
    max_queue_age: 168h
    timeout: 10s
    sending_queue:
      enabled: true
      storage: file_storage/rum_traces
      sizer: bytes
      queue_size: 268435456
      num_consumers: 1
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      max_elapsed_time: 336h
  rum_replay:
    timeout: 15s
    max_queue_age: 336h
    minio_endpoint: ${env:RUM_MINIO_ENDPOINT}
    minio_access_key: ${env:RUM_MINIO_ACCESS_KEY}
    minio_secret_key: ${env:RUM_MINIO_SECRET_KEY}
    minio_secure: ${env:RUM_MINIO_SECURE}
    minio_bucket: rum-replay
    redis_url: ${env:RUM_REPLAY_REDIS_URL}
    sending_queue:
      enabled: true
      storage: file_storage/rum_replay
      sizer: bytes
      queue_size: 2147483648
      num_consumers: 4
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      max_elapsed_time: 336h
  prometheus_remote_write/rum_agg:
    endpoint: ${env:AGG_VICTORIAMETRICS_WRITE_URL}
    timeout: 10s
    external_labels:
      shard: ${env:RUM_AGG_SHARD}
    resource_to_telemetry_conversion:
      enabled: true
    target_info:
      enabled: false
    disable_scope_info: true
    remote_write_queue:
      enabled: false
    retry_on_failure:
      enabled: false

connectors:
  forward/rum_agg: {}
  signal_to_metrics/rum:
    error_mode: ignore
    logs:
      - name: rum.views
        description: Page views. Matches Server LogsQL "rum.event.type":view.
        include_resource_attributes: &rum_agg_resource
          - key: tenant.id
          - key: rum.traffic.class
            default_value: unknown
        attributes: &rum_agg_attributes
          - key: rum.application
            default_value: unknown
          - key: rum.environment
            default_value: unknown
          - key: rum.aggregate.route
            default_value: "其他"
        conditions:
          - 'log.attributes["rum.event.type"] == "view"'
        sum:
          value: "1"
          monotonic: true
      - name: rum.js_errors
        description: JavaScript exceptions. Matches Server LogsQL "rum.event.type":error.
        include_resource_attributes: *rum_agg_resource
        attributes: *rum_agg_attributes
        conditions:
          - 'log.attributes["rum.event.type"] == "error"'
        sum:
          value: "1"
          monotonic: true
      - name: rum.web_vital.lcp
        description: Largest Contentful Paint. Value unit matches rum.vital.lcp milliseconds.
        unit: ms
        include_resource_attributes: *rum_agg_resource
        attributes: *rum_agg_attributes
        conditions:
          - 'log.attributes["rum.event.type"] == "vital" and log.attributes["rum.vital.lcp"] != nil'
        histogram:
          buckets: [100, 250, 500, 1000, 2500, 4000, 8000, 16000]
          value: 'Double(log.attributes["rum.vital.lcp"])'
      - name: rum.web_vital.inp
        description: Interaction to Next Paint. Value unit matches rum.vital.inp milliseconds.
        unit: ms
        include_resource_attributes: *rum_agg_resource
        attributes: *rum_agg_attributes
        conditions:
          - 'log.attributes["rum.event.type"] == "vital" and log.attributes["rum.vital.inp"] != nil'
        histogram:
          buckets: [50, 100, 200, 500, 1000, 2500]
          value: 'Double(log.attributes["rum.vital.inp"])'
      - name: rum.web_vital.cls
        description: Cumulative Layout Shift. Value matches unitless rum.vital.cls.
        include_resource_attributes: *rum_agg_resource
        attributes: *rum_agg_attributes
        conditions:
          - 'log.attributes["rum.event.type"] == "vital" and log.attributes["rum.vital.cls"] != nil'
        histogram:
          buckets: [0.01, 0.05, 0.1, 0.25, 0.5, 1]
          value: 'Double(log.attributes["rum.vital.cls"])'
      - name: rum.web_vital.fcp
        description: First Contentful Paint. Value unit matches rum.vital.fcp milliseconds.
        unit: ms
        include_resource_attributes: *rum_agg_resource
        attributes: *rum_agg_attributes
        conditions:
          - 'log.attributes["rum.event.type"] == "vital" and log.attributes["rum.vital.fcp"] != nil'
        histogram:
          buckets: [100, 250, 500, 1000, 1800, 3000, 6000, 12000]
          value: 'Double(log.attributes["rum.vital.fcp"])'
      - name: rum.web_vital.ttfb
        description: Time to First Byte. Value unit matches rum.vital.ttfb milliseconds.
        unit: ms
        include_resource_attributes: *rum_agg_resource
        attributes: *rum_agg_attributes
        conditions:
          - 'log.attributes["rum.event.type"] == "vital" and log.attributes["rum.vital.ttfb"] != nil'
        histogram:
          buckets: [50, 100, 200, 400, 800, 1800, 4000]
          value: 'Double(log.attributes["rum.vital.ttfb"])'

extensions:
  health_check:
    endpoint: 0.0.0.0:13135
  file_storage/rum_logs:
    directory: ${env:RUM_QUEUE_DIR}/logs
    create_directory: true
    fsync: true
  file_storage/rum_traces:
    directory: ${env:RUM_QUEUE_DIR}/traces
    create_directory: true
    fsync: true
  file_storage/rum_replay:
    directory: ${env:RUM_QUEUE_DIR}/replay
    create_directory: true
    fsync: true

service:
  extensions: [health_check, file_storage/rum_logs, file_storage/rum_traces, file_storage/rum_replay]
  pipelines:
    logs/rum:
      receivers: [faro/rum]
      processors: [memory_limiter, rumsession]
      exporters: [rum_victoria/rum, forward/rum_agg]
    logs/rum_agg:
      receivers: [forward/rum_agg]
      processors: [rumroutecap]
      exporters: [signal_to_metrics/rum]
    metrics/rum_agg:
      receivers: [signal_to_metrics/rum]
      processors: [batch/rum_agg, deltatocumulative/rum]
      exporters: [prometheus_remote_write/rum_agg]
    traces/rum:
      receivers: [faro/rum]
      processors: [memory_limiter]
      exporters: [rum_victoria/traces]
    logs/replay:
      receivers: [rum_replay]
      processors: [memory_limiter, rumsession]
      exporters: [rum_replay]
  telemetry:
    resource:
      attributes:
        - name: service.instance.id
          value: ${env:RUM_AGG_SHARD}
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
