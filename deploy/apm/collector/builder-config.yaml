dist:
  module: github.com/bk-lite/apm-collector
  name: bklite-otelcol
  description: BK-Lite OpenTelemetry Collector with NATS JetStream transport and entry aggregate metrics
  version: 0.153.0-bklite.3
  output_path: ./_build
  otelcol_version: 0.153.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/basicauthextension v0.153.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.153.0
  - gomod: github.com/bk-lite/apm-collector/receiver/natsjetstreamreceiver v0.0.0
    path: ./receiver/natsjetstreamreceiver

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.153.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/deltatocumulativeprocessor v0.153.0
  - gomod: github.com/bk-lite/apm-collector/processor/traceguardprocessor v0.0.0
    path: ./processor/traceguardprocessor

connectors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/spanmetricsconnector v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/countconnector v0.153.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusremotewriteexporter v0.153.0
  - gomod: github.com/bk-lite/apm-collector/exporter/natsjetstreamexporter v0.0.0
    path: ./exporter/natsjetstreamexporter
