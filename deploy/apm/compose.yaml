name: bk-lite-apm

services:
  apm-nats:
    image: ${APM_NATS_IMAGE:-nats:2.10.25-alpine}
    restart: unless-stopped
    command: [--config=/etc/nats/nats-server.conf]
    environment:
      NATS_ADMIN_USERNAME: ${APM_NATS_ADMIN_USERNAME:-apm_admin}
      NATS_ADMIN_PASSWORD: ${APM_NATS_ADMIN_PASSWORD:-admin-contract-password}
      NATS_REGION_USERNAME: ${APM_NATS_REGION_USERNAME:-apm_region}
      NATS_REGION_PASSWORD: ${APM_NATS_REGION_PASSWORD:-region-contract-password}
      NATS_REGION_PUBLISH_SUBJECT: apm.traces.${APM_CLOUD_REGION_ID:-local}
      NATS_SYSTEM_USERNAME: ${APM_NATS_SYSTEM_USERNAME:-apm_system}
      NATS_SYSTEM_PASSWORD: ${APM_NATS_SYSTEM_PASSWORD:-system-contract-password}
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - apm_nats_data:/data/jetstream
    ports:
      - "${APM_NATS_MONITOR_BIND:-127.0.0.1}:${APM_NATS_MONITOR_PORT:-18222}:8222"
    mem_limit: ${APM_NATS_MEMORY_LIMIT:-384m}
    cpus: ${APM_NATS_CPU_LIMIT:-1.00}
    security_opt:
      - no-new-privileges:true

  apm-nats-init:
    image: ${APM_NATS_BOX_IMAGE:-natsio/nats-box:0.17.0}
    restart: "no"
    depends_on:
      apm-nats:
        condition: service_started
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        SERVER="nats://${APM_NATS_ADMIN_USERNAME:-apm_admin}:${APM_NATS_ADMIN_PASSWORD:-admin-contract-password}@apm-nats:4222"
        attempts=0
        until nats --server "$${SERVER}" server check connection >/dev/null 2>&1; do
          attempts=$$((attempts + 1))
          [ "$${attempts}" -lt 60 ] || { echo "NATS did not become ready" >&2; exit 1; }
          sleep 1
        done
        nats --server "$${SERVER}" stream info APM_TRACES >/dev/null 2>&1 || \
          nats --server "$${SERVER}" stream add APM_TRACES \
            --subjects "apm.traces.>" --storage file --retention limits --discard old \
            --max-bytes "${APM_NATS_STREAM_MAX_BYTES:-268435456}" \
            --max-age "${APM_NATS_STREAM_MAX_AGE:-24h}" \
            --max-msg-size "${APM_NATS_MAX_MESSAGE_BYTES:-8388608}" \
            --dupe-window "${APM_NATS_DUPLICATE_WINDOW:-2m}" --replicas 1 --defaults
        nats --server "$${SERVER}" consumer info APM_TRACES BKLITE_APM_SYSTEM >/dev/null 2>&1 || \
          nats --server "$${SERVER}" consumer add APM_TRACES BKLITE_APM_SYSTEM \
            --filter "apm.traces.>" --pull --deliver all --ack explicit \
            --wait "${APM_NATS_ACK_WAIT:-60s}" \
            --max-deliver "${APM_NATS_MAX_DELIVER:-8}" \
            --max-pending "${APM_NATS_MAX_ACK_PENDING:-256}" --replay instant --defaults
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  apm-regional-queue-init:
    image: ${APM_QUEUE_INIT_IMAGE:-busybox:1.37.0}
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        chown "${APM_COLLECTOR_UID:-65532}:${APM_COLLECTOR_GID:-65532}" /var/lib/otelcol/queue
        chmod 0700 /var/lib/otelcol/queue
    network_mode: none
    read_only: true
    volumes:
      - apm_regional_queue:/var/lib/otelcol/queue
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true

  apm-regional-collector:
    image: ${APM_COLLECTOR_IMAGE:-bklite/apm-otel-collector:0.153.0-bklite.1}
    build:
      context: ./collector
    restart: unless-stopped
    user: "${APM_COLLECTOR_UID:-65532}:${APM_COLLECTOR_GID:-65532}"
    command: [--config=/etc/bklite-apm/regional.yaml]
    depends_on:
      apm-regional-queue-init:
        condition: service_completed_successfully
      apm-nats-init:
        condition: service_completed_successfully
    environment:
      APM_CLOUD_REGION_ID: ${APM_CLOUD_REGION_ID:-local}
      APM_NATS_URL: ${APM_REGIONAL_NATS_URL:-nats://apm_region:region-contract-password@apm-nats:4222}
      APM_NATS_CREDENTIALS_FILE: ${APM_REGIONAL_NATS_CREDENTIALS_FILE:-}
      APM_NATS_CA_FILE: ${APM_NATS_CA_FILE:-}
      APM_NATS_CERT_FILE: ${APM_NATS_CERT_FILE:-}
      APM_NATS_KEY_FILE: ${APM_NATS_KEY_FILE:-}
      APM_NATS_TLS_SERVER_NAME: ${APM_NATS_TLS_SERVER_NAME:-}
      APM_NATS_MAX_MESSAGE_BYTES: ${APM_NATS_MAX_MESSAGE_BYTES:-8388608}
      APM_COLLECTOR_MEMORY_LIMIT_MIB: ${APM_REGIONAL_MEMORY_LIMIT_MIB:-384}
      APM_COLLECTOR_MEMORY_SPIKE_MIB: ${APM_REGIONAL_MEMORY_SPIKE_MIB:-96}
      APM_TRACE_BATCH_SIZE: ${APM_TRACE_BATCH_SIZE:-256}
      APM_TRACE_BATCH_MAX_SIZE: ${APM_TRACE_BATCH_MAX_SIZE:-512}
      APM_REGIONAL_QUEUE_MAX_BYTES: ${APM_REGIONAL_QUEUE_MAX_BYTES:-1073741824}
    ports:
      - "${APM_OTLP_HTTP_BIND:-127.0.0.1}:${APM_OTLP_HTTP_PORT:-4318}:4318"
      - "${APM_OTLP_GRPC_BIND:-127.0.0.1}:${APM_OTLP_GRPC_PORT:-4317}:4317"
    expose: [13133, 8888]
    volumes:
      - ./otel/regional.yaml:/etc/bklite-apm/regional.yaml:ro
      - apm_regional_queue:/var/lib/otelcol/queue
    healthcheck:
      test: [CMD, /bklite-otelcol, validate, --config=/etc/bklite-apm/regional.yaml]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: ${APM_REGIONAL_CONTAINER_MEMORY_LIMIT:-512m}
    cpus: ${APM_REGIONAL_CPU_LIMIT:-1.00}
    security_opt:
      - no-new-privileges:true

  apm-system-collector:
    image: ${APM_COLLECTOR_IMAGE:-bklite/apm-otel-collector:0.153.0-bklite.1}
    build:
      context: ./collector
    restart: unless-stopped
    user: "${APM_COLLECTOR_UID:-65532}:${APM_COLLECTOR_GID:-65532}"
    command: [--config=/etc/bklite-apm/system.yaml]
    depends_on:
      apm-nats-init:
        condition: service_completed_successfully
      apm-victoria-traces:
        condition: service_started
    environment:
      APM_NATS_URL: ${APM_SYSTEM_NATS_URL:-nats://apm_system:system-contract-password@apm-nats:4222}
      APM_NATS_STREAM: ${APM_NATS_STREAM:-APM_TRACES}
      APM_NATS_CONSUMER: ${APM_NATS_CONSUMER:-BKLITE_APM_SYSTEM}
      APM_NATS_CREDENTIALS_FILE: ${APM_SYSTEM_NATS_CREDENTIALS_FILE:-}
      APM_NATS_CA_FILE: ${APM_NATS_CA_FILE:-}
      APM_NATS_CERT_FILE: ${APM_NATS_CERT_FILE:-}
      APM_NATS_KEY_FILE: ${APM_NATS_KEY_FILE:-}
      APM_NATS_TLS_SERVER_NAME: ${APM_NATS_TLS_SERVER_NAME:-}
      APM_NATS_MAX_ACK_PENDING: ${APM_NATS_MAX_ACK_PENDING:-256}
      APM_COLLECTOR_MEMORY_LIMIT_MIB: ${APM_SYSTEM_MEMORY_LIMIT_MIB:-384}
      APM_COLLECTOR_MEMORY_SPIKE_MIB: ${APM_SYSTEM_MEMORY_SPIKE_MIB:-96}
      APM_VICTORIATRACES_OTLP_ENDPOINT: ${APM_VICTORIATRACES_OTLP_ENDPOINT:-http://apm-victoria-traces:10428/insert/opentelemetry/v1/traces}
    expose: [13133, 8888]
    volumes:
      - ./otel/system.yaml:/etc/bklite-apm/system.yaml:ro
    healthcheck:
      test: [CMD, /bklite-otelcol, validate, --config=/etc/bklite-apm/system.yaml]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: ${APM_SYSTEM_CONTAINER_MEMORY_LIMIT:-512m}
    cpus: ${APM_SYSTEM_CPU_LIMIT:-1.00}
    security_opt:
      - no-new-privileges:true

  apm-victoria-traces:
    image: ${APM_VICTORIATRACES_IMAGE:-victoriametrics/victoria-traces:v0.9.4}
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-traces-data
      - -retentionPeriod=${APM_TRACE_RETENTION:-35d}
      - -httpListenAddr=:10428
      - -opentelemetry.traces.maxRequestSize=${APM_VICTORIATRACES_MAX_REQUEST_SIZE:-8MiB}
      - -servicegraph.enableTask=true
    ports:
      - "${APM_VICTORIATRACES_QUERY_BIND:-127.0.0.1}:${APM_VICTORIATRACES_QUERY_PORT:-10428}:10428"
    volumes:
      - apm_victoria_traces_data:/victoria-traces-data
    healthcheck:
      test: [CMD, /victoria-traces-prod, -version]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: ${APM_VICTORIATRACES_MEMORY_LIMIT:-512m}
    cpus: ${APM_VICTORIATRACES_CPU_LIMIT:-1.00}
    security_opt:
      - no-new-privileges:true

volumes:
  apm_nats_data:
  apm_regional_queue:
  apm_victoria_traces_data:
